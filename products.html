<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b32"><meta name="referrer" content="no-referrer"><title>ONeness · Products</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%2317634c%27/%3E%3Ctext x=%2713%27 y=%2748%27 font-size=%2747%27 fill=%27white%27%3EO%3C/text%3E%3C/svg%3E">
<style>body{margin:0;background:#f4f6f2;font-family:system-ui}#boot{padding:30px;color:#426052}</style>
</head><body>
<div id="app"><p id="boot">Opening ONeness…</p></div>
<script>
(async()=>{

const response=await fetch(new URL('index.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep index.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){
 const node=shared.getElementById(id);if(!node)throw Error('index.html is incomplete.');
 document.head.append(node.cloneNode(true));
}
const source=shared.getElementById('oneness-core');if(!source)throw Error('index.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('products'),{$,esc,money}=A;
const manage=A.can('catalog');let products=[],categories=[];
$('view').innerHTML=A.header(manage?'Product catalogue':'Stock up for your store','Wholesale prices, quantity offers and clear availability.',manage?'<button id="categories">Categories</button><button class="primary" id="new-product">+ Add product</button>':'<a class="button primary" href="checkout.html">Open cart →</a>')+`<div class="filters"><label>Search<input id="search" placeholder="Product name"></label><label>Category<select id="category"><option value="">All categories</option></select></label><label>Availability<select id="availability"><option value="">All products</option><option value="stock">In stock</option><option value="out">Out of stock</option>${manage?'<option value="inactive">Inactive</option>':''}</select></label><label>Sort<select id="sort"><option value="new">Newest</option><option value="price">Wholesale price ↑</option><option value="name">Name A–Z</option></select></label><button id="export">Export CSV</button></div><p class="muted" id="count">Loading products…</p><div class="products" id="products"></div>`;
async function load(){products=await A.all('products.list',{},n=>$('count').textContent=`Loaded ${n} products…`);categories=await A.api('categories.list');$('category').innerHTML='<option value="">All categories</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');render();}
function filtered(){let rows=products.filter(p=>(p.title+' '+p.description).toLowerCase().includes($('search').value.toLowerCase())&&(!$('category').value||p.category_id===Number($('category').value)));const f=$('availability').value;if(f==='stock')rows=rows.filter(p=>p.active&&p.stock>0);if(f==='out')rows=rows.filter(p=>p.stock===0);if(f==='inactive')rows=rows.filter(p=>!p.active);return rows.sort($('sort').value==='price'?(a,b)=>a.price_paise-b.price_paise:$('sort').value==='name'?(a,b)=>a.title.localeCompare(b.title):(a,b)=>b.id-a.id);}
function render(){const rows=filtered();$('count').textContent=`${rows.length} products · Prices shown per unit`;$('products').innerHTML=rows.map(p=>`<article class="product"><div class="photo">${p.images[0]?`<img loading="lazy" src="${esc(p.images[0])}" alt="${esc(p.title)}">`:'◇'}</div><div class="body"><div class="row between"><small>${esc(categories.find(c=>c.id===p.category_id)?.name||'')}</small>${A.badge(p.active?'active':'inactive')}</div><h3 style="margin:9px 0 3px">${esc(p.title)}</h3><small>${p.stock} ${esc(p.unit)} available · Min ${p.min_qty}</small><div class="price">${money(p.price_paise)}<del>${money(p.mrp_paise)}</del></div><div class="bulk">${p.bulk_rules.map(t=>`${t.min_qty}+ at ${money(t.price_paise)}`).join(' · ')||'Standard wholesale price'}</div><div class="row"><button class="small" data-detail="${p.id}">Details</button>${manage?`<button class="small primary" data-edit="${p.id}">Edit</button>`:A.profile.role==='retailer'?`<input aria-label="Quantity for ${esc(p.title)}" id="qty-${p.id}" type="number" min="${p.min_qty}" step="${p.qty_step}" value="${A.cart().find(x=>x.product_id===p.id)?.qty||p.min_qty}"><button class="small primary" data-add="${p.id}" ${!p.stock?'disabled':''}>Add</button>`:''}</div></div></article>`).join('')||'<div class="card empty">No products match your filters.</div>';for(const b of document.querySelectorAll('[data-add]'))b.onclick=()=>{try{A.addCart(products.find(x=>x.id===+b.dataset.add),Number($('qty-'+b.dataset.add).value));}catch(e){A.error(e);}};for(const b of document.querySelectorAll('[data-edit]'))b.onclick=()=>edit(products.find(p=>p.id===+b.dataset.edit));for(const b of document.querySelectorAll('[data-detail]'))b.onclick=()=>detail(products.find(p=>p.id===+b.dataset.detail));}
function detail(p){A.modal(p.title,`<p>${esc(p.description)}</p><p>MRP ${money(p.mrp_paise)} · Wholesale ${money(p.price_paise)} / ${esc(p.unit)}</p><p>Minimum ${p.min_qty}, increments of ${p.qty_step}. Available: ${p.stock}.</p>${A.table(['Minimum quantity','Price'],p.bulk_rules.map(t=>[t.min_qty,money(t.price_paise)]))}${A.can('audit')?'<button id="product-log" style="margin-top:20px">Activity log</button>':''}`);if($('product-log'))$('product-log').onclick=()=>A.logs('product',p.id).catch(A.error);}
function edit(p){if(!categories.length){A.toast('Create a category first.');return;}const values=p?{...p,mrp:p.mrp_paise/100,price:p.price_paise/100,images:p.images.join('\n'),tiers:p.bulk_rules.map(t=>`${t.min_qty}:${t.price_paise/100}`).join('\n')}:{category_id:categories[0].id,unit:'piece',min_qty:1,qty_step:1,stock:0,active:true};A.form(p?'Edit product':'New product',[
 ['title','Product name','text',[],true],['category_id','Category','select',categories.map(c=>[c.id,c.name])],['description','Description','textarea'],['unit','Unit','text',[],true],['mrp','MRP (₹)','number',[],true],['price','Wholesale price (₹)','number',[],true],['stock','Stock','number',[],true],['min_qty','Minimum quantity','number',[],true],['qty_step','Quantity increment','number',[],true],['tiers','Bulk tiers: minimum quantity:price in ₹, one per line','textarea'],['images','Image URLs, one per line','textarea'],['upload','Upload images, max 2 MiB each','file'],['active','Available for ordering','checkbox'],['reason','Reason for change','text',[],!!p]
 ],values,async(v,f)=>{const urls=v.images.split(/\s+/).filter(Boolean);f.uploadedFiles=f.uploadedFiles||new Set();for(const file of f.elements.upload.files){if(f.uploadedFiles.has(file))continue;if(file.size>2*1024*1024)throw Error('Each image must be 2 MiB or smaller.');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file);});const image=await A.api('image.upload',{base64});urls.push(image.url);f.uploadedFiles.add(file);f.elements.images.value=urls.join('\n');}f.elements.upload.value='';if(urls.length>6)throw Error('Use at most six images.');const tiers=v.tiers.trim()?v.tiers.trim().split(/\n/).map(line=>{const[q,price]=line.split(':');if(!q||!price)throw Error('Use bulk tier format 10:110.');return{min_qty:Number(q),price_paise:A.paise(price)};}):[];await A.api('admin.product.put',{...(p?{id:p.id,expected_version:p.version}:{}),title:v.title,description:v.description,category_id:+v.category_id,unit:v.unit,mrp_paise:A.paise(v.mrp),price_paise:A.paise(v.price),stock:+v.stock,min_qty:+v.min_qty,qty_step:+v.qty_step,bulk_rules:tiers,images:urls,active:v.active,reason:v.reason});await load();});}
async function categoryManager(){A.modal('Categories',A.table(['Name','Status',''],categories.map(c=>[esc(c.name),A.badge(c.active?'active':'inactive'),`<button data-category-edit="${c.id}">Edit</button>`]))+'<button id="add-category" class="primary" style="margin-top:18px">Add category</button>');const open=c=>A.form(c?'Edit category':'Add category',[['name','Name','text',[],true],['active','Active','checkbox']],c||{active:true},async v=>{await A.api('admin.category.put',{...v,...(c?{id:c.id,expected_version:c.version}:{})});await load();});$('add-category').onclick=()=>open();for(const b of document.querySelectorAll('[data-category-edit]'))b.onclick=()=>open(categories.find(c=>c.id===+b.dataset.categoryEdit));}
for(const id of ['search','category','availability','sort'])$(id).addEventListener('input',render);
$('export').onclick=()=>A.csv('Products',['ID','Product','Category','MRP INR','Wholesale INR','Stock','Unit','Active'],filtered().map(p=>[p.id,p.title,categories.find(c=>c.id===p.category_id)?.name,p.mrp_paise/100,p.price_paise/100,p.stock,p.unit,p.active]),'Current catalogue; active filters applied');
if(manage){$('new-product').onclick=()=>edit();$('categories').onclick=categoryManager;}await load();

})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
</body></html>
