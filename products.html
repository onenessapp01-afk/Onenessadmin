const productEditor=$('productEditor'),stockVoucher=$('stockVoucher');

function categoryName(id){return categories.find(c=>+c.id===+id)?.name||'Uncategorised'}
function movementLabel(t){return ({opening:'Opening Balance',purchase:'Purchase / Stock In',return_in:'Return In',adjustment_in:'Adjustment In',adjustment_out:'Adjustment Out',damage:'Damage / Loss',correction:'Correction',order_reserved:'Order Reserved',order_cancelled:'Order Cancelled / Restored',product_edit:'Product Edit'})[t]||String(t||'—').replaceAll('_',' ')}
function formatDate(v){return v?new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'}):'—'}
function rupeeInput(p){return Number(p||0)/100}
function thumb(p){return p.images?.[0]?`<img class="product-thumb" loading="lazy" src="${esc(p.images[0])}" alt="">`:'<div class="product-placeholder">◇</div>'}
async function uploadProductImage(base64,name){
 const {data,error}=await A.client.functions.invoke('product-image-upload',{body:{base64,name}});
 if(error){
   let message=error.message||'Image upload failed.';
   try{const body=await error.context?.json?.();message=body?.error?.message||message}catch{}
   throw Error(message);
 }
 if(data?.ok!==true||!data?.data?.url)throw Error(data?.error?.message||'Image upload was not confirmed.');
 return data.data;
}
async function inventoryAdjust(data){
 const {data:result,error}=await A.client.rpc('admin_inventory_adjust',{p_data:data});
 if(error)throw error;return result;
}
async function inventoryAll(data){
 const list=[];let before=null;
 for(let i=0;i<100;i++){
   const payload={...data,limit:250,...(before?{before_id:before}:{})};
   const {data:result,error}=await A.client.rpc('admin_inventory_statement',{p_data:payload});
   if(error)throw error;
   const batch=Array.isArray(result?.items)?result.items:[];list.push(...batch);
   const next=result?.next_before_id;if(!next||!batch.length)break;before=next;
 }
 return list;
}

async function loadProducts(){
 products=await A.all('products.list',{},n=>$('product-count').textContent=`Loaded ${n} products…`);
 categories=await A.api('categories.list');
 const opts='<option value="">All categories</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 $('product-category').innerHTML=opts;
 $('ledger-product').innerHTML='<option value="">All products</option>'+products.slice().sort((a,b)=>a.title.localeCompare(b.title)).map(p=>`<option value="${p.id}">#${p.id} · ${esc(p.title)}</option>`).join('');
 renderCatalogue();
}

function productRows(){
 let rows=[...products];
 const q=$('product-search').value.trim().toLowerCase();
 if(q)rows=rows.filter(p=>`${p.id} ${p.title} ${p.description||''}`.toLowerCase().includes(q));
 if($('product-category').value)rows=rows.filter(p=>+p.category_id===+$('product-category').value);
 const f=$('stock-filter').value;
 if(f==='in')rows=rows.filter(p=>p.active&&p.stock>0);
 if(f==='low')rows=rows.filter(p=>p.active&&p.stock>0&&p.stock<=Number(p.low_stock_alert_qty??10));
 if(f==='out')rows=rows.filter(p=>p.stock===0);
 if(f==='inactive')rows=rows.filter(p=>!p.active);
 const s=$('product-sort').value;
 if(s==='name')rows.sort((a,b)=>a.title.localeCompare(b.title));
 else if(s==='stock-low')rows.sort((a,b)=>a.stock-b.stock);
 else if(s==='stock-high')rows.sort((a,b)=>b.stock-a.stock);
 else if(s==='price')rows.sort((a,b)=>a.price_paise-b.price_paise);
 else rows.sort((a,b)=>b.id-a.id);
 return rows;
}

function defaultPlanTitle(index){return ['Startup Plan','Growth Plan','Advance Plan','Premium Plan','Mega Plan'][index]||`Bulk Plan ${index+1}`}
function planData(rule,p,index=0){
 const units=Math.max(1,Number(rule?.units||rule?.min_qty||1));
 const total=Number(rule?.total_price_paise ?? (Number(rule?.price_paise||0)*units));
 const unitPrice=units?Math.round(total/units):0;
 const mrpTotal=Number(p?.mrp_paise||0)*units;
 const profit=mrpTotal-total;
 const margin=mrpTotal?profit*100/mrpTotal:0;
 const stdTotal=Number(p?.price_paise||0)*units;
 const saving=stdTotal-total;
 return {title:String(rule?.title||rule?.plan_title||defaultPlanTitle(index)),units,total,unitPrice,mrpTotal,profit,margin,saving};
}
function plansHtml(p){
 const rules=p.bulk_rules||[];
 if(!rules.length)return '<span class="muted">No quantity offers</span>';
 return `<div class="plan-stack">${rules.map((r,i)=>{const x=planData(r,p,i);return `<div class="plan-chip"><b>${esc(x.title)}</b><span class="plan-price">${x.units} units · ${money(x.total)} total</span><span class="plan-meta">${money(x.unitPrice)}/unit · MRP value ${money(x.mrpTotal)}</span><span class="plan-profit">Potential ${money(x.profit)} (${pctPlan(x.margin)})</span></div>`}).join('')}</div>`;
}
function pctPlan(v){const n=Number(v||0);return `${n.toFixed(Number.isInteger(n)?0:1)}%`}

 const rows=productRows();

 $('catalogue-kpis').innerHTML=[

 $('product-body').innerHTML=rows.map(p=>`

   <td><div class="product-cell">${thumb(p)}<div><span class="product-title">${esc(p.title)}</span><span class="product-desc">${esc(p.description||'')}</span></div></div></td>
   <td>${esc(categoryName(p.category_id))}</td>
   <td><b>${money(p.price_paise)}</b><span class="stock-unit">MRP ${money(p.mrp_paise)}</span></td>
   <td><span class="stock-number ${p.stock===0?'out':p.stock<=Number(p.low_stock_alert_qty??10)?'low':''}">${p.stock}</span><span class="stock-unit">${esc(p.unit)}</span></td>
   <td><div class="alert-cell"><b>${Number(p.low_stock_alert_qty??10)} ${esc(p.unit)}</b><span class="alert-badge ${p.stock===0?'out':p.stock<=Number(p.low_stock_alert_qty??10)?'low':''}">${p.stock===0?'Out of stock':p.stock<=Number(p.low_stock_alert_qty??10)?'Alert active':'Healthy'}</span></div></td>
   <td>${plansHtml(p)}</td>
   <td>${A.badge(p.active?'active':'inactive')}</td>
   <td><div class="erp-actions">
    <button data-view="${p.id}">Details</button>
    ${canStock?`<button data-stock="${p.id}" class="stock-in">Stock</button>`:''}
    <button data-statement="${p.id}">Statement</button>
    ${canEdit?`<button data-edit="${p.id}" class="primary">Edit</button>`:''}
   </div></td>
  </tr>`).join('');

 $('mobile-products').innerHTML=rows.map(p=>`
  <article class="mobile-product">
   <div class="mobile-product-head">${thumb(p)}<div><b>${esc(p.title)}</b><span class="stock-unit">#${p.id} · ${esc(categoryName(p.category_id))}</span><span class="product-desc">${esc(p.description||'')}</span></div>${A.badge(p.active?'active':'inactive')}</div>
   <div class="mobile-metrics">
    <div class="mobile-metric"><span>Wholesale</span><strong>${money(p.price_paise)}</strong></div>
    <div class="mobile-metric"><span>MRP</span><strong>${money(p.mrp_paise)}</strong></div>
    <div class="mobile-metric"><span>Stock / Alert</span><strong>${p.stock} / ${Number(p.low_stock_alert_qty??10)}</strong></div>
   </div>
   <div class="mobile-offer-title">Quantity offers</div><div>${plansHtml(p)}</div>
   <div class="toolbar-actions"><button data-view="${p.id}">Details</button>${canStock?`<button data-stock="${p.id}" class="stock-in">Stock</button>`:''}<button data-statement="${p.id}">Statement</button>${canEdit?`<button data-edit="${p.id}" class="primary">Edit</button>`:''}</div>
  </article>`).join('')||'<div class="card empty">No products match your filters.</div>';

 wireProductActions();
}

function wireProductActions(){
 for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>showDetails(products.find(p=>p.id===+b.dataset.view));
 for(const b of document.querySelectorAll('[data-edit]'))b.onclick=()=>openEditor(products.find(p=>p.id===+b.dataset.edit));
 for(const b of document.querySelectorAll('[data-stock]'))b.onclick=()=>openVoucher('in',+b.dataset.stock);
 for(const b of document.querySelectorAll('[data-statement]'))b.onclick=()=>openProductStatement(+b.dataset.statement);
}

 const slabs=(p.bulk_rules||[]).length?A.table(['Offer','Block Qty','Total Block Price','Auto / Unit','MRP Value','Potential Profit'],p.bulk_rules.map((t,i)=>{const x=planData(t,p,i);return [esc(x.title),`${x.units} ${esc(p.unit)}`,money(x.total),money(x.unitPrice),money(x.mrpTotal),`${money(x.profit)} (${pctPlan(x.margin)})`]})):'<p class="muted">No wholesale bundle plans.</p>';
 const gallery=(p.images||[]).length?`<div class="image-preview" style="margin-bottom:14px">${p.images.map((u,i)=>`<div class="image-card"><img src="${esc(u)}" alt="">${i===0?'<span class="primary-image">Primary</span>':''}</div>`).join('')}</div>`:'';

  </div>

 if($('detail-stock-in'))$('detail-stock-in').onclick=()=>openVoucher('in',p.id);
 if($('detail-stock-out'))$('detail-stock-out').onclick=()=>openVoucher('out',p.id);
 $('detail-statement').onclick=()=>openProductStatement(p.id);
 if($('detail-edit'))$('detail-edit').onclick=()=>openEditor(p);
 if($('product-log'))$('product-log').onclick=()=>A.logs('product',p.id).catch(A.error);

function renumberSlabs(){
 [...document.querySelectorAll('.slab-row')].forEach((row,i)=>{
   row.dataset.planIndex=i;
   const n=row.querySelector('.slab-number');if(n)n.textContent=`Offer ${i+1}`;
   const title=row.querySelector('.slab-title');
   if(title&&!title.value.trim())title.value=defaultPlanTitle(i);
   updateSlabMath(row);
 });
}
function updateSlabMath(row){
 const units=Number(row.querySelector('.slab-qty')?.value||0);
 const totalRupees=Number(row.querySelector('.slab-total')?.value||0);
 const mrpRupees=Number($('ed-mrp')?.value||0);
 const standardRupees=Number($('ed-price')?.value||0);
 const math=row.querySelector('.slab-math');if(!math)return;
 const total=Math.round(totalRupees*100),mrp=Math.round(mrpRupees*100),std=Math.round(standardRupees*100);
 const unit=units?Math.round(total/units):0,mrpTotal=mrp*units,profit=mrpTotal-total,margin=mrpTotal?profit*100/mrpTotal:0,saving=std*units-total;
 const profitClass=profit<0?'warn':'profit';
 const auto=row.querySelector('.auto-unit-value');if(auto)auto.textContent=units&&totalRupees?money(unit):'—';
 math.innerHTML=`<div class="plan-metric"><span>Total block price</span><b>${units&&totalRupees?money(total):'—'}</b></div>
 <div class="plan-metric"><span>MRP retail value</span><b>${units&&mrpRupees?money(mrpTotal):'—'}</b></div>
 <div class="plan-metric ${profitClass}"><span>Potential profit</span><b>${units&&totalRupees&&mrpRupees?`${money(profit)} (${pctPlan(margin)})`:'—'}</b></div>
 <div class="plan-metric"><span>Profit / unit</span><b>${units&&totalRupees&&mrpRupees?money(Math.round(profit/units)):'—'}</b></div>
 <div class="plan-metric"><span>Vs standard wholesale</span><b>${units&&totalRupees&&standardRupees?(saving>=0?`Save ${money(saving)}`:`+${money(Math.abs(saving))}`):'—'}</b></div>`;
}
function addSlabRow(rule={}){
 const i=document.querySelectorAll('.slab-row').length;
 const units=rule.units??rule.min_qty??'';
 const totalPaise=rule.total_price_paise ?? ((rule.price_paise!=null&&units)?Number(rule.price_paise)*Number(units):null);
 const row=document.createElement('div');row.className='slab-row';
 row.innerHTML=`<div class="slab-top"><span class="slab-number">Offer ${i+1}</span><span class="offer-badge">TOTAL BLOCK PRICE</span></div>
 <label>Offer / plan title<input class="slab-title" maxlength="80" value="${esc(rule.title||rule.plan_title||defaultPlanTitle(i))}" placeholder="Startup Plan" required></label>
 <label>Block quantity (units)<input class="slab-qty" type="number" min="1" step="1" value="${esc(units)}" placeholder="20" required></label>
 <label>Total block price (₹)<input class="slab-total" type="number" min="0.01" step="0.01" value="${totalPaise==null?'':esc(rupeeInput(totalPaise))}" placeholder="400" required><span class="total-price-hint">Price for the complete block — NOT one unit</span></label>
 <div class="auto-unit-box"><span>Auto per-unit price</span><strong class="auto-unit-value">—</strong><small>Total block price ÷ units</small></div>
 <button type="button" class="remove-slab">Remove</button>
 <div class="slab-math"></div>`;
 row.querySelector('.remove-slab').onclick=()=>{row.remove();renumberSlabs()};
 for(const input of row.querySelectorAll('input'))input.addEventListener('input',()=>updateSlabMath(row));
 $('slab-list').append(row);renumberSlabs();
}

function cleanupEditorImages(){
 for(const img of editorImages){if(img.localUrl)URL.revokeObjectURL(img.localUrl)}
 editorImages=[];
}
function renderEditorImages(){
 $('image-count').textContent=`${editorImages.length} / 6`;
 if(!editorImages.length){$('image-preview').innerHTML='<div class="image-empty">No product images yet. Add clear front/product-pack images for the catalogue.</div>';return}
 $('image-preview').innerHTML=editorImages.map((img,i)=>`<div class="image-card">
   <img src="${esc(img.preview||img.url||'')}" alt="Product image ${i+1}">
   ${i===0?'<span class="primary-image">Primary</span>':''}
   <span class="image-status ${img.status==='saved'?'saved':img.status==='error'?'error':''}">${img.status==='saved'?'Saved':img.status==='uploading'?'Uploading…':img.status==='error'?'Retry':'Ready'}</span>
   <div class="image-card-info"><small>${esc(img.name||`Image ${i+1}`)}</small><div class="image-card-actions">${i>0?`<button type="button" data-img-primary="${i}">Make primary</button>`:'<button type="button" disabled>Primary image</button>'}<button type="button" data-img-remove="${i}">Remove</button></div></div>
 </div>`).join('');
 for(const b of document.querySelectorAll('[data-img-remove]'))b.onclick=()=>{const i=+b.dataset.imgRemove;const [old]=editorImages.splice(i,1);if(old?.localUrl)URL.revokeObjectURL(old.localUrl);renderEditorImages()};
 for(const b of document.querySelectorAll('[data-img-primary]'))b.onclick=()=>{const i=+b.dataset.imgPrimary;const [picked]=editorImages.splice(i,1);editorImages.unshift(picked);renderEditorImages()};
}
function addSelectedImages(fileList){
 const files=[...fileList];
 if(editorImages.length+files.length>6){A.toast('Use at most six product images.');return}
 for(const file of files){
   if(!/^image\/(jpeg|png|webp)$/.test(file.type)){A.toast(`${file.name}: use JPG, PNG or WebP.`);continue}
   if(file.size>8*1024*1024){A.toast(`${file.name}: choose an image smaller than 8 MB.`);continue}
   const localUrl=URL.createObjectURL(file);
   editorImages.push({file,localUrl,preview:localUrl,name:file.name,status:'pending',url:null});
 }
 renderEditorImages();
}
async function imageToBase64(file){
 const local=URL.createObjectURL(file);
 try{
   const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Could not read this image.'));im.src=local});
   let w=img.naturalWidth,h=img.naturalHeight;
   const max=1800,scale=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
   const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
   let data=canvas.toDataURL('image/webp',.86);
   if(data.length>2_600_000){data=canvas.toDataURL('image/webp',.72)}
   if(data.length>2_600_000){const smaller=document.createElement('canvas');const s=Math.min(1,1200/Math.max(w,h));smaller.width=Math.max(1,Math.round(w*s));smaller.height=Math.max(1,Math.round(h*s));smaller.getContext('2d').drawImage(canvas,0,0,smaller.width,smaller.height);data=smaller.toDataURL('image/webp',.72)}
   const base64=String(data).split(',')[1];
   if(!base64||base64.length>2_800_000)throw Error('This image is still too large after optimization. Choose a smaller image.');
   return base64;
 }finally{URL.revokeObjectURL(local)}
}
async function uploadEditorImages(){
 for(let i=0;i<editorImages.length;i++){
   const img=editorImages[i];if(img.url)continue;
   img.status='uploading';renderEditorImages();
   try{
     const base64=await imageToBase64(img.file);
     let uploaded=null,lastErr=null;
     for(let attempt=0;attempt<2&&!uploaded;attempt++){
       try{uploaded=await uploadProductImage(base64,img.name||'product-image')}catch(e){lastErr=e;if(attempt===0)await new Promise(r=>setTimeout(r,900))}
     }
     if(!uploaded?.url)throw lastErr||Error('Image upload was not confirmed.');
     if(img.localUrl)URL.revokeObjectURL(img.localUrl);
     img.url=uploaded.url;img.preview=uploaded.thumbnail||uploaded.url;img.localUrl=null;img.file=null;img.status='saved';renderEditorImages();
   }catch(e){img.status='error';renderEditorImages();throw Error(`Image ${i+1} (${img.name||'product image'}): ${e?.message||'upload failed'}`)}
 }
 return editorImages.map(x=>x.url).filter(Boolean);
}
function openEditor(p=null){
 if(!categories.length){A.toast('Create a category first.');return}
 cleanupEditorImages();editing=p;
 editorImages=(p?.images||[]).map((url,i)=>({url,preview:url,file:null,localUrl:null,name:`Saved image ${i+1}`,status:'saved'}));
 $('editor-title').textContent=p?'Edit Product':'Add Product';
 $('editor-subtitle').textContent=p?`#${p.id} · stock is maintained through Inventory Vouchers`:'Create catalogue item and opening stock';
 $('ed-category').innerHTML=categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 $('ed-title').value=p?.title||'';$('ed-category').value=p?.category_id||categories[0].id;$('ed-unit').value=p?.unit||'piece';$('ed-description').value=p?.description||'';
 $('ed-mrp').value=rupeeInput(p?.mrp_paise||0);$('ed-price').value=rupeeInput(p?.price_paise||0);$('ed-alert').value=Number(p?.low_stock_alert_qty??10);
 $('ed-stock-display').textContent=p?`${p.stock} ${p.unit}`:'Opening stock will be recorded in the ledger';$('opening-stock-wrap').hidden=!!p;$('ed-opening-stock').value=0;
 $('stock-help').textContent=p?'Use Stock In / Stock Out to change this quantity so every movement appears in the inventory statement.':'Opening stock will create the first inventory-ledger entry.';
 $('ed-active').checked=p?.active??true;$('reason-wrap').hidden=!p;$('ed-reason').value='';$('editor-error').hidden=true;$('ed-upload').value='';
 $('slab-list').innerHTML='';for(const r of p?.bulk_rules||[])addSlabRow(r);renderEditorImages();productEditor.showModal();
}
$('add-slab').onclick=()=>addSlabRow();
for(const id of ['ed-mrp','ed-price'])$(id).addEventListener('input',()=>document.querySelectorAll('.slab-row').forEach(updateSlabMath));
$('ed-upload').onchange=e=>{addSelectedImages(e.target.files);e.target.value=''};
$('editor-close').onclick=$('editor-cancel').onclick=()=>{cleanupEditorImages();productEditor.close()};

$('product-form').onsubmit=async e=>{
 e.preventDefault();
 const save=$('editor-save');save.disabled=true;$('editor-error').hidden=true;
 try{
  const title=$('ed-title').value.trim(),unit=$('ed-unit').value.trim();
  if(!title||!unit)throw Error('Product name and unit are required.');
  const mrp=A.paise($('ed-mrp').value),price=A.paise($('ed-price').value);
  if(price>mrp)throw Error('Wholesale price cannot be greater than MRP.');
  const alertQty=+$('ed-alert').value;
  if(!Number.isInteger(alertQty)||alertQty<0)throw Error('Low stock alert quantity must be zero or a positive whole number.');

  const tiers=[...document.querySelectorAll('.slab-row')].map((row,i)=>{
    const planTitle=row.querySelector('.slab-title').value.trim(),units=+row.querySelector('.slab-qty').value,total=A.paise(row.querySelector('.slab-total').value);
    if(!planTitle)throw Error(`Offer ${i+1}: title is required.`);
    if(!Number.isInteger(units)||units<1)throw Error(`${planTitle}: block quantity must be a positive whole number.`);
    if(total<=0)throw Error(`${planTitle}: total block price must be greater than ₹0.`);
    const standardTotal=price*units,mrpTotal=mrp*units;
    if(total>standardTotal)throw Error(`${planTitle}: total block price cannot be higher than the normal wholesale value ${money(standardTotal)}.`);
    if(total>mrpTotal)throw Error(`${planTitle}: total block price cannot be higher than MRP value ${money(mrpTotal)}.`);
    return {plan_type:'bundle',title:planTitle,units,min_qty:units,total_price_paise:total,price_paise:Math.round(total/units)};
  }).sort((a,b)=>a.units-b.units);
  if(new Set(tiers.map(t=>t.units)).size!==tiers.length)throw Error('Quantity-based offers must use unique block quantities.');
  if(new Set(tiers.map(t=>t.title.toLowerCase())).size!==tiers.length)throw Error('Offer titles must be unique.');

  const urls=await uploadEditorImages();
  if(urls.length>6)throw Error('Use at most six images.');

  const payload={
    ...(editing?{id:editing.id,expected_version:editing.version}:{}),
    title,description:$('ed-description').value.trim(),category_id:+$('ed-category').value,unit,
    mrp_paise:mrp,price_paise:price,
    stock:editing?editing.stock:Math.max(0,Math.trunc(+$('ed-opening-stock').value||0)),
    min_qty:1,qty_step:1,low_stock_alert_qty:alertQty,bulk_rules:tiers,images:urls,
    active:$('ed-active').checked,
    reason:editing?$('ed-reason').value.trim():'Opening product creation'
  };
  if(editing&&!payload.reason)throw Error('Reason for change is required.');
  await A.api('admin.product.put',payload);
  cleanupEditorImages();productEditor.close();A.toast(editing?'Product updated':'Product created');
  await loadProducts();
 }catch(err){$('editor-error').textContent=A.error(err);$('editor-error').hidden=false}
 finally{save.disabled=false}
};

function movementOptions(direction){
 return direction==='in'
 ?[['purchase','Purchase / Supplier Receipt'],['return_in','Sales Return / Stock Return In'],['adjustment_in','Adjustment In'],['correction','Physical Stock Correction']]
 :[['damage','Damage / Loss'],['adjustment_out','Adjustment Out'],['correction','Physical Stock Correction']];
}
function updateVoucherProducts(){
 const q=$('voucher-search').value.trim().toLowerCase();
 const rows=products.filter(p=>!q||`${p.id} ${p.title}`.toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title));
 const current=$('voucher-product').value;
 $('voucher-product').innerHTML=rows.map(p=>`<option value="${p.id}">#${p.id} · ${esc(p.title)} · Stock ${p.stock} ${esc(p.unit)}</option>`).join('');
 if(rows.some(p=>String(p.id)===current))$('voucher-product').value=current;
 updateVoucherPreview();
}
function openVoucher(direction='in',productId=null){
 voucherDirection=direction;
 $('voucher-title').textContent=direction==='in'?'Stock In Voucher':'Stock Out Voucher';
 $('voucher-type').innerHTML=movementOptions(direction).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
 $('voucher-search').value='';
 $('voucher-qty').value=1;
 $('voucher-reference').value='';
 $('voucher-note').value='';
 $('voucher-error').hidden=true;
 const now=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
 $('voucher-date').value=now;
 updateVoucherProducts();
 if(productId&&products.some(p=>p.id===productId))$('voucher-product').value=productId;
 updateVoucherPreview();
 $('voucher-save').textContent=direction==='in'?'Post Stock In':'Post Stock Out';
 $('voucher-save').className=direction==='in'?'primary':'danger';
 stockVoucher.showModal();
}
function updateVoucherPreview(){
 const p=products.find(x=>x.id===+$('voucher-product').value);
 const qty=Math.max(0,Math.trunc(+$('voucher-qty').value||0));
 const current=Number(p?.stock||0),closing=current+(voucherDirection==='in'?qty:-qty);
 $('voucher-current').textContent=p?`${current} ${p.unit}`:'0';
 $('voucher-closing').textContent=p?`${closing} ${p.unit}`:'0';
 $('voucher-closing').style.color=closing<0?'#a33824':voucherDirection==='in'?'#17634c':'#14251f';
}
$('voucher-search').oninput=updateVoucherProducts;
$('voucher-product').onchange=updateVoucherPreview;
$('voucher-qty').oninput=updateVoucherPreview;
$('voucher-close').onclick=$('voucher-cancel').onclick=()=>stockVoucher.close();

$('voucher-form').onsubmit=async e=>{
 e.preventDefault();const save=$('voucher-save');save.disabled=true;$('voucher-error').hidden=true;
 try{
  const p=products.find(x=>x.id===+$('voucher-product').value);
  if(!p)throw Error('Choose a product.');
  const qty=Math.trunc(+$('voucher-qty').value);
  if(!Number.isInteger(qty)||qty<1)throw Error('Quantity must be a positive whole number.');
  if(voucherDirection==='out'&&qty>p.stock)throw Error(`Only ${p.stock} ${p.unit} are currently available.`);
  let occurred=null;
  if($('voucher-date').value)occurred=new Date($('voucher-date').value).toISOString();
  await inventoryAdjust({
    product_id:p.id,direction:voucherDirection,movement_type:$('voucher-type').value,qty,
    reference:$('voucher-reference').value.trim(),note:$('voucher-note').value.trim(),
    ...(occurred?{occurred_at:occurred}:{})
  });
  stockVoucher.close();A.toast(`${voucherDirection==='in'?'Stock received':'Stock issued'} · ${qty} ${p.unit}`);
  await loadProducts();
  if(tab==='inventory')await loadLedger();
 }catch(err){$('voucher-error').textContent=A.error(err);$('voucher-error').hidden=false}
 finally{save.disabled=false}
};

async function loadLedger(){
 $('ledger-count').textContent='Loading statement…';
 const data={
  ...(+$('ledger-product').value?{product_id:+$('ledger-product').value}:{}),
  ...($('ledger-type').value?{movement_type:$('ledger-type').value}:{}),
  ...($('ledger-search').value.trim()?{search:$('ledger-search').value.trim()}:{}),
 };
 if($('ledger-from').value)data.from=new Date($('ledger-from').value+'T00:00:00+05:30').toISOString();
 if($('ledger-to').value)data.to=new Date(new Date($('ledger-to').value+'T00:00:00+05:30').getTime()+86400000).toISOString();

 ledger=await inventoryAll(data);
 $('ledger-count').textContent=`Loaded ${ledger.length} movements…`;
 renderLedger();
}
function movementTone(type,delta){
 if(type==='opening')return 'tone-opening';
 if(type==='correction'||type==='product_edit')return 'tone-correction';
 if(type==='order_reserved'||type==='order_cancelled')return 'tone-order';
 return delta>0?'tone-in':delta<0?'tone-out':'tone-opening';
}
function movementRowClass(delta){return delta>0?'row-in':delta<0?'row-out':'row-neutral'}
function renderLedger(){
 const selected=products.find(p=>p.id===+$('ledger-product').value);
 const totalIn=ledger.filter(x=>x.quantity_delta>0).reduce((a,x)=>a+x.quantity_delta,0);
 const totalOut=ledger.filter(x=>x.quantity_delta<0).reduce((a,x)=>a+Math.abs(x.quantity_delta),0);
 $('sum-transactions').textContent=ledger.length;$('sum-in').textContent='+'+totalIn;$('sum-out').textContent='−'+totalOut;$('sum-net').textContent=(totalIn-totalOut>=0?'+':'')+(totalIn-totalOut);
 $('statement-title').textContent=selected?`Inventory Statement · ${selected.title}`:'Inventory Statement · All Products';
 $('statement-sub').textContent=`${$('ledger-from').value||'Beginning'} through ${$('ledger-to').value||'Today'} · ${$('ledger-type').selectedOptions[0].text}`;
 $('ledger-count').textContent=`${ledger.length} movement${ledger.length===1?'':'s'}`;

 if(selected&&ledger.length){
   const chronological=[...ledger].sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at)||a.id-b.id);
   $('period-opening-card').hidden=false;$('period-closing-card').hidden=false;
   $('sum-opening').textContent=`${chronological[0].stock_before} ${selected.unit}`;
   $('sum-closing').textContent=`${chronological.at(-1).stock_after} ${selected.unit}`;
 }else{
   $('period-opening-card').hidden=true;$('period-closing-card').hidden=true;
 }

 $('ledger-body').innerHTML=ledger.map(x=>`
  <tr class="${movementRowClass(x.quantity_delta)}">
   <td>${esc(formatDate(x.occurred_at))}</td>
   <td><b>${esc(x.product_title)}</b><span class="stock-unit">#${x.product_id}</span></td>
   <td><span class="movement-type ${movementTone(x.movement_type,x.quantity_delta)}">${esc(movementLabel(x.movement_type))}</span></td>
   <td><span class="movement-ref">${esc(x.reference_id||'—')}</span></td>
   <td><span class="ledger-stock">${x.stock_before}</span></td>
   <td class="movement-in">${x.quantity_delta>0?'+'+x.quantity_delta:'—'}</td>
   <td class="movement-out">${x.quantity_delta<0?'−'+Math.abs(x.quantity_delta):'—'}</td>
   <td><span class="ledger-stock closing">${x.stock_after}</span></td>
   <td>${esc(x.actor_name||x.actor_role||'System')}</td>
   <td class="movement-note">${esc(x.note||'—')}</td>
  </tr>`).join('');
 $('ledger-empty').hidden=ledger.length>0;
}

function syncSheetActive(){
 for(const id of ['catalogue-view','inventory-view'])$(id)?.classList.remove('sheet-active');
 if(sheetMode){const active=$(tab==='inventory'?'inventory-view':'catalogue-view');active?.classList.add('sheet-active');$('sheet-context').textContent=tab==='inventory'?'Inventory ledger · Excel-style':'Product catalogue · Excel-style';$('sheet-catalogue').classList.toggle('active',tab==='catalogue');$('sheet-inventory').classList.toggle('active',tab==='inventory')}
}
function enterSheetView(){sheetMode=true;document.body.classList.add('erp-sheet-mode');$('erp-sheet-bar').hidden=false;syncSheetActive()}
function exitSheetView(){sheetMode=false;document.body.classList.remove('erp-sheet-mode');$('erp-sheet-bar').hidden=true;for(const id of ['catalogue-view','inventory-view'])$(id)?.classList.remove('sheet-active')}
function showTab(next){
 tab=next;
 for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);
 $('catalogue-view').hidden=tab!=='catalogue';$('inventory-view').hidden=tab!=='inventory';
 if(tab==='inventory')loadLedger().catch(A.error);
 syncSheetActive();
}
async function openProductStatement(id){
 $('ledger-product').value=id;showTab('inventory');
 document.querySelector('[data-tab="inventory"]').scrollIntoView({behavior:'smooth',block:'start'});
}

function exportProducts(){
 const rows=productRows();
 A.csv('Products',['ID','Product','Category','Unit','MRP INR','Wholesale INR','Stock','Low Stock Alert Qty','Wholesale Offers','Active'],
 rows.map(p=>[p.id,p.title,categoryName(p.category_id),p.unit,p.mrp_paise/100,p.price_paise/100,p.stock,Number(p.low_stock_alert_qty??10),(p.bulk_rules||[]).map((t,i)=>{const x=planData(t,p,i);return `${x.title}: ${x.units} units for ₹${(x.total/100).toFixed(2)} | profit ₹${(x.profit/100).toFixed(2)} (${pctPlan(x.margin)})`}).join(' || '),p.active]),
 'Current product catalogue; filters applied');
}
function exportLedger(){
 A.csv('Inventory Statement',['Date IST','Product ID','Product','Type','Reference','Opening','Stock In','Stock Out','Closing','Staff / Source','Note'],
 ledger.map(x=>[formatDate(x.occurred_at),x.product_id,x.product_title,movementLabel(x.movement_type),x.reference_id||'',x.stock_before,x.quantity_delta>0?x.quantity_delta:'',x.quantity_delta<0?Math.abs(x.quantity_delta):'',x.stock_after,x.actor_name||x.actor_role||'System',x.note||'']),
 $('statement-sub').textContent);
}
function printLedger(){
 const selected=products.find(p=>p.id===+$('ledger-product').value);
 const rows=ledger.map(x=>`<tr><td>${esc(formatDate(x.occurred_at))}</td><td>${esc(x.product_title)}</td><td>${esc(movementLabel(x.movement_type))}</td><td>${esc(x.reference_id||'')}</td><td>${x.stock_before}</td><td>${x.quantity_delta>0?x.quantity_delta:''}</td><td>${x.quantity_delta<0?Math.abs(x.quantity_delta):''}</td><td>${x.stock_after}</td><td>${esc(x.note||'')}</td></tr>`).join('');
 A.print(selected?`Inventory Statement · ${selected.title}`:'Inventory Statement · All Products',
 `<p>${esc($('statement-sub').textContent)}</p><table><thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Reference</th><th>Opening</th><th>In</th><th>Out</th><th>Closing</th><th>Narration</th></tr></thead><tbody>${rows}</tbody></table>`);
}

async function categoryManager(){
 A.modal('Categories',A.table(['Name','Status',''],categories.map(c=>[esc(c.name),A.badge(c.active?'active':'inactive'),`<button data-category-edit="${c.id}">Edit</button>`]))+'<button id="add-category" class="primary" style="margin-top:18px">Add category</button>');
 const open=c=>A.form(c?'Edit category':'Add category',[['name','Name','text',[],true],['active','Active','checkbox']],c||{active:true},async v=>{await A.api('admin.category.put',{...v,...(c?{id:c.id,expected_version:c.version}:{})});await loadProducts();});
 $('add-category').onclick=()=>open();
 for(const b of document.querySelectorAll('[data-category-edit]'))b.onclick=()=>open(categories.find(c=>c.id===+b.dataset.categoryEdit));
}

for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>showTab(b.dataset.tab);
for(const id of ['product-search','product-category','stock-filter','product-sort'])$(id).addEventListener('input',renderCatalogue);

$('sheet-view-top').onclick=$('sheet-view-toolbar').onclick=enterSheetView;
$('sheet-exit').onclick=exitSheetView;$('sheet-catalogue').onclick=()=>showTab('catalogue');$('sheet-inventory').onclick=()=>showTab('inventory');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetMode&&!productEditor.open&&!stockVoucher.open)exitSheetView()});
if($('new-product'))$('new-product').onclick=()=>openEditor();
if($('categories-btn'))$('categories-btn').onclick=()=>categoryManager().catch(A.error);
for(const id of ['stock-in-top','stock-in-toolbar','ledger-stock-in'])if($(id))$(id).onclick=()=>openVoucher('in');
for(const id of ['stock-out-top','stock-out-toolbar','ledger-stock-out'])if($(id))$(id).onclick=()=>openVoucher('out');
$('open-ledger').onclick=()=>showTab('inventory');
if($('product-export'))$('product-export').onclick=exportProducts;

$('ledger-refresh').onclick=()=>loadLedger().catch(A.error);
$('ledger-export').onclick=exportLedger;$('ledger-print').onclick=printLedger;
for(const b of document.querySelectorAll('[data-period]'))b.onclick=()=>{
 const today=new Date(Date.now()+19800000).toISOString().slice(0,10);
 if(b.dataset.period==='all'){$('ledger-from').value='';$('ledger-to').value=''}
 if(b.dataset.period==='today'){$('ledger-from').value=today;$('ledger-to').value=today}
 if(b.dataset.period==='7'){const d=new Date(today+'T00:00:00Z');$('ledger-from').value=new Date(d-6*86400000).toISOString().slice(0,10);$('ledger-to').value=today}
 if(b.dataset.period==='month'){$('ledger-from').value=today.slice(0,8)+'01';$('ledger-to').value=today}
 loadLedger().catch(A.error);
};

await loadProducts();

})().catch(e=>{
 if(window.App)App.fail(e);
 else document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;
});
</script>
</body>
</html>
