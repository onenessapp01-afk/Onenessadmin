.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.order-table{width:100%;border-collapse:collapse;table-layout:fixed}.order-table th{background:#f8faf7;color:#69776f;font-size:9px;text-transform:uppercase;letter-spacing:.45px;text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);position:sticky;top:95px;z-index:5}.order-table td{padding:8px 7px;border-bottom:1px solid #ebefeb;vertical-align:middle;font-size:11px;overflow:hidden;text-overflow:ellipsis}.order-table tr:hover td{background:#fbfcfa}.order-table tr:last-child td{border-bottom:0}.col-order{width:7%}.col-customer{width:19%}.col-date{width:10%}.col-items{width:8%}.col-amount{width:8%}.col-payment{width:9%}.col-status{width:15%}.col-assigned{width:10%}.col-actions{width:14%}.oid{font-weight:850;color:#173b32}.new{display:inline-block;margin-left:4px;padding:2px 5px;border-radius:999px;background:#fff1d8;color:#95611c;font-size:8px;font-weight:850}.customer-name{display:block;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-sub{display:block;color:var(--muted);font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell-money{font-weight:800}.payment-pill{display:inline-block;padding:4px 6px;border-radius:999px;background:#eef2ed;font-size:9px}.staff{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mobile-list{display:none;gap:8px}.m-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.m-top{display:flex;justify-content:space-between;gap:8px}.m-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:9px 0}.m-grid div{background:#f7f9f6;padding:7px;border-radius:8px}.m-grid span{display:block;font-size:8px;color:var(--muted)}.m-grid strong{display:block;font-size:11px;margin-top:2px}.m-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.m-actions button{font-size:10px}
.footer-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;color:var(--muted);font-size:11px}.pager{display:flex;align-items:center;gap:6px}.pager button,.pager select{min-height:32px;font-size:10px}
.full-modal{width:min(1060px,96vw);max-width:96vw;height:min(900px,94vh);max-height:94vh;border:0;border-radius:16px;padding:0;box-shadow:0 28px 90px rgba(12,35,27,.28);color:var(--ink)}.full-modal::backdrop,.small-modal::backdrop{background:rgba(11,35,26,.6)}.modal-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal-head h2{margin:0;font-size:18px}.modal-head p{margin:3px 0 0;font-size:10px;color:var(--muted)}.x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px}.modal-body{padding:14px 15px 26px;overflow:auto}.detail-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.65fr);gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}.card h3{margin:0 0 9px;font-size:13px}.hero{background:linear-gradient(135deg,#143d31,#17634c);color:#fff;border:0}.hero-top{display:flex;justify-content:space-between;gap:12px}.hero span{font-size:9px;color:#c8ddd2}.hero strong{display:block;font-size:25px;margin-top:3px}.hero-profit{display:flex;justify-content:space-between;gap:10px;margin-top:9px;padding:8px;background:rgba(255,255,255,.08);border-radius:9px;font-size:10px}.hero-profit b{color:#dff2a8}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.info div{padding:8px;background:#f7f9f6;border-radius:8px}.info span{display:block;font-size:8px;color:var(--muted)}.info strong{display:block;font-size:10px;margin-top:2px;overflow-wrap:anywhere}.addr,.note{background:#f7f9f6;padding:9px;border-radius:9px;font-size:10px;line-height:1.5;white-space:pre-wrap}.note.admin{background:#fff6e8}.mini-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.mini-actions button,.mini-actions a{padding:6px 8px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:9px;color:var(--ink)}
.items{width:100%;border-collapse:collapse}.items th,.items td{padding:7px 5px;border-bottom:1px solid #edf0eb;text-align:left;font-size:9px}.items th{font-size:8px;color:var(--muted);text-transform:uppercase}.items td:last-child,.items th:last-child{text-align:right}.profit{color:#17634c;font-weight:800}.fin{background:#173b32;color:#fff;border-radius:11px;padding:10px}.fr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:9px;color:#d7e5de}.fr.total{font-size:13px;color:#fff;border-top:1px solid rgba(255,255,255,.17);margin-top:4px;padding-top:8px}.fr.profit{color:#dff2a8}.timeline{display:grid;grid-template-columns:repeat(5,1fr);position:relative}.timeline:before{content:"";position:absolute;left:9%;right:9%;top:9px;height:2px;background:#e1e7e2}.ts{position:relative;z-index:2;text-align:center}.tdot{width:19px;height:19px;border-radius:50%;background:#e5e9e6;margin:auto}.ts.done .tdot,.ts.current .tdot{background:#17634c}.ts.current .tdot{box-shadow:0 0 0 3px #e8f3ea}.ts span{display:block;font-size:6px;color:var(--muted);margin-top:4px}.events{display:grid;gap:7px}.event{display:grid;grid-template-columns:26px minmax(0,1fr);gap:7px}.eicon{width:26px;height:26px;border-radius:8px;background:#eef3ee;display:grid;place-items:center;font-size:11px}.event strong{font-size:9px}.event span{display:block;font-size:8px;color:var(--muted);margin-top:2px}.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.doc-grid button{font-size:9px}.small-modal{width:min(470px,94vw);border:0;border-radius:14px;padding:0;box-shadow:0 25px 80px rgba(12,35,27,.3)}.small-body{padding:13px}.small-body label{display:block;margin-bottom:9px}.small-body input,.small-body select,.small-body textarea{width:100%;box-sizing:border-box}.small-foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 13px;border-top:1px solid var(--line)}
@media(max-width:1200px){.summary-strip{grid-template-columns:repeat(7,minmax(95px,1fr))}.filter-row{grid-template-columns:minmax(220px,2fr) repeat(3,minmax(105px,1fr)) auto}.filter-row .less{display:none}.col-assigned{display:none}.order-table th.col-assigned,.order-table td.col-assigned{display:none}.col-customer{width:22%}.col-actions{width:15%}}
@media(max-width:850px){#view{padding-left:10px!important;padding-right:10px!important}.summary-strip{display:flex;overflow:auto}.summary-box{min-width:105px}.filter-row{grid-template-columns:1fr 1fr}.filter-row .search{grid-column:1/-1}.desktop{display:none}.mobile-list{display:grid}.filters{position:static}.detail-layout{grid-template-columns:1fr}.full-modal{width:100vw;max-width:100vw;height:96vh;max-height:96vh;margin:auto 0 0 0;border-radius:16px 16px 0 0}.info{grid-template-columns:1fr}.orders-head{flex-direction:column}.head-actions{width:100%}.head-actions button{flex:1}.footer-bar{flex-direction:column;align-items:stretch}.pager{justify-content:center}}
@media(max-width:520px){.filter-row{grid-template-columns:1fr}.filter-row .search{grid-column:auto}.m-actions{grid-template-columns:1fr 1fr}.doc-grid{grid-template-columns:1fr}}
`;
document.head.append(style);

const A=await App.init('orders',['orders']);
const {$,esc,money}=A;
const owner=A.profile?.role==='owner';
const amountOK=owner||A.can('orders.view_amounts');
const contactOK=owner||A.can('customers.contact');
const printOK=owner||A.can('orders.print');
const collectOK=owner||A.can('payments.cod_collect');
const PERM={placed:'orders.confirm',confirmed:'orders.confirm',packed:'orders.pack',dispatched:'orders.dispatch',delivered:'orders.deliver',cancelled:'orders.cancel'};
let orders=[],staff=[],page=1,pageSize=50,activeStatus='',current=null,lastDetail=null;

const statusLabel=s=>({syncing:'Processing',placed:'Placed',confirmed:'Confirmed',packed:'Packed',dispatched:'Dispatched',delivered:'Delivered',cancelled:'Cancelled'})[s]||String(s||'—');
const statusClass=s=>'st-'+String(s||'syncing').replace(/[^a-z_]/g,'');
const date=v=>v?new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const can=s=>owner||A.can(PERM[s]);
const validNext=s=>({syncing:['placed'],placed:['confirmed','cancelled'],confirmed:['packed','dispatched','cancelled'],packed:['dispatched','cancelled'],dispatched:['delivered'],delivered:[],cancelled:[]}[s]||[]).filter(can);
const customer=o=>o.business_name||o.customer_name||`Retailer #${o.user_id}`;
const customerSub=o=>[o.customer_name&&o.customer_name!==o.business_name?o.customer_name:'',contactOK?o.customer_phone:''].filter(Boolean).join(' · ');
const fullAddress=a=>a&&typeof a==='object'?[a.contact_name,a.business_name,a.address_line1,a.address_line2,a.landmark?`Near ${a.landmark}`:'',a.city,a.taluka,a.district,a.state,a.pincode,a.phone?`Mobile: ${a.phone}`:''].filter(Boolean).join(', '):'Address unavailable';
const pct=(a,b)=>b?`${(a*100/b).toFixed((a*100/b)%1?1:0)}%`:'0%';

$('view').innerHTML=`
<div class="orders-head">
 <div><h1>Orders</h1><p>Full-screen order register · update status directly like a spreadsheet.</p></div>
 <div class="head-actions"><button id="refresh">Refresh</button><button id="export">Export CSV</button><button id="print-list">Print list</button></div>
</div>
<div id="summary" class="summary-strip"></div>
<section class="filters">
 <div class="filter-row">
  <label class="search">Search<input id="search" placeholder="Order, shop, customer, mobile, product, tracking, PIN"></label>
  <label>Status<select id="status"><option value="">All statuses</option>${['syncing','placed','confirmed','packed','dispatched','delivered','cancelled'].map(s=>`<option value="${s}">${statusLabel(s)}</option>`).join('')}</select></label>
  <label>Payment<select id="payment"><option value="">All payments</option><option value="cod">COD</option><option value="online">Online</option></select></label>
  <label>Assignment<select id="assignment"><option value="">All visible</option><option value="mine">Assigned to me</option><option value="unassigned">Unassigned</option><option value="assigned">Assigned</option></select></label>
  <label class="less">From<input id="from" type="date"></label>
  <label class="less">Through<input id="to" type="date"></label>
  <div class="filter-buttons"><button id="clear">Clear</button></div>
 </div>
 <div id="quick" class="quick-row"></div>
</section>
<p id="count" class="muted"></p>
<div class="sheet desktop">
 <table class="order-table">
  <thead><tr>
   <th class="col-order">Order</th><th class="col-customer">Customer / Shop</th><th class="col-date">Date</th><th class="col-items">Items</th>${amountOK?'<th class="col-amount">Amount</th>':''}<th class="col-payment">Payment</th><th class="col-status">Status</th><th class="col-assigned">Assigned</th><th class="col-actions">Actions</th>
  </tr></thead><tbody id="body"></tbody>
 </table>
</div>
<div id="mobile" class="mobile-list"></div>
<div class="footer-bar"><span id="page-info"></span><div class="pager"><select id="page-size"><option>25</option><option selected>50</option><option>100</option></select><button id="prev">Previous</button><button id="next">Next</button></div></div>

<dialog id="detailModal" class="full-modal"><div class="modal-head"><div><h2 id="detail-title">Order</h2><p id="detail-sub">Details</p></div><button id="detail-x" class="x">×</button></div><div id="detail-body" class="modal-body"></div></dialog>
<dialog id="actionModal" class="small-modal"><div class="modal-head"><div><h2 id="action-title">Update order</h2><p id="action-sub"></p></div><button id="action-x" class="x">×</button></div><form id="action-form"><div id="action-body" class="small-body"></div><div class="small-foot"><button type="button" id="action-cancel">Cancel</button><button type="submit" class="primary" id="action-save">Save</button></div></form></dialog>
`;

function counts(){return ['syncing','placed','confirmed','packed','dispatched','delivered','cancelled'].reduce((a,s)=>(a[s]=orders.filter(o=>o.status===s).length,a),{all:orders.length})}
function renderSummary(){const c=counts(),rows=[['','All',c.all,''],['placed','Placed',c.placed,'warn'],['confirmed','Confirmed',c.confirmed,''],['packed','Packed',c.packed,''],['dispatched','Dispatched',c.dispatched,'warn'],['delivered','Delivered',c.delivered,'good'],['cancelled','Cancelled',c.cancelled,'bad']];$('summary').innerHTML=rows.map(([v,l,n,cl])=>`<div class="summary-box ${cl} ${activeStatus===v?'active':''}" data-summary="${v}"><span>${l}</span><strong>${n}</strong></div>`).join('');$('quick').innerHTML=rows.map(([v,l,n])=>`<button class="chip ${activeStatus===v?'on':''}" data-quick="${v}">${l} · ${n}</button>`).join('');for(const el of document.querySelectorAll('[data-summary],[data-quick]'))el.onclick=()=>{activeStatus=el.dataset.summary??el.dataset.quick;$('status').value=activeStatus;page=1;render()}}
function filtered(){let r=[...orders];const q=$('search').value.trim().toLowerCase(),st=$('status').value,pay=$('payment').value,as=$('assignment').value,from=$('from').value,to=$('to').value;if(st)r=r.filter(o=>o.status===st);if(pay)r=r.filter(o=>o.payment_method===pay);if(as==='mine')r=r.filter(o=>+o.assigned_to_profile_id===+A.profile.id);if(as==='unassigned')r=r.filter(o=>!o.assigned_to_profile_id);if(as==='assigned')r=r.filter(o=>!!o.assigned_to_profile_id);if(from){const t=new Date(from+'T00:00:00+05:30');r=r.filter(o=>new Date(o.created_at)>=t)}if(to){const t=new Date(to+'T23:59:59+05:30');r=r.filter(o=>new Date(o.created_at)<=t)}if(q)r=r.filter(o=>`${o.id} ${o.user_id} ${o.customer_name||''} ${o.business_name||''} ${o.customer_phone||''} ${o.customer_email||''} ${(o.product_titles||[]).join(' ')} ${o.tracking||''} ${o.delivery_pincode||''} ${o.delivery_city||''} ${o.internal_note||''}`.toLowerCase().includes(q));return r.sort((a,b)=>+b.id-+a.id)}
function statusSelect(o){const next=validNext(o.status);const disabled=!next.length;return `<select class="status-select ${statusClass(o.status)}" data-status-id="${o.id}" ${disabled?'disabled':''}><option value="">${esc(statusLabel(o.status))}</option>${next.map(s=>`<option value="${s}">${s==='cancelled'?'Cancel Order':'→ '+statusLabel(s)}</option>`).join('')}</select>`}
function render(){renderSummary();const all=filtered(),pages=Math.max(1,Math.ceil(all.length/pageSize));page=Math.max(1,Math.min(page,pages));const rows=all.slice((page-1)*pageSize,page*pageSize);$('count').textContent=`${all.length} matching orders · ${orders.length} total visible to your account`;$('page-info').textContent=`Page ${page} of ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;
$('body').innerHTML=rows.map(o=>`<tr><td><span class="oid">#ON${o.id}</span>${o.status==='placed'?'<span class="new">NEW</span>':''}</td><td><span class="customer-name">${esc(customer(o))}</span><span class="customer-sub">${esc(customerSub(o)||`Retailer #${o.user_id}`)}</span></td><td>${esc(date(o.created_at))}</td><td><b>${Number(o.item_count||0)}</b> products<span class="customer-sub">${Number(o.unit_count||0)} units</span></td>${amountOK?`<td class="cell-money">${money(o.total_paise)}</td>`:''}<td><span class="payment-pill">${esc((o.payment_method||'—').toUpperCase())}</span><span class="customer-sub">${esc(o.payment_status||'—')}</span></td><td>${statusSelect(o)}</td><td class="col-assigned"><span class="staff">${esc(o.assigned_to_name||'Unassigned')}</span></td><td><div class="actions"><button class="view-btn" data-view="${o.id}">View</button><button class="print-btn" data-print="${o.id}">Print</button><button data-note="${o.id}">Note</button></div></td></tr>`).join('');
$('mobile').innerHTML=rows.map(o=>`<article class="m-card"><div class="m-top"><div><span class="oid">#ON${o.id}</span><span class="customer-sub">${esc(date(o.created_at))}</span></div><span class="payment-pill">${esc((o.payment_method||'—').toUpperCase())}</span></div><div style="margin-top:7px"><span class="customer-name">${esc(customer(o))}</span><span class="customer-sub">${Number(o.unit_count||0)} units · ${Number(o.item_count||0)} products${amountOK?' · '+money(o.total_paise):''}</span></div><div class="m-grid"><div><span>Payment</span><strong>${esc(o.payment_status||'—')}</strong></div><div><span>Assigned</span><strong>${esc(o.assigned_to_name||'Unassigned')}</strong></div></div>${statusSelect(o)}<div class="m-actions"><button class="view-btn" data-view="${o.id}">View</button><button class="print-btn" data-print="${o.id}">Print</button><button data-note="${o.id}">Note</button></div></article>`).join('');wireRows()}
function wireRows(){for(const s of document.querySelectorAll('[data-status-id]'))s.onchange=async()=>{const next=s.value,id=+s.dataset.statusId;s.value='';if(next)openStatusAction(id,next)};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>openDetail(+b.dataset.view);for(const b of document.querySelectorAll('[data-print]'))b.onclick=()=>printOne(+b.dataset.print);for(const b of document.querySelectorAll('[data-note]'))b.onclick=()=>editNote(+b.dataset.note)}
async function load(){ $('count').textContent='Loading orders…';orders=await A.all('orders.list',{},n=>$('count').textContent=`Loaded ${n} orders…`);if(owner){try{const u=await A.all('admin.users');staff=u.filter(x=>x.role==='admin'&&x.status==='verified')}catch{staff=[]}}render()}

function modalForm(title,sub,fields,onSave){$('action-title').textContent=title;$('action-sub').textContent=sub||'';$('action-body').innerHTML=fields;$('action-form').onsubmit=async e=>{e.preventDefault();const btn=$('action-save');btn.disabled=true;try{await onSave(new FormData(e.currentTarget));$('actionModal').close()}catch(err){A.error(err)}finally{btn.disabled=false}};$('actionModal').showModal()}
function openStatusAction(id,next){const o=orders.find(x=>+x.id===+id);if(!o)return;let fields='';if(next==='dispatched')fields=`<label>Tracking / dispatch reference<input name="tracking" value="${esc(o.tracking||'')}" placeholder="LR / courier / vehicle / tracking"></label>`;if(next==='cancelled')fields=`<label>Cancellation reason<select name="reason"><option>Customer requested cancellation</option><option>Out of stock</option><option>Duplicate order</option><option>Wrong order</option><option>Wrong address</option><option>Payment issue</option><option>Other</option></select></label><label>Additional reason<textarea name="other" placeholder="Optional details"></textarea></label>`;fields+=`<label>Internal note<textarea name="note" placeholder="Optional admin note"></textarea></label>`;modalForm(next==='cancelled'?`Cancel #ON${id}`:`Mark #ON${id} ${statusLabel(next)}`,'The retailer will receive an order notification after this status change.',fields,async fd=>{const reason=next==='cancelled'?[fd.get('reason'),fd.get('other')].filter(Boolean).join(' · '):undefined;await A.api('order.status',{id,status:next,expected_version:o.version,...(next==='dispatched'?{tracking:String(fd.get('tracking')||'')}:{}),...(reason?{reason}:{}),note:String(fd.get('note')||'')});A.toast(`Order #ON${id} updated to ${statusLabel(next)}`);await load();if(current?.order?.id===id)await openDetail(id)})}
function editNote(id){const o=orders.find(x=>+x.id===+id);if(!o)return;modalForm(`Internal note · #ON${id}`,'This note is visible only to authorized admins.',`<label>Internal note<textarea name="note">${esc(o.internal_note||'')}</textarea></label>`,async fd=>{await A.api('order.status',{id,status:o.status,operation:'note',expected_version:o.version,note:String(fd.get('note')||'')});A.toast('Internal note saved');await load();if(current?.order?.id===id)await openDetail(id)})}
function assignOrder(id){if(!owner)return;const o=orders.find(x=>+x.id===+id);if(!o)return;const opts=`<option value="">Unassigned</option>`+staff.map(s=>`<option value="${s.id}" ${+o.assigned_to_profile_id===+s.id?'selected':''}>${esc(s.name||s.email)}</option>`).join('');modalForm(`Assign #ON${id}`,'Owner-only operational assignment.',`<label>Assign to<select name="staff">${opts}</select></label><label>Reason<input name="reason" required minlength="3" value="Order fulfilment assignment"></label>`,async fd=>{await A.api('order.status',{id,status:o.status,operation:'assign',expected_version:o.version,staff_id:String(fd.get('staff')||''),reason:String(fd.get('reason')||'')});A.toast('Assignment updated');await load();if(current?.order?.id===id)await openDetail(id)})}

async function detail(id){return await A.api('order.details',{id})}
async function openDetail(id){$('detail-title').textContent=`Order #ON${id}`;$('detail-sub').textContent='Loading complete order information…';$('detail-body').innerHTML='<p>Loading…</p>';$('detailModal').showModal();try{const d=await detail(id);current=d;lastDetail=d;renderDetail(d)}catch(err){$('detail-body').innerHTML=`<div class="notice error">${esc(err.message||'Could not open order')}</div>`}}
function timeline(status){if(status==='cancelled')return `<div class="notice error">This order was cancelled.</div>`;const steps=['placed','confirmed','packed','dispatched','delivered'],cur=steps.indexOf(status);return `<div class="timeline">${steps.map((s,i)=>`<div class="ts ${i<cur?'done':i===cur?'current':''}"><div class="tdot"></div><span>${statusLabel(s)}</span></div>`).join('')}</div>`}
function renderDetail(d){const o=d.order||{},c=d.customer||{},items=d.items||[],events=d.events||[],profit=Number(o.potential_profit_paise||0),mrp=Number(o.mrp_total_paise||0);$('detail-sub').textContent=`${date(o.created_at)} · ${statusLabel(o.status)} · ${(o.payment_method||'—').toUpperCase()}`;const productRows=items.length?items.map(i=>{const q=Number(i.qty||0),u=Number(i.unit_price_paise||0),m=Number(i.mrp_paise||0),line=q*u,lp=Math.max(0,q*(m-u));return `<tr><td><b>${esc(i.title||'Product')}</b><br><small>${esc(i.unit||'unit')}</small></td><td>${q}</td>${d.show_amounts?`<td>${money(u)}</td><td>${money(m)}</td><td>${money(line)}</td><td class="profit">${money(lp)} (${pct(lp,q*m)})</td>`:''}</tr>`}).join(''):'<tr><td colspan="6">No item snapshot available.</td></tr>';const eventHtml=events.length?events.map(e=>`<div class="event"><div class="eicon">${e.type==='status'?'↗':e.type==='payment'?'₹':e.type==='assignment'?'👤':e.type==='note'?'✎':'•'}</div><div><strong>${esc((e.type||'update').replaceAll('_',' '))}${e.to_status?' · '+statusLabel(e.to_status):''}</strong><span>${esc(e.note||'')}${e.actor_name?' · '+esc(e.actor_name):''}</span><span>${esc(date(e.created_at))}</span></div></div>`).join(''):'<span class="muted">No recorded activity yet.</span>';
$('detail-body').innerHTML=`<div class="detail-layout"><div>
<section class="card hero"><div class="hero-top"><div><span>Order total</span><strong>${d.show_amounts?money(o.total_paise):'Financials hidden'}</strong></div><select id="detail-status" class="status-select ${statusClass(o.status)}" ${validNext(o.status).length?'':'disabled'}><option value="">${esc(statusLabel(o.status))}</option>${validNext(o.status).map(s=>`<option value="${s}">${s==='cancelled'?'Cancel Order':'→ '+statusLabel(s)}</option>`).join('')}</select></div>${d.show_amounts?`<div class="hero-profit"><span>Retailer potential profit</span><b>${money(profit)} (${pct(profit,mrp)})</b></div>`:''}</section>
<section class="card"><h3>Order progress</h3>${timeline(o.status)}</section>
<section class="card"><h3>Customer & delivery</h3><div class="info"><div><span>Business</span><strong>${esc(c.business_name||'—')}</strong></div><div><span>Customer</span><strong>${esc(c.name||'—')}</strong></div>${d.show_contact?`<div><span>Mobile</span><strong>${esc(c.phone||'—')}</strong></div><div><span>Email</span><strong>${esc(c.email||'—')}</strong></div>`:''}</div>${d.show_contact?`<div class="addr" style="margin-top:8px">${esc(fullAddress(d.address))}</div><div class="mini-actions">${c.phone?`<a href="tel:${esc(c.phone)}">Call</a><a target="_blank" rel="noopener" href="https://wa.me/91${esc(String(c.phone).replace(/\D/g,''))}">WhatsApp</a>`:''}<button id="copy-address">Copy address</button><button id="customer-history">Show this retailer only</button></div>`:''}</section>
<section class="card"><h3>Products · ${items.reduce((n,i)=>n+Number(i.qty||0),0)} units</h3><table class="items"><thead><tr><th>Product</th><th>Qty</th>${d.show_amounts?'<th>Wholesale</th><th>MRP</th><th>Amount</th><th>Potential</th>':''}</tr></thead><tbody>${productRows}</tbody></table></section>
<section class="card"><h3>Notes</h3><b style="font-size:9px">Customer note</b><div class="note">${esc(d.customer_note||'No customer note.')}</div><b style="font-size:9px;display:block;margin-top:8px">Internal admin note</b><div class="note admin">${esc(d.internal_note||'No internal note.')}</div><div class="mini-actions"><button id="detail-note">Add / edit internal note</button></div></section>
</div><aside>
<section class="card"><h3>Operations</h3><div class="info"><div><span>Payment</span><strong>${esc((o.payment_method||'—').toUpperCase())} · ${esc(o.payment_status||'—')}</strong></div><div><span>Assigned</span><strong>${esc(d.assigned_to?.name||'Unassigned')}</strong></div><div><span>Tracking</span><strong>${esc(o.tracking||'Not dispatched')}</strong></div><div><span>Updated</span><strong>${esc(date(o.updated_at))}</strong></div></div><div class="mini-actions">${owner?'<button id="detail-assign">Assign staff</button>':''}${collectOK&&o.status==='delivered'&&o.payment_status==='unpaid'?'<button id="collect-cod">Record COD collected</button>':''}</div></section>
${d.show_amounts?`<section class="card"><h3>Financial summary</h3><div class="fin"><div class="fr"><span>Subtotal</span><b>${money(d.subtotal_paise)}</b></div><div class="fr"><span>Coupon ${d.coupon_code?esc(d.coupon_code):''}</span><b>− ${money(o.discount_paise||0)}</b></div><div class="fr"><span>Delivery</span><b>${Number(o.shipping_paise||0)?money(o.shipping_paise):'Free'}</b></div><div class="fr total"><span>Total</span><b>${money(o.total_paise)}</b></div><div class="fr"><span>MRP retail value</span><b>${money(o.mrp_total_paise)}</b></div><div class="fr profit"><span>Potential profit</span><b>${money(profit)} (${pct(profit,mrp)})</b></div></div></section>`:''}
<section class="card"><h3>Print & documents</h3><div class="doc-grid"><button id="doc-summary">Order Summary</button>${d.show_amounts?'<button id="doc-receipt">Customer Receipt</button>':''}<button id="doc-pack">Packing Slip</button><button id="doc-label">Dispatch Label</button></div></section>
<section class="card"><h3>Activity timeline</h3><div class="events">${eventHtml}</div></section>
</aside></div>`;
const ds=$('detail-status');if(ds)ds.onchange=()=>{const n=ds.value;ds.value='';if(n)openStatusAction(o.id,n)};if($('detail-note'))$('detail-note').onclick=()=>editNote(o.id);if($('detail-assign'))$('detail-assign').onclick=()=>assignOrder(o.id);if($('copy-address'))$('copy-address').onclick=async()=>{await navigator.clipboard.writeText(fullAddress(d.address));A.toast('Address copied')};if($('customer-history'))$('customer-history').onclick=()=>{$('detailModal').close();$('search').value=String(o.user_id);render()};if($('collect-cod'))$('collect-cod').onclick=async()=>{if(!confirm(`Confirm COD collection for #ON${o.id}?`))return;await A.api('payment.collect',{id:o.id,expected_version:o.version});A.toast('COD collection recorded');await load();await openDetail(o.id)};if($('doc-summary'))$('doc-summary').onclick=()=>printDoc(d,'summary');if($('doc-receipt'))$('doc-receipt').onclick=()=>printDoc(d,'receipt');if($('doc-pack'))$('doc-pack').onclick=()=>printDoc(d,'packing');if($('doc-label'))$('doc-label').onclick=()=>printDoc(d,'label')}

function docHtml(d,type){const o=d.order||{},c=d.customer||{},items=d.items||[],addr=fullAddress(d.address),rows=items.map(i=>`<tr><td>${esc(i.title||'Product')}</td><td>${Number(i.qty||0)}</td>${type==='packing'?'':d.show_amounts?`<td>${money(i.unit_price_paise)}</td><td>${money(Number(i.qty||0)*Number(i.unit_price_paise||0))}</td>`:''}</tr>`).join('');const head=`<div style="font-family:Arial,sans-serif;color:#14251f;max-width:850px;margin:auto"><div style="display:flex;justify-content:space-between;border-bottom:2px solid #17634c;padding-bottom:10px"><div><h1 style="margin:0;color:#17634c">ONeness</h1><small>${type==='packing'?'Packing Slip':type==='label'?'Dispatch Label':type==='receipt'?'Customer Receipt':'Order Summary'}</small></div><div style="text-align:right"><b style="font-size:18px">#ON${o.id}</b><br><small>${date(o.created_at)}</small></div></div>`;if(type==='label')return `${head}<div style="border:3px solid #14251f;padding:18px;margin-top:18px"><h2>${esc(c.business_name||c.name||'Retailer')}</h2><p style="font-size:17px;line-height:1.5">${esc(addr)}</p>${d.show_contact&&c.phone?`<p><b>Mobile:</b> ${esc(c.phone)}</p>`:''}${d.show_amounts&&o.payment_method==='cod'?`<h2>COD ${money(o.total_paise)}</h2>`:''}</div></div>`;return `${head}<p><b>${esc(c.business_name||c.name||'Retailer')}</b>${d.show_contact&&c.phone?'<br>'+esc(c.phone):''}<br>${esc(addr)}</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #ccc">Product</th><th style="padding:7px;border-bottom:1px solid #ccc">Qty</th>${type==='packing'?'':d.show_amounts?'<th style="padding:7px;border-bottom:1px solid #ccc">Rate</th><th style="padding:7px;border-bottom:1px solid #ccc">Amount</th>':''}</tr></thead><tbody>${rows}</tbody></table>${type==='packing'?'<p style="margin-top:25px">☐ Quantity checked<br><br>☐ Packed securely<br><br>Packed by: __________________</p>':d.show_amounts?`<div style="width:320px;max-width:100%;margin-left:auto;margin-top:15px"><p>Subtotal <b style="float:right">${money(d.subtotal_paise)}</b></p><p>Discount <b style="float:right">− ${money(o.discount_paise||0)}</b></p><p>Delivery <b style="float:right">${Number(o.shipping_paise||0)?money(o.shipping_paise):'Free'}</b></p><hr><h2>Total <span style="float:right">${money(o.total_paise)}</span></h2><p>Payment <b style="float:right">${esc((o.payment_method||'').toUpperCase())} · ${esc(o.payment_status||'')}</b></p></div>`:''}<p style="margin-top:25px;font-size:11px;color:#69776f">Order status: ${esc(statusLabel(o.status))}${type==='receipt'?'. This is an order receipt, not a GST tax invoice.':''}</p></div>`}
function printDoc(d,type){A.print(`Order #ON${d.order.id}`,docHtml(d,type))}
async function printOne(id){try{const d=await detail(id);printDoc(d,'summary')}catch(err){A.error(err)}}
function printFiltered(){const r=filtered(),rows=r.map(o=>`<tr><td>#ON${o.id}</td><td>${esc(customer(o))}</td><td>${esc(date(o.created_at))}</td><td>${Number(o.unit_count||0)}</td>${amountOK?`<td>${money(o.total_paise)}</td>`:''}<td>${esc((o.payment_method||'').toUpperCase())}</td><td>${esc(statusLabel(o.status))}</td></tr>`).join('');A.print('Orders',`<h2>ONeness · Filtered Orders</h2><table><thead><tr><th>Order</th><th>Retailer</th><th>Date</th><th>Units</th>${amountOK?'<th>Amount</th>':''}<th>Payment</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`)}
function exportCsv(){const r=filtered(),headers=['Order ID','Retailer','Customer','Mobile','Created IST','Products','Units',...(amountOK?['Amount INR']:[]),'Payment Method','Payment Status','Status','Assigned','PIN','Tracking','Internal Note'],rows=r.map(o=>[o.id,o.business_name||'',o.customer_name||'',contactOK?o.customer_phone||'':'',date(o.created_at),o.item_count||0,o.unit_count||0,...(amountOK?[Number(o.total_paise||0)/100]:[]),o.payment_method,o.payment_status,o.status,o.assigned_to_name||'',o.delivery_pincode||'',o.tracking||'',o.internal_note||'']);A.csv('Orders',headers,rows,'Filtered ONeness orders')}

$('detail-x').onclick=()=>$('detailModal').close();$('action-x').onclick=$('action-cancel').onclick=()=>$('actionModal').close();$('refresh').onclick=()=>load().catch(A.error);$('export').onclick=()=>{try{exportCsv()}catch(e){A.error(e)}};$('print-list').onclick=()=>{try{printFiltered()}catch(e){A.error(e)}};$('clear').onclick=()=>{for(const id of ['search','status','payment','assignment','from','to'])$(id).value='';activeStatus='';page=1;render()};for(const id of ['search','status','payment','assignment','from','to'])$(id).oninput=()=>{if(id==='status')activeStatus=$('status').value;page=1;render()};$('page-size').onchange=()=>{pageSize=+$('page-size').value;page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
await load();const qid=+new URLSearchParams(location.search).get('id');if(qid)await openDetail(qid);
})().catch(e=>{if(window.App)App.fail(e);else document.body.textContent='Could not load ONeness. '+e.message});
</script>
</body>
</html>
