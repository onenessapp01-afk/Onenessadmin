<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b32"><meta name="referrer" content="no-referrer"><title>ONeness · Orders</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%2317634c%27/%3E%3Ctext x=%2713%27 y=%2748%27 font-size=%2747%27 fill=%27white%27%3EO%3C/text%3E%3C/svg%3E">
<style>body{margin:0;background:#f4f6f2;font-family:system-ui}#boot{padding:30px;color:#426052}</style>
</head><body>
<div id="app"><p id="boot">Opening ONeness…</p></div>
<script>
(async()=>{

const response=await fetch(new URL('auth.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep auth.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){
 const node=shared.getElementById(id);if(!node)throw Error('auth.html is incomplete.');
 document.head.append(node.cloneNode(true));
}
const source=shared.getElementById('oneness-core');if(!source)throw Error('auth.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('orders'),{$,esc,money}=A;let orders=[],users=[],page=1,shown=[];
if(A.profile.role!=='retailer'&&!A.can('orders'))throw Error('Order access is required.');
$('view').innerHTML=A.header('Orders','From first confirmation to the final delivery.','<button id="refresh">Refresh</button><button id="export">Export CSV</button>')+`<div class="filters"><label>Search<input id="search" placeholder="Order or retailer ID"></label>${A.dateFields()}<label>Status<select id="status"><option value="">All statuses</option>${['syncing','placed','confirmed','dispatched','delivered','cancelled'].map(s=>`<option>${s}</option>`).join('')}</select></label><label>Payment<select id="payment"><option value="">All payments</option><option>unpaid</option><option>collected</option></select></label></div><p id="count" class="muted"></p><div id="list"></div><div class="row" style="margin-top:18px"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div>`;
// History defaults to all dates, so an order link never disappears in a month filter.
$('from').value='';$('to').value='';$('period').value='all';
async function load(){orders=await A.all('orders.list',{},n=>$('count').textContent=`Loaded ${n} orders…`);if(A.can('users'))users=await A.all('admin.users');render();}
function customer(id){const u=users.find(x=>x.id===id);return u?.business_name||u?.name||'Retailer #'+id;}
function filtered(){const r=A.range(),q=$('search').value.toLowerCase();return orders.filter(o=>A.inRange(o.created_at,r)&&(!$('status').value||o.status===$('status').value)&&(!$('payment').value||o.payment_status===$('payment').value)&&(`${o.id} ${o.user_id} ${customer(o.user_id)}`).toLowerCase().includes(q));}
function render(){try{shown=filtered();page=Math.max(1,Math.min(page,Math.ceil(shown.length/25)));$('count').textContent=`${shown.length} orders · Filtered by order creation date`;$('list').innerHTML=A.table(['Order','Retailer','Created','Total','Status','Payment',''],shown.slice((page-1)*25,page*25).map(o=>[`#${o.id}`,esc(customer(o.user_id)),esc(A.date(o.created_at)),money(o.total_paise),A.badge(o.status),A.badge(o.payment_status),`<button class="small" data-open="${o.id}">Open</button>`]));$('page').textContent=`Page ${page} of ${Math.max(1,Math.ceil(shown.length/25))}`;$('prev').disabled=page===1;$('next').disabled=page*25>=shown.length;for(const b of document.querySelectorAll('[data-open]'))b.onclick=()=>open(+b.dataset.open).catch(A.error);}catch(e){A.error(e);}}
async function open(id){const o=orders.find(x=>x.id===id);if(!o)throw Error('Order is not available.');A.modal('Order #'+id,'<p>Loading order details…</p>');let details=null,notice='';if(o.sheet_version>0){try{details=(await A.api('order.details',{id})).details;}catch(e){notice=e.message;}}else notice='Your order is being saved. Refresh this order shortly. Do not place it again.';const lines=details?A.table(['Product','Quantity','Unit price','Amount'],details.items.map(i=>[esc(i.title||'Product #'+i.product_id),i.qty,money(i.unit_price_paise),i.unit_price_paise===undefined?'—':money(i.qty*i.unit_price_paise)])):'';
 const summary=`<div class="row">${A.badge(o.status)}${A.badge(o.payment_status)}</div><p class="muted">${esc(A.date(o.created_at))} · ${esc(customer(o.user_id))}</p>${notice?`<div class="notice">${esc(notice)}</div>`:''}${lines}${details?`<p style="margin-top:18px">${Object.values(details.address).filter(Boolean).map(esc).join(', ')}</p><p>${esc(details.note||'')}</p>`:''}<p><b>Total: ${money(o.total_paise)}</b> · Coupon discount: ${money(o.discount_paise)}</p>${details&&details.shipping_paise!==undefined?`<p>Delivery charge: ${money(details.shipping_paise)}</p>`:''}${o.tracking?`<p>Tracking: ${esc(o.tracking)}</p>`:''}`;
 $('dialog-body').innerHTML=summary+'<div class="row" id="order-actions" style="margin-top:20px"></div>';const actions=$('order-actions');function button(label,handler,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=async()=>{b.disabled=true;try{await handler();}catch(e){A.error(e);}finally{b.disabled=false;}};actions.append(b);}
 button('Refresh',async()=>{await load();await open(id);});if(details)button('Print summary',()=>A.print('Order #'+id,summary));if(A.can('audit'))button('Activity log',()=>A.logs('order',id));
 if(A.profile.role==='retailer'&&details)button('Reorder',async()=>{const next=A.cart(),skipped=[];for(const line of details.items){try{const p=await A.api('product.get',{id:+line.product_id});const qty=Math.max(p.min_qty,p.min_qty+Math.ceil((line.qty-p.min_qty)/p.qty_step)*p.qty_step);if(!p.active||qty>p.stock)throw Error();const old=next.find(x=>x.product_id===p.id);if(old)old.qty=qty;else next.push({product_id:p.id,qty});}catch{skipped.push(line.title||line.product_id);}}A.setCart(next);A.toast(skipped.length?'Some unavailable products were skipped. Review your cart.':'Items added at current prices.');});
 const next={placed:'confirmed',confirmed:'dispatched',dispatched:'delivered'}[o.status];if(A.can('orders')&&next)button('Mark '+next,async()=>{let tracking=o.tracking;if(next==='dispatched'){tracking=prompt('Tracking / dispatch reference (optional)',tracking);if(tracking===null)return;}if(!confirm('Mark order #'+id+' as '+next+'?'))return;await A.api('order.status',{id,status:next,tracking,expected_version:o.version});await load();await open(id);},'primary');
 if((A.can('orders')&&['placed','confirmed'].includes(o.status))||(A.profile.role==='retailer'&&o.status==='placed'))button('Cancel order',async()=>{const reason=prompt('Reason for cancelling this order');if(!reason?.trim())return;await A.api('order.status',{id,status:'cancelled',reason,expected_version:o.version});await load();await open(id);},'danger');
 if(A.can('finance')&&o.status==='delivered'&&o.payment_status==='unpaid')button('Record cash collected',async()=>{if(!confirm('Confirm that '+money(o.total_paise)+' cash was actually collected?'))return;await A.api('payment.collect',{id,expected_version:o.version});await load();await open(id);},'primary');
}
A.wireDates(()=>{page=1;render();});for(const id of ['search','status','payment'])$(id).oninput=()=>{page=1;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('refresh').onclick=()=>load().catch(A.error);$('export').onclick=()=>{try{A.csv('Orders',['Order ID','Retailer','Created IST','Status','Total INR','Discount INR','Payment','Collected IST'],filtered().map(o=>[o.id,customer(o.user_id),A.date(o.created_at),o.status,o.total_paise===undefined?'':o.total_paise/100,o.discount_paise===undefined?'':o.discount_paise/100,o.payment_status,A.date(o.collected_at)]),A.range().label+'; search='+$('search').value+'; status='+$('status').value+'; payment='+$('payment').value);}catch(e){A.error(e);}};await load();const id=+new URLSearchParams(location.search).get('id');if(id)await open(id);

})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
</body></html>
