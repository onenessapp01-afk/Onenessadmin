function paymentLabel(s){return ({unpaid:'Unpaid',collected:'Collected',paid:'Paid',pending:'Pending'})[s]||String(s||'—')}
function dateTime(v){return v?new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
function shortDate(v){return v?new Date(v).toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric'}):'—'}
function profitText(a,mrp){const p=Number(a||0),m=Number(mrp||0),pct=m?p*100/m:0;return `${money(p)} (${pct.toFixed(pct%1?1:0)}%)`}
function validNext(o){const map={placed:['confirmed','cancelled'],confirmed:['packed','dispatched','cancelled'],packed:['dispatched','cancelled'],dispatched:['delivered']};return (map[o.status]||[]).filter(s=>isOwner||A.can(ORDER_PERM[s]))}
function canAction(status){return isOwner||A.can(ORDER_PERM[status])}
function statusSelect(o){const next=validNext(o);if(!next.length)return A.badge(o.status);return `<select class="status-select s-${esc(o.status)}" data-status-order="${o.id}"><option value="">${esc(statusLabel(o.status))}</option>${next.map(s=>`<option value="${s}">${s==='cancelled'?'Cancel order':'Mark '+statusLabel(s)}</option>`).join('')}</select>`}
function alerts(o){return Array.isArray(o.alert_flags)?o.alert_flags:[]}
function alertLabel(a){return ({awaiting_confirmation:'Awaiting confirmation',packed_not_dispatched:'Packed too long',long_in_transit:'Long in transit',cod_uncollected:'COD uncollected'})[a]||a}
function isAttention(o){return alerts(o).length>0}
function retailerName(o){return o.business_name||o.customer_name||`Retailer #${o.user_id}`}
function searchText(o){return `${o.id} ${o.user_id} ${o.customer_name||''} ${o.business_name||''} ${o.customer_phone||''} ${o.customer_email||''} ${o.delivery_pincode||''} ${o.delivery_city||''} ${o.tracking||''} ${o.internal_note||''} ${(o.product_titles||[]).join(' ')}`.toLowerCase()}
function dateBounds(){let from=$('from-date').value?new Date($('from-date').value+'T00:00:00'):null;let to=$('to-date').value?new Date($('to-date').value+'T23:59:59.999'):null;return {from,to}}
function inDate(o){const {from,to}=dateBounds(),d=new Date(o.created_at);return (!from||d>=from)&&(!to||d<=to)}
function staffName(id){if(!id)return 'Unassigned';return staff.find(s=>+s.id===+id)?.name||`Staff #${id}`}
function fullAddress(a){if(!a||typeof a!=='object')return 'Address unavailable';return [a.contact_name,a.business_name,a.address_line1,a.address_line2,a.landmark?`Near ${a.landmark}`:'',a.city,a.taluka,a.district,a.state,a.pincode,a.phone?`Mobile: ${a.phone}`:''].filter(Boolean).join(', ')}
function safePhone(v){return String(v||'').replace(/\D/g,'')}
function currentPageRows(){const r=filtered();return r.slice((page-1)*pageSize,page*pageSize)}
function visibleSelected(){return [...selected].map(id=>orders.find(o=>+o.id===+id)).filter(Boolean)}

async function load(force=false){
 $('result-meta').textContent='Loading orders…';
 const list=await A.all('orders.list',{},n=>$('result-meta').textContent=`Loaded ${n} orders…`);
 orders=Array.isArray(list)?list:[];
 if(isOwner&&!staff.length){
   try{const allUsers=await A.all('admin.users');staff=allUsers.filter(u=>u.role==='admin'&&u.status==='verified');populateStaffFilters()}catch(e){console.warn(e)}
 }
 selected=new Set([...selected].filter(id=>orders.some(o=>+o.id===+id)));
 lastUpdated=new Date();render();
}
function populateStaffFilters(){
 const f=$('assignment-filter');for(const x of [...f.querySelectorAll('option[data-staff]')])x.remove();
 for(const s of staff){const op=document.createElement('option');op.value='staff:'+s.id;op.dataset.staff='1';op.textContent=s.name||s.email||`Staff #${s.id}`;f.append(op)}
}
function counts(){const by=s=>orders.filter(o=>o.status===s).length;return {all:orders.length,placed:by('placed'),confirmed:by('confirmed'),packed:by('packed'),dispatched:by('dispatched'),delivered:by('delivered'),cancelled:by('cancelled'),attention:orders.filter(isAttention).length}}
function renderKpis(){const c=counts();const activeValue=showAmounts?orders.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+Number(o.total_paise||0),0):0;const cards=[['Total',c.all,'Visible orders','active'],['Placed',c.placed,'Needs confirmation','warn'],['Confirmed',c.confirmed,'Ready to fulfil',''],['Packed',c.packed,'Ready to dispatch',''],['Dispatched',c.dispatched,'In transit','warn'],['Delivered',c.delivered,'Completed','active'],['Attention',c.attention,'Needs action',c.attention?'bad':''],['Cancelled',c.cancelled,showAmounts?`Active value ${money(activeValue)}`:'Excluded','bad']];$('order-kpis').innerHTML=cards.map(([l,v,h,cls])=>`<article class="kpi ${cls}"><span>${l}</span><strong>${esc(v)}</strong><small>${esc(h)}</small></article>`).join('')}
function renderChips(){const c=counts(),rows=[['','All',c.all],['placed','Placed',c.placed],['confirmed','Confirmed',c.confirmed],['packed','Packed',c.packed],['dispatched','Dispatched',c.dispatched],['delivered','Delivered',c.delivered],['cancelled','Cancelled',c.cancelled]];$('status-chips').innerHTML=rows.map(([v,l,n])=>`<button class="status-chip ${activeStatus===v?'active':''}" data-chip="${v}">${l} · ${n}</button>`).join('');for(const b of document.querySelectorAll('[data-chip]'))b.onclick=()=>{activeStatus=b.dataset.chip;$('status-filter').value=activeStatus;page=1;render()}}
function filtered(){
 let r=[...orders];const q=$('search').value.trim().toLowerCase(),status=$('status-filter').value,method=$('method-filter').value,payment=$('payment-filter').value,assignment=$('assignment-filter').value,alert=$('alert-filter').value;
 if(customerHistoryId)r=r.filter(o=>+o.user_id===+customerHistoryId);
 if(q)r=r.filter(o=>searchText(o).includes(q));if(status)r=r.filter(o=>o.status===status);if(method)r=r.filter(o=>o.payment_method===method);if(payment)r=r.filter(o=>o.payment_status===payment);
 if(assignment==='mine')r=r.filter(o=>+o.assigned_to_profile_id===+A.profile.id);else if(assignment==='unassigned')r=r.filter(o=>!o.assigned_to_profile_id);else if(assignment==='assigned')r=r.filter(o=>!!o.assigned_to_profile_id);else if(assignment.startsWith('staff:'))r=r.filter(o=>+o.assigned_to_profile_id===+assignment.split(':')[1]);
 if(alert==='attention')r=r.filter(isAttention);else if(alert)r=r.filter(o=>alerts(o).includes(alert));
 r=r.filter(inDate);
 const s=$('sort-filter').value;if(s==='oldest')r.sort((a,b)=>+a.id-+b.id);else if(s==='amount-high')r.sort((a,b)=>Number(b.total_paise||0)-Number(a.total_paise||0));else if(s==='amount-low')r.sort((a,b)=>Number(a.total_paise||0)-Number(b.total_paise||0));else if(s==='retailer')r.sort((a,b)=>retailerName(a).localeCompare(retailerName(b)));else if(s==='status')r.sort((a,b)=>statusLabel(a.status).localeCompare(statusLabel(b.status)));else r.sort((a,b)=>+b.id-+a.id);return r
}
function render(){
 renderKpis();renderChips();const r=filtered(),pages=Math.max(1,Math.ceil(r.length/pageSize));page=Math.max(1,Math.min(page,pages));const rows=r.slice((page-1)*pageSize,page*pageSize);
 $('result-meta').textContent=`${r.length} matching orders · ${orders.length} total visible to your account`;$('page-info').textContent=`Page ${page} of ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('updated-meta').textContent=lastUpdated?`Updated ${dateTime(lastUpdated)} · auto refresh 60s`:'Connecting…';
 $('history-filter').hidden=!customerHistoryId;if(customerHistoryId){const o=orders.find(x=>+x.user_id===+customerHistoryId);$('history-filter-text').textContent=`Showing all orders from ${retailerName(o||{user_id:customerHistoryId})}`}
 $('orders-body').innerHTML=rows.map(o=>`<tr class="${isAttention(o)?'attention':''}"><td><input class="check row-check" type="checkbox" data-check="${o.id}" ${selected.has(+o.id)?'checked':''}></td><td><span class="order-code">#ON${o.id}</span>${o.status==='placed'?'<span class="new-pill">NEW</span>':''}</td><td class="retailer-col"><button class="linklike" data-customer-history="${o.user_id}" style="border:0;background:none;padding:0;text-align:left"><span class="retailer-title">${esc(retailerName(o))}</span><span class="retailer-sub">${esc(o.customer_name||'Retailer')} ${showContact&&o.customer_phone?'· '+esc(o.customer_phone):''}</span></button></td><td>${esc(dateTime(o.created_at))}</td><td><b>${Number(o.unit_count||0)}</b> units<span class="items-sub"> · ${Number(o.item_count||0)} products</span></td>${showAmounts?`<td><span class="money-strong">${money(o.total_paise)}</span></td>`:''}<td>${esc((o.payment_method||'—').toUpperCase())}<span class="retailer-sub">${esc(paymentLabel(o.payment_status))}</span></td><td>${statusSelect(o)}</td><td><span class="assign-tag">${esc(o.assigned_to_name||'Unassigned')}</span></td><td class="note-col"><span class="note-preview">${esc(o.internal_note||'—')}</span></td><td><div class="alert-stack">${alerts(o).map(a=>`<span class="alert-mini">${esc(alertLabel(a))}</span>`).join('')||'<span class="muted">—</span>'}</div></td><td><div class="action-row"><button class="tiny-btn" data-open="${o.id}">View</button><button class="tiny-btn" data-note="${o.id}">Note</button><div class="menu"><button class="tiny-btn" data-more="${o.id}">⋯</button><div class="menu-pop">${canPrint?`<button data-print-menu="${o.id}">Print / download</button>`:''}${isOwner?`<button data-assign="${o.id}">Assign staff</button>`:''}<button data-copy-order="${o.id}">Copy order number</button>${showContact&&o.customer_phone?`<button data-copy-phone="${o.id}">Copy customer mobile</button>`:''}${o.tracking?`<button data-copy-tracking="${o.id}">Copy tracking</button>`  $('mobile-orders').innerHTML=rows.map(o=>`<article class="m-order"><div class="m-head"><div><span class="order-code">#ON${o.id}</span>${o.status==='placed'?'<span class="new-pill">NEW</span>':''}<span class="retailer-sub">${esc(dateTime(o.created_at))}</span></div>${A.badge(o.status)}</div><div style="margin-top:8px"><button data-customer-history="${o.user_id}" style="border:0;background:none;padding:0;text-align:left"><b>${esc(retailerName(o))}</b></button><span class="retailer-sub">${esc(o.customer_name||'Retailer')} · ${Number(o.unit_count||0)} units</span></div><div class="m-meta">${showAmounts?`<div class="m-box"><span>Amount</span><strong>${money(o.total_paise)}</strong></div>`:''}<div class="m-box"><span>Payment</span><strong>${esc((o.payment_method||'—').toUpperCase())}</strong></div><div class="m-box"><span>Assigned</span><strong>${esc(o.assigned_to_name||'Unassigned')}</strong></div></div><div>${statusSelect(o)}</div>${isAttention(o)?`<div class="m-alert">${alerts(o).map(alertLabel).join(' · ')}</div>`:''}${o.internal_note?`<div class="note-box internal" style="margin-top:8px">${esc(o.internal_note)}</div>`:''}<div class="m-actions"><button data-open="${o.id}">View</button><button data-note="${o.id}">Note</button>${canPrint?`<button data-print-menu="${o.id}">Print</button>`:''}</div></article>`).join('')||'<div class="card empty">No orders match your filters.</div>';
 $('select-page').checked=rows.length>0&&rows.every(o=>selected.has(+o.id));updateBulkbar();wireRows()
}
function wireRows(){
 for(const c of document.querySelectorAll('[data-check]'))c.onchange=()=>{const id=+c.dataset.check;c.checked?selected.add(id):selected.delete(id);updateBulkbar()};
 for(const s of document.querySelectorAll('[data-status-order]'))s.onchange=()=>{const id=+s.dataset.statusOrder,next=s.value;s.value='';if(next)openAction(id,next)};
 for(const b of document.querySelectorAll('[data-open]'))b.onclick=()=>openOrder(+b.dataset.open).catch(A.error);
 for(const b of document.querySelectorAll('[data-note]'))b.onclick=()=>openNote(+b.dataset.note);
 for(const b of document.querySelectorAll('[data-assign]'))b.onclick=()=>openAssign([+b.dataset.assign]);
 for(const b of document.querySelectorAll('[data-print-menu]'))b.onclick=()=>openPrintMenu(+b.dataset.printMenu).catch(A.error);
 for(const b of document.querySelectorAll('[data-more]'))b.onclick=e=>{e.stopPropagation();const m=b.closest('.menu');document.querySelectorAll('.menu.open').forEach(x=>{if(x!==m)x.classList.remove('open')});m.classList.toggle('open')};
 for(const b of document.querySelectorAll('[data-copy-order]'))b.onclick=()=>copyText('ON'+b.dataset.copyOrder,'Order number copied');
 for(const b of document.querySelectorAll('[data-copy-phone]'))b.onclick=()=>{const o=orders.find(x=>+x.id===+b.dataset.copyPhone);copyText(o?.customer_phone||'','Mobile copied')};
 for(const b of document.querySelectorAll('[data-copy-tracking]'))b.onclick=()=>{const o=orders.find(x=>+x.id===+b.dataset.copyTracking);copyText(o?.tracking||'','Tracking copied')};
 for(const b of document.querySelectorAll('[data-customer-history]'))b.onclick=()=>{customerHistoryId=+b.dataset.customerHistory;page=1;render();drawer.close()};

function updateBulkbar(){const n=selected.size;$('bulkbar').hidden=n===0;$('bulk-count').textContent=`${n} order${n===1?'':'s'} selected`}

 const o=orders.find(x=>+x.id===+id);if(!o)return;const dlg=$('actionDialog');dlg.dataset.id=id;dlg.dataset.next=next;$('action-title').textContent=next==='cancelled'?`Cancel order #ON${id}`:next==='dispatched'?`Dispatch order #ON${id}`:`Mark #ON${id} ${statusLabel(next)}`;
 let body='';if(next==='cancelled')body+=`<label>Cancellation reason<select id="cancel-reason" required><option value="">Choose reason</option><option>Customer requested cancellation</option><option>Out of stock</option><option>Duplicate order</option><option>Wrong order</option><option>Wrong address</option><option>Payment issue</option><option>Other</option></select></label>`;if(next==='dispatched')body+=`<label>Tracking / dispatch reference<input id="action-tracking" maxlength="160" value="${esc(o.tracking||'')}" placeholder="Courier / LR / tracking / vehicle reference"></label>`;body+=`<label>Internal note (optional)<textarea id="action-note" maxlength="2000" rows="4" placeholder="Operational note visible only to admins"></textarea></label><div id="action-error" class="dialog-error" hidden></div>`;$('action-body').innerHTML=body;$('action-submit').textContent=next==='cancelled'?'Cancel order':next==='dispatched'?'Confirm dispatch':'Confirm status';dlg.showModal()

$('action-form').onsubmit=async e=>{e.preventDefault();const dlg=$('actionDialog'),id=+dlg.dataset.id,next=dlg.dataset.next,o=orders.find(x=>+x.id===id),btn=$('action-submit'),err=$('action-error');err.hidden=true;btn.disabled=true;try{const data={id,status:next,expected_version:o.version,note:$('action-note')?.value.trim()||''};if(next==='cancelled'){const reason=$('cancel-reason').value.trim();if(!reason)throw Error('Choose a cancellation reason.');data.reason=reason}if(next==='dispatched')data.tracking=$('action-tracking').value.trim();await A.api('order.status',data);dlg.close();notify(`Order #ON${id} marked ${statusLabel(next)}`);await load();if(currentOrderId===id)await openOrder(id)}catch(ex){err.textContent=ex.message||String(ex);err.hidden=false}finally{btn.disabled=false}};

$('assign-form').onsubmit=async e=>{e.preventDefault();const ids=JSON.parse($('assignDialog').dataset.ids||'[]'),staffVal=$('assign-staff').value,reason=$('assign-reason').value.trim(),err=$('assign-error');err.hidden=true;if(reason.length<3){err.textContent='Enter an assignment reason.';err.hidden=false;return}try{let ok=0,failed=[];for(const id of ids){const o=orders.find(x=>+x.id===+id);try{await A.api('admin.order.assign',{id,expected_version:o.version,staff_id:staffVal?+staffVal:null,reason});ok++}catch(ex){failed.push(`#ON${id}: ${ex.message}`)}}$('assignDialog').close();notify(`${ok} order${ok===1?'':'s'} updated${failed.length?` · ${failed.length} failed`:''}`);await load();if(failed.length)alert(failed.join('\n'))}catch(ex){err.textContent=ex.message||String(ex);err.hidden=false}};

function timelineHtml(x){const o=x.order||{},events=x.events||[];if(o.status==='cancelled')return '<div class="cancel-box">This order is cancelled. Reserved stock has been restored where applicable.</div>';const steps=['placed','confirmed','packed','dispatched','delivered'];const idx=steps.indexOf(o.status);return `<div class="timeline">${steps.map((s,i)=>{const ev=events.find(e=>(e.type==='status'&&e.to_status===s)||(e.type==='created'&&e.to_status===s));const done=idx>=0&&i<idx,current=i===idx;return `<div class="tl ${done?'done':''} ${current?'current':''}"><div class="dot">${done?'✓':current?'•':''}</div><span>${statusLabel(s)}</span><small>${ev?shortDate(ev.created_at):''}</small></div>`}).join('')}</div>${o.status==='syncing'?'<div class="warning-box">Order is still synchronizing with the external order bridge. The checkout snapshot below remains available.</div>':''}`}

 <section class="drawer-card"><h3>Products · ${items.reduce((n,i)=>n+Number(i.qty||0),0)} units</h3>${itemTable}</section>
 <section class="drawer-card"><h3>Order notes</h3><p class="muted" style="font-size:10px;margin-bottom:5px">Customer checkout note</p><div class="note-box">${esc(x.customer_note||'No customer note.')}</div><p class="muted" style="font-size:10px;margin:12px 0 5px">Internal admin note</p><div class="note-box internal">${esc(x.internal_note||'No internal note yet.')}</div><div class="inline-links"><button id="drawer-note">Add / edit internal note</button></div></section>
 ${x.show_amounts?`<section class="drawer-card"><h3>Financial summary</h3><div class="finance"><div class="frow"><span>Wholesale subtotal</span><strong>${money(subtotal)}</strong></div><div class="frow"><span>Coupon${x.coupon_code?` · ${esc(x.coupon_code)}`:''}</span><strong>− ${money(o.discount_paise||0)}</strong></div><div class="frow"><span>Delivery</span><strong>${Number(o.shipping_paise||0)?money(o.shipping_paise):'Free'}</strong></div><div class="frow total"><span>Final order total</span><strong>${money(o.total_paise)}</strong></div><div class="frow"><span>MRP retail value</span><strong>${money(mrp)}</strong></div><div class="frow profit"><span>Retailer potential profit</span><strong>${profitText(profit,mrp)}</strong></div></div></section>`:''}
 <section class="drawer-card"><h3>Operations</h3><div class="ops">${next.map(s=>`<button data-drawer-status="${s}" class="${s==='cancelled'?'danger':'primary'}">${s==='cancelled'?'Cancel order':'Mark '+statusLabel(s)}</button>`).join('')}${isOwner?'<button id="drawer-assign">Assign / unassign</button>':''}${x.can_collect&&o.status==='delivered'&&['unpaid','pending'].includes(o.payment_status)?'<button id="collect-cod" class="primary">Record cash collected</button>':''}${o.tracking?'<button id="copy-tracking-drawer">Copy tracking</button>':''}</div></section>
 <section class="drawer-card"><h3>Activity timeline</h3><div class="event-list">${events.length?events.slice().reverse().map(e=>`<div class="event"><div class="event-icon">${eventIcon(e.type)}</div><div><strong>${esc(e.type==='status'?`${statusLabel(e.from_status)} → ${statusLabel(e.to_status)}`:e.type==='created'?'Order created':e.type==='payment'?'Payment update':e.type==='assignment'?'Assignment update':e.type==='note'?'Internal note':e.type==='tracking'?'Tracking update':e.type)}</strong><span>${esc(e.note||'')}</span><small>${esc(e.actor_name||'System')} · ${esc(dateTime(e.created_at))}</small></div></div>`).join(''):'<p class="muted">No recorded timeline events yet.</p>'}</div>${A.can('audit')?'<div class="inline-links"><button id="audit-full">Open full audit log</button></div>':''}</section>
 ${x.can_print?`<section class="drawer-card"><h3>Print, download & documents</h3><div class="print-grid">${x.show_amounts&&x.receipt_available?'<button id="doc-receipt">Customer receipt / bill</button>':''}<button id="doc-summary">Order summary</button><button id="doc-packing">Packing slip</button><button id="doc-label">Dispatch label</button><button id="doc-pick">Pick list</button><button id="doc-challan">Delivery challan</button></div></section>`:''}`;
 $('retailer-history').onclick=()=>{customerHistoryId=o.user_id;page=1;drawer.close();render()};if($('copy-phone'))$('copy-phone').onclick=()=>copyText(c.phone||'','Mobile copied');if($('copy-address'))$('copy-address').onclick=()=>copyText(fullAddress(a),'Address copied');if($('copy-pin'))$('copy-pin').onclick=()=>copyText(a.pincode||'','PIN copied');if($('drawer-note'))$('drawer-note').onclick=()=>openNote(o.id);if($('drawer-assign'))$('drawer-assign').onclick=()=>openAssign([o.id]);if($('copy-tracking-drawer'))$('copy-tracking-drawer').onclick=()=>copyText(o.tracking||'','Tracking copied');if($('audit-full'))$('audit-full').onclick=()=>A.logs('order',o.id).catch(A.error);
 for(const b of document.querySelectorAll('[data-drawer-status]'))b.onclick=()=>openAction(o.id,b.dataset.drawerStatus);
 if($('collect-cod'))$('collect-cod').onclick=async()=>{if(!confirm(`Confirm that ${x.show_amounts?money(o.total_paise):'the COD amount'} has actually been collected?`))return;try{await A.api('payment.collect',{id:o.id,expected_version:o.version});notify('Cash collection recorded');await load();await openOrder(o.id)}catch(ex){A.error(ex)}};
 if($('doc-receipt'))$('doc-receipt').onclick=()=>showReceipt(x);if($('doc-summary'))$('doc-summary').onclick=()=>printDoc('summary',x);if($('doc-packing'))$('doc-packing').onclick=()=>printDoc('packing',x);if($('doc-label'))$('doc-label').onclick=()=>printDoc('label',x);if($('doc-pick'))$('doc-pick').onclick=()=>printDoc('pick',x);if($('doc-challan'))$('doc-challan').onclick=()=>printDoc('challan',x)
}

function documentHeader(x,title){const o=x.order,c=x.customer||{};return `<div style="font-family:system-ui;color:#14251f"><div style="display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #17634c;padding-bottom:12px;margin-bottom:14px"><div><h1 style="margin:0;color:#17634c">ONeness</h1><div>${esc(title)}</div></div><div style="text-align:right"><b>#ON${o.id}</b><br><small>${esc(dateTime(o.created_at))}</small><br><small>${esc(statusLabel(o.status))}</small></div></div><p><b>${esc(c.business_name||c.name||'Retailer')}</b><br>${esc(c.name||'')}${x.show_contact&&c.phone?'<br>'+esc(c.phone):''}</p>`}
function itemRows(x,amounts=true){return (x.items||[]).map(i=>`<tr><td>${esc(i.title||'Product')}</td><td>${esc(i.unit||'unit')}</td><td>${Number(i.qty||0)}</td>${amounts&&x.show_amounts?`<td>${money(i.unit_price_paise)}</td><td>${money(Number(i.qty||0)*Number(i.unit_price_paise||0))}</td>`:''}</tr>`).join('')}
function receiptHtml(x,standalone=false){const o=x.order,a=x.address||{},c=x.customer||{},subtotal=Number(x.subtotal_paise||0);const inner=`<div class="receipt-paper"><div class="receipt-head"><div><h2>ONeness</h2><p>Wholesale retailer order receipt / bill</p></div><div class="receipt-no"><b>#ON${o.id}</b>${esc(dateTime(o.created_at))}<br>${esc(statusLabel(o.status))}</div></div><div class="receipt-grid"><div><b>Billed to</b>${esc(c.business_name||c.name||'Retailer')}<br>${esc(c.name||'')}<br>${esc(c.phone||'')}<br>${esc(c.email||'')}</div><div><b>Delivered to</b>${esc(x.address_label||'Address')}<br>${esc(fullAddress(a))}</div></div><table class="receipt-table"><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${(x.items||[]).map(i=>`<tr><td>${esc(i.title||'Product')}</td><td>${Number(i.qty||0)}</td><td>${money(i.unit_price_paise)}</td><td>${money(Number(i.qty||0)*Number(i.unit_price_paise||0))}</td></tr>`).join('')}</tbody></table><div class="receipt-total"><div class="fin-row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="fin-row"><span>Coupon${x.coupon_code?` · ${esc(x.coupon_code)}`:''}</span><strong>− ${money(o.discount_paise||0)}</strong></div><div class="fin-row"><span>Delivery</span><strong>${Number(o.shipping_paise||0)?money(o.shipping_paise):'Free'}</strong></div><div class="fin-row total"><span>Total</span><strong>${money(o.total_paise)}</strong></div><div class="fin-row" style="border:0"><span>Payment</span><strong>${esc((o.payment_method||'—').toUpperCase())} · ${esc(paymentLabel(o.payment_status))}</strong></div></div><div class="receipt-foot">Generated from the immutable ONeness checkout snapshot. This document is an order receipt / bill, not a GST tax invoice unless statutory GST invoice fields are configured separately.</div></div>`;if(!standalone)return inner;return `<!doctype html><html><head><meta charset="UTF-8"><title>ONeness Receipt #ON${o.id}</title><style>body{font-family:Arial,sans-serif;color:#14251f;margin:24px}.receipt-paper{max-width:760px;margin:auto;border:1px solid #ddd;border-radius:14px;padding:22px}.receipt-head{display:flex;justify-content:space-between;border-bottom:2px solid #17634c;padding-bottom:12px}.receipt-head h2{margin:0;color:#17634c}.receipt-no{text-align:right}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:15px 0;line-height:1.6}.receipt-table{width:100%;border-collapse:collapse}.receipt-table th,.receipt-table td{padding:9px;border-bottom:1px solid #eee;text-align:left}.receipt-table th:last-child,.receipt-table td:last-child{text-align:right}.receipt-total{width:320px;max-width:100%;margin-left:auto;padding-top:12px}.fin-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #ddd}.fin-row.total{font-size:18px;font-weight:bold}.receipt-foot{font-size:11px;color:#66736c;margin-top:20px;border-top:1px solid #ddd;padding-top:12px}@media print{body{margin:0}.receipt-paper{border:0}}</style></head><body>${inner}</body></html>`}
function showReceipt(x){$('print-title').textContent=`Receipt / Bill · #ON${x.order.id}`;$('print-body').innerHTML=`<div class="receipt-preview">${receiptHtml(x,false)}</div><div class="dialog-foot" style="padding-left:0;padding-right:0"><button id="download-receipt">Download receipt</button><button id="print-receipt" class="primary">Print / Save PDF</button></div>`;$('printDialog').showModal();$('download-receipt').onclick=()=>downloadHtml(`ONeness-Receipt-ON${x.order.id}.html`,receiptHtml(x,true));$('print-receipt').onclick=()=>printRaw(`Receipt #ON${x.order.id}`,receiptHtml(x,true))}
function printDoc(type,x){const o=x.order,a=x.address||{};let title='',body='';if(type==='summary'){title='Order Summary';body=documentHeader(x,title)+`<p>Status: <b>${esc(statusLabel(o.status))}</b> · Payment: <b>${esc(paymentLabel(o.payment_status))}</b></p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Product</th><th>Unit</th><th>Qty</th>${x.show_amounts?'<th>Rate</th><th>Amount</th>':''}</tr></thead><tbody>${itemRows(x,true)}</tbody></table>${x.show_amounts?`<h2>Total ${money(o.total_paise)}</h2>`:''}<p><b>Customer note:</b> ${esc(x.customer_note||'—')}</p><p><b>Internal note:</b> ${esc(x.internal_note||'—')}</p></div>`}else if(type==='packing'||type==='pick'){title=type==='packing'?'Packing Slip':'Warehouse Pick List';body=documentHeader(x,title)+`<p><b>Delivery:</b> ${esc(fullAddress(a))}</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Product</th><th>Unit</th><th>Qty</th><th>Check</th></tr></thead><tbody>${(x.items||[]).map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.unit||'unit')}</td><td style="font-size:18px;font-weight:bold">${Number(i.qty||0)}</td><td>☐ Checked</td></tr>`).join('')}</tbody></table><div style="margin-top:24px"><p>☐ Quantity checked</p><p>☐ Packed securely</p><p>${type==='pick'?'Picked':'Packed'} by: ____________________</p></div></div>`}else if(type==='label'){title='Dispatch Label';body=`<div style="font-family:system-ui;border:3px solid #14251f;padding:18px;max-width:560px"><div style="display:flex;justify-content:space-between"><h1 style="margin:0">ONeness</h1><h2 style="margin:0">#ON${o.id}</h2></div><hr><h2>${esc(x.customer?.business_name||x.customer?.name||'Retailer')}</h2><p style="font-size:18px;line-height:1.5">${esc(fullAddress(a))}</p>${x.show_contact&&x.customer?.phone?`<p style="font-size:18px"><b>Mobile:</b> ${esc(x.customer.phone)}</p>`:''}<div style="margin-top:18px;padding:12px;background:#f4f6f2"><b>Payment:</b> ${esc((o.payment_method||'').toUpperCase())}${x.show_amounts&&o.payment_method==='cod'?` · <span style="font-size:22px">COD ${money(o.total_paise)}</span>`:''}</div></div>`}else if(type==='challan'){title='Delivery Challan';body=documentHeader(x,title)+`<p><b>Delivery address:</b> ${esc(fullAddress(a))}</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Product</th><th>Unit</th><th>Quantity</th></tr></thead><tbody>${itemRows(x,false)}</tbody></table><div style="margin-top:30px;display:flex;justify-content:space-between"><span>Dispatched by: __________</span><span>Received by: __________</span></div></div>`}A.print(`${title} #ON${o.id}`,body)}
function printRaw(title,html){const w=window.open('','_blank','noopener,noreferrer');if(!w){alert('Allow pop-ups to print this document.');return}w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print()},250)}
function downloadHtml(name,html){const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function openPrintMenu(id){const x=await snapshot(id);currentSnapshot=x;$('print-title').textContent=`Print & documents · #ON${id}`;$('print-body').innerHTML=`<div class="print-grid">${x.show_amounts&&x.receipt_available?'<button id="pm-receipt">Customer receipt / bill</button>':''}<button id="pm-summary">Order summary</button><button id="pm-packing">Packing slip</button><button id="pm-label">Dispatch label</button><button id="pm-pick">Pick list</button><button id="pm-challan">Delivery challan</button></div>`;$('printDialog').showModal();if($('pm-receipt'))$('pm-receipt').onclick=()=>showReceipt(x);$('pm-summary').onclick=()=>printDoc('summary',x);$('pm-packing').onclick=()=>printDoc('packing',x);$('pm-label').onclick=()=>printDoc('label',x);$('pm-pick').onclick=()=>printDoc('pick',x);$('pm-challan').onclick=()=>printDoc('challan',x)}
async function getSnapshots(ids){const out=[];for(const id of ids){try{out.push(await snapshot(id))}catch(ex){console.warn(id,ex)}}return out}
async function bulkPrint(type){const xs=await getSnapshots([...selected]);if(!xs.length)return alert('No printable orders selected.');const parts=xs.map(x=>{if(type==='packing')return documentHeader(x,'Packing Slip')+`<table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Product</th><th>Unit</th><th>Qty</th><th>Check</th></tr></thead><tbody>${(x.items||[]).map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.unit||'unit')}</td><td>${Number(i.qty||0)}</td><td>☐</td></tr>`).join('')}</tbody></table></div>`;return `<div style="font-family:system-ui;border:2px solid #14251f;padding:16px"><h2>#ON${x.order.id} · ${esc(x.customer?.business_name||x.customer?.name||'Retailer')}</h2><p>${esc(fullAddress(x.address||{}))}</p>${x.show_amounts&&x.order.payment_method==='cod'?`<h3>COD ${money(x.order.total_paise)}</h3>`:''}</div>`}).join('<div style="page-break-after:always"></div>');A.print(type==='packing'?'Selected Packing Slips':'Selected Dispatch Labels',parts)}

async function bulkStatus(next){const rows=visibleSelected().filter(o=>validNext(o).includes(next));if(!rows.length)return alert(`None of the selected orders can be marked ${statusLabel(next)} with your permissions.`);if(!confirm(`Mark ${rows.length} selected order${rows.length===1?'':'s'} as ${statusLabel(next)}?`))return;let ok=0,fail=[];for(const o of rows){try{await A.api('order.status',{id:o.id,status:next,expected_version:o.version,tracking:o.tracking||'',note:`Bulk update: ${statusLabel(next)}`});ok++}catch(ex){fail.push(`#ON${o.id}: ${ex.message}`)}}notify(`${ok} order${ok===1?'':'s'} updated${fail.length?` · ${fail.length} failed`:''}`);await load();if(fail.length)alert(fail.join('\n'))}
function exportRows(rows,name='Orders'){const headers=['Order ID','Retailer','Customer','Mobile','Created IST','Products','Units',...(showAmounts?['Amount INR']:[]),'Payment method','Payment status','Status','Assigned','PIN','Tracking','Internal note','Attention'];const data=rows.map(o=>[o.id,retailerName(o),o.customer_name||'',showContact?o.customer_phone||'':'',dateTime(o.created_at),o.item_count||0,o.unit_count||0,...(showAmounts?[Number(o.total_paise||0)/100]:[]),o.payment_method,o.payment_status,o.status,o.assigned_to_name||'Unassigned',o.delivery_pincode||'',o.tracking||'',o.internal_note||'',alerts(o).map(alertLabel).join(' | ')]);A.csv(name,headers,data,`Generated ${dateTime(new Date())}`)}
function printFiltered(){const rows=filtered();const html=`<table style="width:100%;border-collapse:collapse"><thead><tr><th>Order</th><th>Retailer</th><th>Date</th><th>Units</th>${showAmounts?'<th>Amount</th>':''}<th>Payment</th><th>Status</th><th>Assigned</th></tr></thead><tbody>${rows.map(o=>`<tr><td>#ON${o.id}</td><td>${esc(retailerName(o))}</td><td>${esc(dateTime(o.created_at))}</td><td>${o.unit_count||0}</td>${showAmounts?`<td>${money(o.total_paise)}</td>`:''}<td>${esc((o.payment_method||'').toUpperCase())}</td><td>${esc(statusLabel(o.status))}</td><td>${esc(o.assigned_to_name||'Unassigned')}</td></tr>`).join('')}</tbody></table>`;A.print('Filtered Orders',html)}

for(const id of ['search','status-filter','method-filter','payment-filter','assignment-filter','alert-filter','sort-filter','from-date','to-date'])$(id).oninput=()=>{if(id==='status-filter')activeStatus=$('status-filter').value;page=1;render()};
$('page-size').onchange=()=>{pageSize=+$('page-size').value;page=1;render()};$('prev').onclick=()=>{page--;render();scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{page++;render();scrollTo({top:0,behavior:'smooth'})};$('select-page').onchange=()=>{for(const o of currentPageRows())$('select-page').checked?selected.add(+o.id):selected.delete(+o.id);render()};
$('refresh').onclick=()=>load(true).catch(A.error);$('export-filtered').onclick=()=>exportRows(filtered(),'Filtered Orders');$('print-filtered').onclick=printFiltered;$('clear-history').onclick=()=>{customerHistoryId=null;page=1;render()};$('clear-filters').onclick=()=>{$('search').value='';$('status-filter').value='';$('method-filter').value='';$('payment-filter').value='';$('assignment-filter').value='';$('alert-filter').value='';$('sort-filter').value='newest';$('from-date').value='';$('to-date').value='';activeStatus='';customerHistoryId=null;page=1;render()};
for(const b of document.querySelectorAll('[data-period]'))b.onclick=()=>{const today=new Date().toISOString().slice(0,10);if(b.dataset.period==='all'){$('from-date').value='';$('to-date').value=''}else if(b.dataset.period==='today'){$('from-date').value=today;$('to-date').value=today}else if(b.dataset.period==='7'){const d=new Date();d.setDate(d.getDate()-6);$('from-date').value=d.toISOString().slice(0,10);$('to-date').value=today}else if(b.dataset.period==='month'){$('from-date').value=today.slice(0,8)+'01';$('to-date').value=today}page=1;render()};
$('bulk-clear').onclick=()=>{selected.clear();render()};$('bulk-packed').onclick=()=>bulkStatus('packed').catch(A.error);$('bulk-dispatched').onclick=()=>bulkStatus('dispatched').catch(A.error);if($('bulk-assign'))$('bulk-assign').onclick=()=>openAssign([...selected]);$('bulk-packing').onclick=()=>bulkPrint('packing').catch(A.error);$('bulk-labels').onclick=()=>bulkPrint('labels').catch(A.error);$('bulk-export').onclick=()=>exportRows(visibleSelected(),'Selected Orders');
$('drawer-close').onclick=()=>drawer.close();for(const b of document.querySelectorAll('[data-close-dialog]'))b.onclick=()=>$(b.dataset.closeDialog).close();document.addEventListener('click',e=>{if(!e.target.closest('.menu'))document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open'))});

autoTimer=setInterval(()=>{if(document.visibilityState==='visible'&&!drawer.open&&!$('actionDialog').open&&!$('noteDialog').open&&!$('assignDialog').open&&!$('printDialog').open)load(true).catch(console.warn)},60000);
window.addEventListener('beforeunload',()=>clearInterval(autoTimer));
await load();
const openId=+new URLSearchParams(location.search).get('id');if(openId)await openOrder(openId);

})().catch(e=>{if(window.App)App.fail(e);else document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message});
</script>
