async function avatarBase64(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPG, PNG or WebP for the profile photo.');
 const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
 const size=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-size)/2,sy=(img.naturalHeight-size)/2;
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;canvas.getContext('2d').drawImage(img,sx,sy,size,size,0,0,512,512);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.86));if(!blob)throw Error('Could not prepare profile photo.');
 return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)});
}
async function uploadAvatar(){
 const file=$('avatar-file').files?.[0];if(!file)return;
 const btn=$('avatar-btn');btn.classList.add('avatar-uploading');
 try{
  const base64=await avatarBase64(file);
  const {data,error}=await A.client.functions.invoke('admin-avatar-upload',{body:{base64,name:file.name||'avatar.webp'}});
  if(error||data?.ok!==true)throw Error(data?.error?.message||error?.message||'Profile photo upload failed.');
  A.profile.avatar_url=data.data.url;
  btn.innerHTML=`<img id="admin-avatar-img" src="${esc(data.data.url)}" alt="">`;
  A.toast('Profile photo updated');
 }catch(e){A.error(e)}finally{btn.classList.remove('avatar-uploading');$('avatar-file').value=''}
}

function counts(){return ['syncing','placed','confirmed','packed','dispatched','delivered','cancelled'].reduce((a,s)=>(a[s]=orders.filter(o=>o.status===s).length,a),{all:orders.length})}
function renderSummary(){
 const c=counts(),rows=[['','All',c.all,''],['placed','Placed',c.placed,'warn'],['confirmed','Confirmed',c.confirmed,''],['packed','Packed',c.packed,''],['dispatched','Dispatched',c.dispatched,'warn'],['delivered','Delivered',c.delivered,'good'],['cancelled','Cancelled',c.cancelled,'bad']];
 $('summary').innerHTML=rows.map(([v,l,n,cl])=>`<div class="summary-box ${cl} ${activeStatus===v?'active':''}" data-summary="${v}"><span>${l}</span><strong>${n}</strong></div>`).join('');
 $('quick').innerHTML=rows.map(([v,l,n])=>`<button class="chip ${activeStatus===v?'on':''}" data-quick="${v}">${l} · ${n}</button>`).join('');
 for(const el of document.querySelectorAll('[data-summary],[data-quick]'))el.onclick=()=>{activeStatus=el.dataset.summary??el.dataset.quick;$('status').value=activeStatus;page=1;render()}
}
function filtered(){
 let r=[...orders];
 const q=$('search').value.trim().toLowerCase(),st=$('status').value,pay=$('payment').value,pr=$('payment-record').value,from=$('from').value,to=$('to').value;
 if(st)r=r.filter(o=>o.status===st);
 if(pay)r=r.filter(o=>o.payment_method===pay);
 if(pr==='unrecorded')r=r.filter(o=>!o.payment_record_type);
 else if(pr)r=r.filter(o=>o.payment_record_type===pr);
 if(from){const t=new Date(from+'T00:00:00+05:30');r=r.filter(o=>new Date(o.created_at)>=t)}
 if(to){const t=new Date(to+'T23:59:59+05:30');r=r.filter(o=>new Date(o.created_at)<=t)}
 if(q)r=r.filter(o=>`on${o.id} #on${o.id} ${o.id} ${o.user_id} ${o.customer_name||''} ${o.business_name||''} ${o.customer_phone||''} ${o.customer_email||''} ${(o.product_titles||[]).join(' ')} ${o.tracking||''} ${o.delivery_pincode||''} ${o.delivery_city||''} ${o.internal_note||''} ${o.payment_reference||''} ${payTypeLabel(o.payment_record_type)}`.toLowerCase().includes(q));
 return r.sort((a,b)=>+b.id-+a.id)
}
function paymentRecordHtml(o){

  return `<span class="pay-record auto"><b>Gateway automatic</b><span>${o.payment_status==='collected'?'Payment confirmed':'Waiting for gateway'}</span></span>`;
 }
 if(o.payment_record_type){
  const ref=o.payment_reference?`Ref ${esc(o.payment_reference)}`:'No reference';
  return `<span class="pay-record done"><b>${esc(payTypeLabel(o.payment_record_type))}</b><span>${ref}</span><span>${esc(localDateTime(o.payment_recorded_at||o.collected_at))}</span></span>`;
 }
 if(o.payment_status==='collected')return `<span class="pay-record done"><b>Collected</b><span>Legacy payment record</span></span>`;
 return `<span class="pay-record pending"><b>Not recorded</b><span>${o.payment_method==='cod'?'Record when received':'—'}</span></span>`;
}
function statusSelect(o){const next=validNext(o.status),disabled=!next.length;return `<select class="status-select ${statusClass(o.status)}" data-status-id="${o.id}" ${disabled?'disabled':''}><option value="">${esc(statusLabel(o.status))}</option>${next.map(s=>`<option value="${s}">${s==='cancelled'?'Cancel Order':'→ '+statusLabel(s)}</option>`).join('')}</select>`}

async function enterSheetMode(){const ws=$('smartWorkspace');sheetMode=true;ws.classList.add('fullscreen-sheet');document.body.classList.add('sheet-lock');syncSheetButtons();updateSheetMeta();try{if(ws.requestFullscreen&&!document.fullscreenElement)await ws.requestFullscreen()}catch{}}

function openStatusAction(id,next){
 const o=orders.find(x=>+x.id===+id);if(!o)return;let fields='';
 if(next==='dispatched')fields=`<label>Tracking / dispatch reference<input name="tracking" value="${esc(o.tracking||'')}" placeholder="LR / courier / vehicle / tracking"></label>`;
 if(next==='cancelled')fields=`<label>Cancellation reason<select name="reason"><option>Customer requested cancellation</option><option>Out of stock</option><option>Duplicate order</option><option>Wrong order</option><option>Wrong address</option><option>Payment issue</option><option>Other</option></select></label><label>Additional reason<textarea name="other" placeholder="Optional details"></textarea></label>`;
 fields+=`<label>Internal note<textarea name="note" placeholder="Optional admin note"></textarea></label>`;
 modalForm(next==='cancelled'?`Cancel #ON${id}`:`Mark #ON${id} ${statusLabel(next)}`,'The retailer will receive an order notification after this status change.',fields,async fd=>{
  const reason=next==='cancelled'?[fd.get('reason'),fd.get('other')].filter(Boolean).join(' · '):undefined;
  await A.api('order.status',{id,status:next,expected_version:o.version,...(next==='dispatched'?{tracking:String(fd.get('tracking')||'')}:{}),...(reason?{reason}:{}),note:String(fd.get('note')||'')});
  A.toast(`Order #ON${id} updated to ${statusLabel(next)}`);await load();if(current?.order?.id===id)await openDetail(id)
 })
}
function editNote(id){
 const o=orders.find(x=>+x.id===+id);if(!o)return;
 modalForm(`Internal note · #ON${id}`,'This note is visible only to authorized admins.',`<label>Internal note<textarea name="note">${esc(o.internal_note||'')}</textarea></label>`,async fd=>{
  await A.api('order.status',{id,status:o.status,operation:'note',expected_version:o.version,note:String(fd.get('note')||'')});
  A.toast('Internal note saved');await load();if(current?.order?.id===id)await openDetail(id)
 })
}

function paymentTimeOptions(selected=''){
 const rows=[];
 for(let h=0;h<24;h++)for(const m of [0,15,30,45]){
  const value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const d=new Date(`2000-01-01T${value}:00`);
  const label=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  rows.push(`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`);
 }
 return rows.join('');
}
function istDayOffset(offset=0){
 return new Date(Date.now()+19800000+offset*86400000).toISOString().slice(0,10);
}
function nearestPastQuarter(){
 const now=new Date(Date.now()+19800000);
 const h=now.getUTCHours(),m=Math.floor(now.getUTCMinutes()/15)*15;
 return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function paymentTimestampFromForm(fd){
 const mode=String(fd.get('time_mode')||'now');
 if(mode==='keep')return {};
 if(mode==='now')return {recorded_at_mode:'now'};
 let day='';
 if(mode==='today')day=istDayOffset(0);
 else if(mode==='yesterday')day=istDayOffset(-1);
 else day=String(fd.get('pay_date')||'').trim();
 const time=String(fd.get('pay_time')||'').trim();
 if(!day||!time)throw Error('Choose a valid payment day and time.');
 return {recorded_at:`${day}T${time}:00+05:30`};
}
function wirePaymentTimeUI(existing){
 const modeInput=document.querySelector('[name="time_mode"]');
 const detail=$('payment-time-detail'),custom=$('payment-custom-date'),preview=$('payment-time-preview');
 const timeSelect=document.querySelector('[name="pay_time"]');
 const dateInput=document.querySelector('[name="pay_date"]');
 const setMode=mode=>{
  modeInput.value=mode;
  for(const b of document.querySelectorAll('[data-pay-time-mode]'))b.classList.toggle('active',b.dataset.payTimeMode===mode);
  detail.hidden=['now','keep'].includes(mode);
  custom.hidden=mode!=='custom';
  if(mode==='today')preview.textContent=`Today · ${timeSelect.selectedOptions[0]?.textContent||''}`;
  else if(mode==='yesterday')preview.textContent=`Yesterday · ${timeSelect.selectedOptions[0]?.textContent||''}`;
  else if(mode==='custom')preview.textContent=`${dateInput.value||'Choose date'} · ${timeSelect.selectedOptions[0]?.textContent||''}`;
  else if(mode==='keep')preview.textContent='Existing payment time will stay unchanged';
  else preview.textContent='Server will record the current time automatically';
 };
 for(const b of document.querySelectorAll('[data-pay-time-mode]'))b.onclick=()=>setMode(b.dataset.payTimeMode);
 timeSelect.onchange=()=>setMode(modeInput.value);
 dateInput.onchange=()=>setMode(modeInput.value);
 setMode(existing?'keep':'now');
}
function recordPayment(id){
 const o=orders.find(x=>+x.id===+id);if(!o)return;
 if(o.payment_method==='online'){A.toast('Online gateway payments are recorded automatically.');return}
 const existing=o.payment_record_type||'cash';
 const existingTime=!!o.payment_recorded_at;
 const keepButton=existingTime?'<button type="button" class="time-mode-btn" data-pay-time-mode="keep">Keep time</button>':'';
 modalForm(`${o.payment_record_type?'Edit':'Record'} payment · #ON${id}`,'Choose how payment was received. Reference and time are optional.',
 `<label>Received via<select name="record_type">
   <option value="cash" ${existing==='cash'?'selected':''}>Cash</option>
   <option value="phonepe" ${existing==='phonepe'?'selected':''}>PhonePe</option>
   <option value="upi" ${existing==='upi'?'selected':''}>UPI / QR</option>
   <option value="bank_transfer" ${existing==='bank_transfer'?'selected':''}>Bank Transfer</option>
   <option value="other" ${existing==='other'?'selected':''}>Other</option>
  </select></label>
  <label>Reference / transaction ID <span class="muted">(optional)</span><input name="reference" maxlength="120" value="${esc(o.payment_reference||'')}" placeholder="UTR / PhonePe ref / receipt no."></label>
  <div class="payment-time-box">
   <div class="payment-time-title"><b>Payment time</b><span>Simple selection</span></div>
   <div class="time-mode-grid">
    ${keepButton}
    <button type="button" class="time-mode-btn" data-pay-time-mode="now">Now</button>
    <button type="button" class="time-mode-btn" data-pay-time-mode="today">Earlier today</button>
    <button type="button" class="time-mode-btn" data-pay-time-mode="yesterday">Yesterday</button>
    <button type="button" class="time-mode-btn" data-pay-time-mode="custom">Another day</button>
   </div>
   <input type="hidden" name="time_mode" value="${existingTime?'keep':'now'}">
   <div id="payment-time-detail" class="time-detail" hidden>
    <div class="time-select-grid">
     <label>Time<select name="pay_time">${paymentTimeOptions(nearestPastQuarter())}</select></label>
     <div id="payment-custom-date" class="custom-date-row" hidden><label>Date<input name="pay_date" type="date" max="${istDayOffset(0)}" value="${istDayOffset(0)}"></label></div>
    </div>
   </div>
   <div id="payment-time-preview" class="payment-time-preview"></div>
  </div>
  <label>Payment note <span class="muted">(optional)</span><textarea name="note" maxlength="500" placeholder="Any collection remark">${esc(o.payment_note||'')}</textarea></label>`,
 async fd=>{
  const timing=paymentTimestampFromForm(fd);
  await A.api('payment.collect',{
   id,
   expected_version:o.version,
   record_type:String(fd.get('record_type')||'cash'),
   reference:String(fd.get('reference')||''),
   ...timing,
   note:String(fd.get('note')||'')
  });
  A.toast(`Payment recorded for #ON${id}`);
  await load();
  if(current?.order?.id===id)await openDetail(id)
 });
 setTimeout(()=>wirePaymentTimeUI(existingTime),0);
}
function suggestionCandidates(){
 const map=new Map(),add=(type,value,label=value)=>{const v=String(value||'').trim();if(!v)return;const key=(type+'|'+v).toLowerCase();if(!map.has(key))map.set(key,{type,value:v,label:String(label||v)})};
 for(const o of orders){
  add('Order',`ON${o.id}`,`#ON${o.id}`);
  add('Shop',o.business_name);
  add('Retailer',o.customer_name);
  if(contactOK)add('Mobile',o.customer_phone);
  add('Tracking',o.tracking);
  add('PIN',o.delivery_pincode);
  add('City',o.delivery_city);
  add('Payment ref',o.payment_reference);
  for(const p of o.product_titles||[])add('Product',p);
 }
 return [...map.values()]
}
function renderSuggestions(){
 const box=$('search-suggest');if(!box)return;
 const q=$('search').value.trim().toLowerCase();
 if(!q){box.hidden=true;box.innerHTML='';return}
 const rows=suggestionCandidates().filter(x=>`${x.value} ${x.label}`.toLowerCase().includes(q)).sort((a,b)=>{
  const aa=a.value.toLowerCase().startsWith(q)?0:1,bb=b.value.toLowerCase().startsWith(q)?0:1;return aa-bb||a.label.localeCompare(b.label)
 }).slice(0,9);
 if(!rows.length){box.hidden=true;box.innerHTML='';return}
 box.innerHTML=rows.map(x=>`<button type="button" data-suggest="${esc(x.value)}"><span class="suggest-type">${esc(x.type)}</span><span class="suggest-text">${esc(x.label)}</span></button>`).join('');
 box.hidden=false;
 for(const b of box.querySelectorAll('[data-suggest]'))b.onclick=()=>{$('search').value=b.dataset.suggest;box.hidden=true;page=1;render()}
}
async function detail(id){return await A.api('order.details',{id})}
function journey(status){
 if(status==='cancelled')return `<div class="cancel-journey">● Order cancelled — fulfilment journey stopped.</div>`;
 const steps=['placed','confirmed','packed','dispatched','delivered'],idx=steps.indexOf(status),safe=Math.max(0,idx),progress=idx<0?0:(safe/(steps.length-1))*100;
 return `<div class="journey" style="--progress:${progress}%;--truck:${progress}%"><div class="journey-road"></div><div class="journey-truck" aria-hidden="true">🚚</div><div class="journey-steps">${steps.map((s,i)=>`<div class="jstep ${i<safe?'done':i===safe&&idx>=0?'current':''}"><div class="jdot"></div><span>${esc(statusLabel(s))}</span></div>`).join('')}</div></div>`;
}
async function openDetail(id){
 $('detail-title').textContent=`Order #ON${id}`;$('detail-sub').textContent='Loading complete order information…';$('detail-body').innerHTML='<p>Loading…</p>';$('detailModal').showModal();
 try{const d=await detail(id);current=d;lastDetail=d;renderDetail(d)}catch(err){$('detail-body').innerHTML=`<div class="notice error">${esc(err.message||'Could not open order')}</div>`}
}
function renderDetail(d){
 const o=d.order||{},c=d.customer||{},items=d.items||[],events=(d.events||[]).filter(e=>e.type!=='assignment'),profit=Number(o.potential_profit_paise||0),mrp=Number(o.mrp_total_paise||0);
 $('detail-sub').textContent=`${date(o.created_at)} · ${statusLabel(o.status)} · ${(o.payment_method||'—').toUpperCase()}`;
 const productRows=items.length?items.map(i=>{const q=Number(i.qty||0),u=Number(i.unit_price_paise||0),m=Number(i.mrp_paise||0),line=q*u,lp=Math.max(0,q*(m-u));return `<tr><td><b>${esc(i.title||'Product')}</b><br><small>${esc(i.unit||'unit')}</small></td><td>${q}</td>${d.show_amounts?`<td>${money(u)}</td><td>${money(m)}</td><td>${money(line)}</td><td class="profit">${money(lp)} (${pct(lp,q*m)})</td>`:''}</tr>`}).join(''):'<tr><td colspan="6">No item snapshot available.</td></tr>';
 const eventHtml=events.length?events.map(e=>`<div class="event"><div class="eicon">${e.type==='status'?'↗':e.type==='payment'||e.type==='payment_record'?'₹':e.type==='note'?'✎':e.type==='tracking'?'⌖':'•'}</div><div><strong>${esc((e.type||'update').replaceAll('_',' '))}${e.to_status?' · '+statusLabel(e.to_status):''}</strong><span>${esc(e.note||'')}${e.actor_name?' · '+esc(e.actor_name):''}</span><span>${esc(date(e.created_at))}</span></div></div>`).join(''):'<span class="muted">No recorded activity yet.</span>';
 const payRecord=o.payment_record_type
   ?`<div class="info payment-record-card"><div><span>Received via</span><strong>${esc(payTypeLabel(o.payment_record_type))}</strong></div><div><span>Reference</span><strong>${esc(o.payment_reference||'—')}</strong></div><div><span>Recorded at</span><strong>${esc(localDateTime(o.payment_recorded_at||o.collected_at))}</strong></div><div><span>Recorded by</span><strong>${esc(d.payment_recorded_by_name||'—')}</strong></div></div>${o.payment_note?`<div class="note" style="margin-top:7px">${esc(o.payment_note)}</div>`:''}`
   :o.payment_method==='online'?`<div class="notice">Online payment records are reserved for automatic payment-gateway confirmation.</div>`:`<div class="notice">No manual payment record yet.</div>`;
 $('detail-body').innerHTML=`
 <section class="card journey-card">${journey(o.status)}</section>
 <div class="detail-layout"><div>
 <section class="card hero"><div class="hero-top"><div><span>Order total</span><strong>${d.show_amounts?money(o.total_paise):'Financials hidden'}</strong></div><select id="detail-status" class="status-select ${statusClass(o.status)}" ${validNext(o.status).length?'':'disabled'}><option value="">${esc(statusLabel(o.status))}</option>${validNext(o.status).map(s=>`<option value="${s}">${s==='cancelled'?'Cancel Order':'→ '+statusLabel(s)}</option>`).join('')}</select></div>${d.show_amounts?`<div class="hero-profit"><span>Retailer potential profit</span><b>${money(profit)} (${pct(profit,mrp)})</b></div>`:''}</section>
 <section class="card"><h3>Customer & delivery</h3><div class="info"><div><span>Business</span><strong>${esc(c.business_name||'—')}</strong></div><div><span>Customer</span><strong>${esc(c.name||'—')}</strong></div>${d.show_contact?`<div><span>Mobile</span><strong>${esc(c.phone||'—')}</strong></div><div><span>Email</span><strong>${esc(c.email||'—')}</strong></div>`:''}</div>${d.show_contact?`<div class="addr" style="margin-top:8px">${esc(fullAddress(d.address))}</div><div class="mini-actions">${c.phone?`<a href="tel:${esc(c.phone)}">Call</a><a target="_blank" rel="noopener" href="https://wa.me/91${esc(String(c.phone).replace(/\D/g,''))}">WhatsApp</a>`:''}<button id="copy-address">Copy address</button></div>`:''}</section>
 <section class="card"><h3>Products · ${items.reduce((n,i)=>n+Number(i.qty||0),0)} units</h3><table class="items"><thead><tr><th>Product</th><th>Qty</th>${d.show_amounts?'<th>Wholesale</th><th>MRP</th><th>Amount</th><th>Potential</th>':''}</tr></thead><tbody>${productRows}</tbody></table></section>
 <section class="card"><h3>Notes</h3><b style="font-size:9px">Customer note</b><div class="note">${esc(d.customer_note||'No customer note.')}</div><b style="font-size:9px;display:block;margin-top:8px">Internal admin note</b><div class="note admin">${esc(d.internal_note||'No internal note.')}</div><div class="mini-actions"><button id="detail-note">Add / edit internal note</button></div></section>
 </div><aside>
 <section class="card"><h3>Payment record</h3>${payRecord}<div class="mini-actions">${collectOK&&o.status!=='cancelled'&&o.payment_method!=='online'?`<button id="detail-payment" class="pay-btn">${o.payment_record_type?'Edit payment record':'Record payment'}</button>`:''}</div></section>
 <section class="card"><h3>Operations</h3><div class="info"><div><span>Payment method</span><strong>${esc((o.payment_method||'—').toUpperCase())}</strong></div><div><span>Payment status</span><strong>${esc(o.payment_status||'—')}</strong></div><div><span>Tracking</span><strong>${esc(o.tracking||'Not dispatched')}</strong></div><div><span>Updated</span><strong>${esc(date(o.updated_at))}</strong></div></div></section>
 ${d.show_amounts?`<section class="card"><h3>Financial summary</h3><div class="fin"><div class="fr"><span>Subtotal</span><b>${money(d.subtotal_paise)}</b></div><div class="fr"><span>Coupon ${d.coupon_code?esc(d.coupon_code):''}</span><b>− ${money(o.discount_paise||0)}</b></div><div class="fr"><span>Delivery</span><b>${Number(o.shipping_paise||0)?money(o.shipping_paise):'Free'}</b></div><div class="fr total"><span>Total</span><b>${money(o.total_paise)}</b></div><div class="fr"><span>MRP retail value</span><b>${money(o.mrp_total_paise)}</b></div><div class="fr profit"><span>Potential profit</span><b>${money(profit)} (${pct(profit,mrp)})</b></div></div></section>`:''}
 <section class="card"><h3>Print & documents</h3><div class="doc-grid"><button id="doc-summary">Order Summary</button>${d.show_amounts?'<button id="doc-receipt">Customer Receipt</button>':''}<button id="doc-pack">Packing Slip</button><button id="doc-label">Dispatch Label</button></div></section>
 <section class="card"><h3>Activity timeline</h3><div class="events">${eventHtml}</div></section>
 </aside></div>`;
 const ds=$('detail-status');if(ds)ds.onchange=()=>{const n=ds.value;ds.value='';if(n)openStatusAction(o.id,n)};
 if($('detail-note'))$('detail-note').onclick=()=>editNote(o.id);
 if($('detail-payment'))$('detail-payment').onclick=()=>recordPayment(o.id);
 if($('copy-address'))$('copy-address').onclick=async()=>{await navigator.clipboard.writeText(fullAddress(d.address));A.toast('Address copied')};
 if($('doc-summary'))$('doc-summary').onclick=()=>printDoc(d,'summary');if($('doc-receipt'))$('doc-receipt').onclick=()=>printDoc(d,'receipt');if($('doc-pack'))$('doc-pack').onclick=()=>printDoc(d,'packing');if($('doc-label'))$('doc-label').onclick=()=>printDoc(d,'label')
}
function docHtml(d,type){
 const o=d.order||{},c=d.customer||{},items=d.items||[],addr=fullAddress(d.address),rows=items.map(i=>`<tr><td>${esc(i.title||'Product')}</td><td>${Number(i.qty||0)}</td>${type==='packing'?'':d.show_amounts?`<td>${money(i.unit_price_paise)}</td><td>${money(Number(i.qty||0)*Number(i.unit_price_paise||0))}</td>`:''}</tr>`).join('');
 const head=`<div style="font-family:Arial,sans-serif;color:#14251f;max-width:850px;margin:auto"><div style="display:flex;justify-content:space-between;border-bottom:2px solid #17634c;padding-bottom:10px"><div><h1 style="margin:0;color:#17634c">ONeness</h1><small>${type==='packing'?'Packing Slip':type==='label'?'Dispatch Label':type==='receipt'?'Customer Receipt':'Order Summary'}</small></div><div style="text-align:right"><b style="font-size:18px">#ON${o.id}</b><br><small>${date(o.created_at)}</small></div></div>`;
 if(type==='label')return `${head}<div style="border:3px solid #14251f;padding:18px;margin-top:18px"><h2>${esc(c.business_name||c.name||'Retailer')}</h2><p style="font-size:17px;line-height:1.5">${esc(addr)}</p>${d.show_contact&&c.phone?`<p><b>Mobile:</b> ${esc(c.phone)}</p>`:''}${d.show_amounts&&o.payment_method==='cod'?`<h2>COD ${money(o.total_paise)}</h2>`:''}</div></div>`;
 return `${head}<p><b>${esc(c.business_name||c.name||'Retailer')}</b>${d.show_contact&&c.phone?'<br>'+esc(c.phone):''}<br>${esc(addr)}</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #ccc">Product</th><th style="padding:7px;border-bottom:1px solid #ccc">Qty</th>${type==='packing'?'':d.show_amounts?'<th style="padding:7px;border-bottom:1px solid #ccc">Rate</th><th style="padding:7px;border-bottom:1px solid #ccc">Amount</th>':''}</tr></thead><tbody>${rows}</tbody></table>${type==='packing'?'<p style="margin-top:25px">☐ Quantity checked<br><br>☐ Packed securely<br><br>Packed by: __________________</p>':d.show_amounts?`<div style="width:320px;max-width:100%;margin-left:auto;margin-top:15px"><p>Subtotal <b style="float:right">${money(d.subtotal_paise)}</b></p><p>Discount <b style="float:right">− ${money(o.discount_paise||0)}</b></p><p>Delivery <b style="float:right">${Number(o.shipping_paise||0)?money(o.shipping_paise):'Free'}</b></p><hr><h2>Total <span style="float:right">${money(o.total_paise)}</span></h2><p>Payment <b style="float:right">${esc((o.payment_method||'').toUpperCase())} · ${esc(o.payment_status||'')}</b></p>${o.payment_record_type?`<p>Received via <b style="float:right">${esc(payTypeLabel(o.payment_record_type))}${o.payment_reference?' · '+esc(o.payment_reference):''}</b></p>`:''}</div>`:''}<p style="margin-top:25px;font-size:11px;color:#69776f">Order status: ${esc(statusLabel(o.status))}${type==='receipt'?'. This is an order receipt, not a GST tax invoice.':''}</p></div>`
}
function printDoc(d,type){A.print(`Order #ON${d.order.id}`,docHtml(d,type))}
async function printOne(id){try{const d=await detail(id);printDoc(d,'summary')}catch(err){A.error(err)}}
function printFiltered(){

 A.print('Orders',`<h2>ONeness · Filtered Orders</h2><table><thead><tr><th>Order</th><th>Retailer</th><th>Date</th><th>Units</th>${amountOK?'<th>Amount</th>':''}<th>Payment</th><th>Payment Record</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`)

 rows=r.map(o=>[o.id,o.business_name||'',o.customer_name||'',contactOK?o.customer_phone||'':'',date(o.created_at),o.item_count||0,o.unit_count||0,...(amountOK?[Number(o.total_paise||0)/100]:[]),o.payment_method,o.payment_status,o.payment_record_type||'',o.payment_reference||'',o.payment_recorded_at?localDateTime(o.payment_recorded_at):'',o.status,o.delivery_pincode||'',o.tracking||'',o.internal_note||'']);
 A.csv('Orders',headers,rows,'Filtered ONeness orders')
}
