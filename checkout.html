<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b32"><meta name="referrer" content="no-referrer"><title>ONeness · Checkout</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%2317634c%27/%3E%3Ctext x=%2713%27 y=%2748%27 font-size=%2747%27 fill=%27white%27%3EO%3C/text%3E%3C/svg%3E">
<style>body{margin:0;background:#f4f6f2;font-family:system-ui}#boot{padding:30px;color:#426052}</style>
</head><body>
<div id="app"><p id="boot">Opening ONeness…</p></div>
<script>
(async()=>{

const response=await fetch(new URL('index.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep index.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){
 const node=shared.getElementById(id);if(!node)throw Error('index.html is incomplete.');
 document.head.append(node.cloneNode(true));
}
const source=shared.getElementById('oneness-core');if(!source)throw Error('index.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('checkout'),{$,esc,money}=A;if(A.profile.role!=='retailer')throw Error('Use a retailer account to place an order.');
let products=[],addresses=[],quote=null,quotedData='',busy=false;const pendingKey='oneness-pending-'+A.project+'-'+A.profile.id;
$('view').innerHTML=A.header('Review your order','Bulk pricing, your address and one clear COD total.')+`<div id="pending-note"></div><div class="two"><section><div class="card"><h2>1. Your cart</h2><div id="cart"></div></div><div class="card" style="margin-top:20px"><div class="row between"><h2>2. Delivery address</h2><button id="add-address">Add address</button></div><select id="address"></select><p id="address-preview" class="muted"></p><div class="row"><button class="small" id="edit-address">Edit selected</button><a href="settings.html">Manage addresses</a></div></div></section><aside class="card" style="align-self:start"><h2>3. Confirm and pay</h2><label>Coupon code<input id="coupon" placeholder="Optional"></label><label style="margin-top:15px">Order note<textarea id="note" maxlength="1500" placeholder="Delivery instructions"></textarea></label><button id="quote" style="margin:15px 0">Check final price</button><div id="total" class="muted">Check the final price before placing your order.</div><p class="notice">Cash on delivery. Payment is collected after delivery.</p><button class="primary" id="place" disabled>Place COD order</button><p id="checkout-error" role="alert" class="notice error" hidden></p></aside></div>`;
async function load(){products=[];for(const item of A.cart()){try{products.push(await A.api('product.get',{id:item.product_id}));}catch{products.push({id:item.product_id,title:'Product unavailable',unavailable:true,stock:0,min_qty:1,qty_step:1,price_paise:0,bulk_rules:[]});}}addresses=await A.api('addresses.list');const old=$('address').value;$('address').innerHTML='<option value="">Select an address</option>'+addresses.map(a=>`<option value="${a.id}">${esc(a.label)} · ${esc(a.details.line1)}</option>`).join('');if(addresses.some(a=>a.id===+old))$('address').value=old;else if(addresses.length)$('address').value=addresses[0].id;renderCart();preview();showPending();}
function invalidate(){quote=null;quotedData='';$('place').disabled=true;$('total').textContent='Prices need to be checked again.';}
function renderCart(){$('cart').innerHTML=A.table(['Product','Quantity','Estimate',''],A.cart().map(item=>{const p=products.find(x=>x.id===item.product_id);return[`${esc(p.title)}<br><small>${p.unavailable?'Remove this product to continue':money(A.rate(p,item.qty))+' each'}</small>`,`<input aria-label="Quantity" style="width:100px" type="number" min="${p.min_qty}" step="${p.qty_step}" value="${item.qty}" data-qty="${p.id}">`,p.unavailable?'—':money(A.rate(p,item.qty)*item.qty),`<button class="small danger" data-remove="${p.id}">Remove</button>`];}));for(const el of document.querySelectorAll('[data-qty]'))el.onchange=()=>{const p=products.find(x=>x.id===+el.dataset.qty);try{A.addCart(p,+el.value);invalidate();renderCart();}catch(e){A.error(e);renderCart();}};for(const b of document.querySelectorAll('[data-remove]'))b.onclick=()=>{A.setCart(A.cart().filter(i=>i.product_id!==+b.dataset.remove));invalidate();renderCart();};}
function preview(){const a=addresses.find(x=>x.id===+$('address').value);$('address-preview').textContent=a?Object.values(a.details).filter(Boolean).join(', '):'Add or select your delivery address.';}
function payload(){if(!A.cart().length)throw Error('Your cart is empty.');if(!+$('address').value)throw Error('Select a delivery address.');return{items:A.cart().map(x=>({...x})).sort((a,b)=>a.product_id-b.product_id),address_id:+$('address').value,coupon_code:$('coupon').value.trim().toUpperCase(),note:$('note').value.trim()};}
async function price(){try{if(A.profile.status!=='active')throw Error('Your account must be approved before ordering.');$('quote').disabled=true;const data=payload();quote=await A.api('order.quote',data);quotedData=JSON.stringify(data);$('total').innerHTML=A.table(['Description','Amount'],[['Products',money(quote.items.reduce((n,x)=>n+x.qty*x.unit_price_paise,0))],['Coupon discount','− '+money(quote.discount_paise)],['Delivery',money(quote.shipping_paise)],['Total payable',`<b>${money(quote.total_paise)}</b>`]]);$('place').disabled=false;$('checkout-error').hidden=true;}catch(e){$('checkout-error').textContent=A.error(e);$('checkout-error').hidden=false;}finally{$('quote').disabled=false;}}
function showPending(){const pending=A.read(pendingKey,null);$('pending-note').innerHTML=pending?'<div class="notice">A previous order request was not confirmed. Retry that same request before placing another order. <button id="retry-pending">Retry previous request</button> <a href="orders.html">Review orders</a></div>':'';if($('retry-pending'))$('retry-pending').onclick=()=>place(pending);}
async function place(previous){if(busy)return;try{busy=true;$('place').disabled=true;let pending=previous||A.read(pendingKey,null);if(!pending){const data=payload();if(!quote||quotedData!==JSON.stringify(data))throw Error('Check your final price again.');pending={...data,request_id:crypto.randomUUID()};A.write(pendingKey,pending);}else if(!previous)throw Error('Retry the previous unconfirmed request using the button above.');const order=await A.api('order.create',pending);localStorage.removeItem(pendingKey);A.setCart([]);location.href='orders.html?id='+order.id;}catch(e){if(e.code==='DATABASE'&&!/IDEMPOTENCY/i.test(e.message))localStorage.removeItem(pendingKey);$('checkout-error').textContent=A.error(e);$('checkout-error').hidden=false;showPending();}finally{busy=false;$('place').disabled=!quote;}}
$('quote').onclick=price;$('place').onclick=()=>place();$('address').onchange=()=>{preview();invalidate();};for(const id of ['coupon','note'])$(id).oninput=invalidate;$('add-address').onclick=()=>A.addressForm(null,async()=>{invalidate();await load();});$('edit-address').onclick=()=>{const a=addresses.find(x=>x.id===+$('address').value);if(a)A.addressForm(a,async()=>{invalidate();await load();});};await load();

})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
</body></html>
