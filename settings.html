<script>
(async()=>{
const response=await fetch(new URL('index.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep index.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){const node=shared.getElementById(id);if(!node)throw Error('index.html is incomplete.');document.head.append(node.cloneNode(true));}
const source=shared.getElementById('oneness-core');if(!source)throw Error('index.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('settings'),{$,esc,money}=A;let profile=A.profile,settings=A.settings,coupons=[];let tab='home';

const PERMISSION_GROUPS=[
 ['Dashboard',[['dashboard.ops','Operational totals','Orders, fulfilment and stock overview'],['dashboard.finance','Financial totals','Revenue and collection totals']]],
 ['Products',[['products.view','View products','Read catalogue details'],['products.create','Create products','Add new catalogue items'],['products.edit','Edit details','Change names, descriptions and images'],['products.price','Edit prices','Change MRP and selling prices'],['products.stock','Adjust stock','Change inventory quantity'],['products.deactivate','Deactivate products','Hide a product from sale'],['products.import','Import products','Bulk upload catalogue data'],['products.export','Export products','Download catalogue data']]],
 ['Orders',[['orders.view','View orders','Open permitted orders'],['orders.view_amounts','View order amounts','Show unit/wholesale price, line amount, total, discount and delivery charge'],['orders.confirm','Confirm orders','Placed → confirmed'],['orders.pack','Mark packed','Reserved workflow permission'],['orders.dispatch','Mark dispatched','Confirmed/packed → dispatched'],['orders.deliver','Mark delivered','Dispatched → delivered'],['orders.cancel','Cancel orders','Cancel an eligible order'],['orders.print','Print slips','Print packing/dispatch slips']]],
 ['Financial information',[['finance.sell_price','View selling prices','See selling prices inside permitted screens'],['finance.cost','View costs','See purchase/cost values'],['finance.margin','View margins','See profit and margin data']]],
 ['Payments',[['payments.view','View collections','See payment/COD state'],['payments.cod_collect','Mark COD collected','Confirm COD collection'],['payments.export','Export payments','Download collection data'],['delivery.cod_amount','View COD amount','See amount a delivery employee must collect']]],
 ['Customers',[['customers.view','View customers','Open customer list'],['customers.edit','Edit customers','Edit customer information'],['customers.approve','Approve customers','Approve retailer accounts'],['customers.contact','View contact details','Phone/address when operationally required'],['customers.export','Export customers','Download customer data']]],
 ['Analytics',[['analytics.sales','Sales reports','See sales analytics'],['analytics.profit','Profit reports','See profit analytics'],['analytics.export','Export reports','Download analytical reports']]],
 ['Business settings',[['settings.store','Store settings','Store, delivery, minimum order and PIN codes'],['settings.coupons','Coupons','Create and manage coupons'],['settings.notifications','Notifications','Manage notification controls']]],
 ['Record scope',[['scope.orders.all','All orders','Access every permitted order'],['scope.orders.assigned','Assigned orders only','Requires backend order assignment']]]
];
const LEGACY_MAP={
 'dashboard.ops':'orders','dashboard.finance':'finance','products.view':'catalog','products.create':'catalog','products.edit':'catalog','products.price':'catalog','products.stock':'catalog','products.deactivate':'catalog','products.import':'catalog','products.export':'catalog',
 'orders.view':'orders','orders.confirm':'orders','orders.pack':'orders','orders.dispatch':'orders','orders.deliver':'orders','orders.cancel':'orders','orders.print':'orders',
 'finance.sell_price':'finance','finance.cost':'finance','finance.margin':'finance','payments.view':'finance','payments.cod_collect':'finance','payments.export':'finance','delivery.cod_amount':'orders',
 'customers.view':'users','customers.edit':'users','customers.approve':'users','customers.contact':'orders','customers.export':'users','analytics.sales':'finance','analytics.profit':'finance','analytics.export':'finance',
 'settings.store':'settings','settings.coupons':'coupons','settings.notifications':'notifications'
};
const PRESETS={
 'Packing & Dispatch':['orders.view','orders.pack','orders.dispatch','orders.print','customers.contact','scope.orders.all'],
 'Dispatch':['orders.view','orders.dispatch','orders.deliver','orders.print','customers.contact','delivery.cod_amount','scope.orders.all'],
 'Catalogue Manager':['products.view','products.create','products.edit','products.price','products.stock','products.deactivate','products.import','products.export'],
 'Accounts':['dashboard.finance','finance.sell_price','finance.cost','finance.margin','payments.view','payments.cod_collect','payments.export','analytics.sales','analytics.profit','analytics.export'],
 'Manager':['dashboard.ops','dashboard.finance','products.view','products.create','products.edit','products.price','products.stock','products.deactivate','orders.view','orders.view_amounts','orders.confirm','orders.dispatch','orders.deliver','orders.cancel','orders.print','finance.sell_price','payments.view','payments.cod_collect','customers.view','customers.contact','analytics.sales','settings.store','settings.coupons','settings.notifications','scope.orders.all'],
 'Custom':[]
};
const ALL_DETAIL=new Set(PERMISSION_GROUPS.flatMap(g=>g[1].map(x=>x[0])));
function normalizePerms(perms){return [...new Set((perms||[]).filter(Boolean))];}
function detailPerms(perms){return normalizePerms(perms).filter(p=>ALL_DETAIL.has(p));}
function buildStoredPermissions(detail){const out=new Set(detail);for(const p of detail){if(LEGACY_MAP[p])out.add(LEGACY_MAP[p]);}return [...out];}
function accessSummary(member){const d=detailPerms(member.permissions);if(member.role==='owner')return 'Full owner access';if(!d.length)return 'No business permissions';const preset=Object.entries(PRESETS).find(([name,arr])=>name!=='Custom'&&arr.length===d.length&&arr.every(x=>d.includes(x)));return preset?preset[0]:`${d.length} custom permissions`;}
function statusChip(status){return `<span class="chip ${status==='blocked'?'bad':status==='unverified'?'warn':''}">${esc(status)}</span>`;}

const SETTING_META={
 profile:{icon:'P',color:'#17634c',desc:'Your account, business name, phone and security.'},
 addresses:{icon:'A',color:'#4f6793',desc:'Saved delivery and business addresses.'},
 team:{icon:'T',color:'#7b5b96',desc:'Staff approvals, roles, permissions and sessions.'},
 store:{icon:'S',color:'#8a641e',desc:'Store name, delivery, minimum order and service PINs.'},
 payments:{icon:'₹',color:'#2c7a58',desc:'COD / online availability and retailer eligibility.'},
 coupons:{icon:'%',color:'#a24f3d',desc:'Discount codes, eligibility, dates and usage.'},
 notifications:{icon:'N',color:'#477b87',desc:'Push notification registration and device control.'},
 jobs:{icon:'J',color:'#675d51',desc:'Pending or failed backend synchronization jobs.'}
};

const tabs=[['profile','My profile'],['addresses','Addresses'],...(profile.role==='owner'?[['team','Team & Access']]:[]),...(A.can('settings')?[['store','Store'],['payments','Payments']]:[]),...(A.can('coupons')?[['coupons','Coupons']]:[]),['notifications','Notifications'],...(profile.role==='owner'?[['jobs','Sync jobs']]:[])];
$('view').innerHTML=`
<div class="settings-hero">
 <div><h1>Settings</h1><p>Control your account, store operations, team access, payments and communication from one place.</p></div>
 <div class="settings-hero-badge">${esc(profile.role)} · ${esc(profile.status)}</div>
</div>
<div id="settings-grid" class="settings-grid">
 ${tabs.map(([id,name])=>{const m=SETTING_META[id]||{icon:name[0],color:'#17634c',desc:''};return `<button class="setting-tile" data-tab="${id}" style="--tile:${m.color}"><span class="tile-icon">${esc(m.icon)}</span><span class="tile-copy"><b>${esc(name)}</b><span>${esc(m.desc)}</span></span><span class="tile-arrow">↗</span></button>`}).join('')}
</div>
<section id="settings-panel" class="settings-panel" hidden>
 <div class="settings-panel-head">
  <div class="settings-panel-title"><button id="settings-back">← All settings</button><div><b id="panel-title">Settings</b><span id="panel-subtitle">Manage this setting</span></div></div>
  <button id="panel-close" class="panel-close">Close</button>
 </div>
 <section id="settings-body" class="card"></section>
</section>
<input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
`;

async function show(next=tab){
 tab=next;
 for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);
 const panel=$('settings-panel'),el=$('settings-body');
 if(tab==='home'){panel.hidden=true;return;}
 const item=tabs.find(x=>x[0]===tab),m=SETTING_META[tab]||{};
 $('panel-title').textContent=item?.[1]||'Settings';$('panel-subtitle').textContent=m.desc||'Manage this setting';
 panel.hidden=false;panel.classList.remove('panel-in');void panel.offsetWidth;panel.classList.add('panel-in');
 el.innerHTML='<p>Loading…</p>';
 if(tab==='profile'){profile=await A.api('session.me');el.innerHTML=`<div class="settings-section-head"><div><h2>${esc(profile.business_name||profile.name)}</h2><p>Personal identity and account security.</p></div>${A.badge(profile.status)}</div><div class="smart-cards"><div class="smart-card"><span>Email</span><strong>${esc(profile.email||'—')}</strong><small>Login identity</small></div><div class="smart-card"><span>Phone</span><strong>${esc(profile.phone||'Not set')}</strong><small>Contact number</small></div><div class="smart-card"><span>Role</span><strong>${esc(profile.role)}</strong><small>Current access role</small></div><div class="smart-card"><span>Device</span><strong>${esc(profile.platform||'web')}</strong><small>Current platform</small></div></div><div class="row"><button id="edit-profile" class="primary">Edit profile</button><button id="reset-password">Email password reset</button></div>`;$('edit-profile').onclick=()=>A.form('Edit profile',[['name','Name','text',[],true],['business_name','Business name'],['phone','Phone','tel']],profile,async v=>{await A.api('profile.update',{...v,expected_version:profile.version});await show();});$('reset-password').onclick=async()=>{const{error}=await A.client.auth.resetPasswordForEmail(profile.email,{redirectTo:new URL('index.html?mode=reset',location.href).href});if(error)A.error(error);else A.toast('Check your email for a password-reset link.');};}
 if(tab==='addresses'){const rows=await A.api('addresses.list');el.innerHTML='<div class="row between"><h2>Saved addresses</h2><button class="primary" id="new-address">Add address</button></div>'+A.table(['Label','Address',''],rows.map(a=>[esc(a.label),Object.values(a.details).filter(Boolean).map(esc).join(', '),`<button class="small" data-edit="${a.id}">Edit</button> <button class="small danger" data-delete="${a.id}">Delete</button>`]));$('new-address').onclick=()=>A.addressForm(null,()=>show());for(const b of el.querySelectorAll('[data-edit]'))b.onclick=()=>A.addressForm(rows.find(x=>x.id===+b.dataset.edit),()=>show());for(const b of el.querySelectorAll('[data-delete]'))b.onclick=async()=>{if(!confirm('Delete this saved address? Existing orders keep their saved address.'))return;const a=rows.find(x=>x.id===+b.dataset.delete);try{await A.api('address.delete',{id:a.id,expected_version:a.version});await show();}catch(e){A.error(e);}};}

function paymentCard(m,retailers){const locked=!m.integration_ready,mode=m.audience_mode||'specific',selected=new Set((m.retailer_ids||[]).map(Number)),active=retailers.filter(r=>r.status!=='blocked');const eligible=mode==='all'?active.length:mode==='specific'?active.filter(r=>selected.has(+r.id)).length:active.filter(r=>!selected.has(+r.id)).length;return `<section class="payment-card" data-payment-card="${esc(m.method)}"><div class="payment-head"><div><div class="payment-title">${esc(m.label)}</div><div class="payment-sub">${m.method==='cod'?'Collect payment when the retailer receives the order.':'UPI, cards and net banking require a connected payment gateway.'}</div></div><span class="payment-state ${locked?'warn':m.enabled?'':'off'}">${locked?'Gateway not connected':m.enabled?'Enabled':'Disabled'}</span></div>${locked?'<div class="payment-lock">You can prepare the audience now, but this method cannot be enabled until its payment gateway integration is connected.</div>':''}<div class="payment-controls"><div class="payment-side"><label class="payment-toggle"><input type="checkbox" data-pay-enabled="${esc(m.method)}" ${m.enabled?'checked':''} ${locked?'disabled':''}><span><b>Enable this method</b><br><small class="muted">Show this payment option to eligible retailers.</small></span></label><label>Who can use it?<select data-pay-mode="${esc(m.method)}"><option value="all" ${mode==='all'?'selected':''}>All retailers</option><option value="specific" ${mode==='specific'?'selected':''}>Only selected retailers</option><option value="all_except" ${mode==='all_except'?'selected':''}>All except selected retailers</option></select></label><p class="audience-help" data-pay-help="${esc(m.method)}"></p><div class="payment-summary" data-pay-summary="${esc(m.method)}">${eligible} currently eligible retailer${eligible===1?'':'s'}.</div></div><div class="retailer-picker" data-picker="${esc(m.method)}"><div class="retailer-search"><input data-pay-search="${esc(m.method)}" placeholder="Search retailer, shop, email or mobile"><div class="retailer-count" data-pay-count="${esc(m.method)}">${selected.size} selected</div></div><div class="retailer-list" data-pay-list="${esc(m.method)}"></div></div></div><div class="payment-actions"><button class="primary" data-pay-save="${esc(m.method)}">Save payment settings</button></div></section>`;}
function wirePaymentCard(m,retailers){const key=m.method,card=document.querySelector(`[data-payment-card="${CSS.escape(key)}"]`),modeEl=card.querySelector(`[data-pay-mode="${CSS.escape(key)}"]`),searchEl=card.querySelector(`[data-pay-search="${CSS.escape(key)}"]`),listEl=card.querySelector(`[data-pay-list="${CSS.escape(key)}"]`),picker=card.querySelector(`[data-picker="${CSS.escape(key)}"]`),countEl=card.querySelector(`[data-pay-count="${CSS.escape(key)}"]`),helpEl=card.querySelector(`[data-pay-help="${CSS.escape(key)}"]`),summaryEl=card.querySelector(`[data-pay-summary="${CSS.escape(key)}"]`),enabledEl=card.querySelector(`[data-pay-enabled="${CSS.escape(key)}"]`),saveEl=card.querySelector(`[data-pay-save="${CSS.escape(key)}"]`);let selected=new Set((m.retailer_ids||[]).map(Number));const effectiveCount=()=>{const active=retailers.filter(r=>r.status!=='blocked');return modeEl.value==='all'?active.length:modeEl.value==='specific'?active.filter(r=>selected.has(+r.id)).length:active.filter(r=>!selected.has(+r.id)).length};const draw=()=>{const mode=modeEl.value;picker.style.display=mode==='all'?'none':'block';helpEl.textContent=mode==='all'?'Every active retailer can use this payment method.':mode==='specific'?'Only the retailers ticked on the right can use this payment method.':'Every active retailer can use this method except the retailers ticked on the right.';const q=(searchEl.value||'').trim().toLowerCase(),rows=retailers.filter(r=>!q||`${r.id} ${r.name||''} ${r.business_name||''} ${r.email||''} ${r.phone||''}`.toLowerCase().includes(q));listEl.innerHTML=rows.length?rows.map(r=>`<label class="retailer-row"><input type="checkbox" data-retailer-id="${r.id}" ${selected.has(+r.id)?'checked':''}><span><b>${esc(r.business_name||r.name||'Retailer #'+r.id)}</b><small>#${r.id} · ${esc(r.name||'')} · ${esc(r.email||'')}${r.phone?' · '+esc(r.phone):''}</small></span><span class="retailer-status">${esc(r.status)}</span></label>`).join(''):'<div class="team-empty">No retailers   if(error||data?.ok!==true)throw Error(data?.error?.message||error?.message||'Profile photo upload failed.');
  profile.avatar_url=data.data.url;A.profile.avatar_url=data.data.url;btn.innerHTML=`<img src="${esc(data.data.url)}" alt="">`;A.toast('Profile photo updated');
 }catch(e){A.error(e)}finally{btn.classList.remove('avatar-uploading');$('avatar-file').value=''}
}
