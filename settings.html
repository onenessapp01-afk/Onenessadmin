<script>
(async()=>{
const response=await fetch(new URL('index.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep index.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){const node=shared.getElementById(id);if(!node)throw Error('index.html is incomplete.');document.head.append(node.cloneNode(true));}
const source=shared.getElementById('oneness-core');if(!source)throw Error('index.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('settings'),{$,esc,money}=A;let profile=A.profile,settings=A.settings,coupons=[];let tab='profile';

const PERMISSION_GROUPS=[
 ['Dashboard',[['dashboard.ops','Operational totals','Orders, fulfilment and stock overview'],['dashboard.finance','Financial totals','Revenue and collection totals']]],
 ['Products',[['products.view','View products','Read catalogue details'],['products.create','Create products','Add new catalogue items'],['products.edit','Edit details','Change names, descriptions and images'],['products.price','Edit prices','Change MRP and selling prices'],['products.stock','Adjust stock','Change inventory quantity'],['products.deactivate','Deactivate products','Hide a product from sale'],['products.import','Import products','Bulk upload catalogue data'],['products.export','Export products','Download catalogue data']]],
 ['Orders',[['orders.view','View orders','Open permitted orders'],['orders.view_amounts','View order amounts','Show unit/wholesale price, line amount, total, discount and delivery charge'],['orders.confirm','Confirm orders','Placed → confirmed'],['orders.pack','Mark packed','Reserved workflow permission'],['orders.dispatch','Mark dispatched','Confirmed/packed → dispatched'],['orders.deliver','Mark delivered','Dispatched → delivered'],['orders.cancel','Cancel orders','Cancel an eligible order'],['orders.print','Print slips','Print packing/dispatch slips']]],
 ['Financial information',[['finance.sell_price','View selling prices','See selling prices inside permitted screens'],['finance.cost','View costs','See purchase/cost values'],['finance.margin','View margins','See profit and margin data']]],
 ['Payments',[['payments.view','View collections','See payment/COD state'],['payments.cod_collect','Mark COD collected','Confirm COD collection'],['payments.export','Export payments','Download collection data'],['delivery.cod_amount','View COD amount','See amount a delivery employee must collect']]],
 ['Customers',[['customers.view','View customers','Open customer list'],['customers.edit','Edit customers','Edit customer information'],['customers.approve','Approve customers','Approve retailer accounts'],['customers.contact','View contact details','Phone/address when operationally required'],['customers.export','Export customers','Download customer data']]],
 ['Analytics',[['analytics.sales','Sales reports','See sales analytics'],['analytics.profit','Profit reports','See profit analytics'],['analytics.export','Export reports','Download analytical reports']]],

 ['Record scope',[['scope.orders.all','All orders','Access every permitted order'],['scope.orders.assigned','Assigned orders only','Requires backend order assignment']]]
];
const LEGACY_MAP={
 'dashboard.ops':'orders','dashboard.finance':'finance','products.view':'catalog','products.create':'catalog','products.edit':'catalog','products.price':'catalog','products.stock':'catalog','products.deactivate':'catalog','products.import':'catalog','products.export':'catalog',
 'orders.view':'orders','orders.confirm':'orders','orders.pack':'orders','orders.dispatch':'orders','orders.deliver':'orders','orders.cancel':'orders','orders.print':'orders',
 'finance.sell_price':'finance','finance.cost':'finance','finance.margin':'finance','payments.view':'finance','payments.cod_collect':'finance','payments.export':'finance','delivery.cod_amount':'orders',
 'customers.view':'users','customers.edit':'users','customers.approve':'users','customers.contact':'orders','customers.export':'users','analytics.sales':'finance','analytics.profit':'finance','analytics.export':'finance',
 'settings.store':'settings','settings.coupons':'coupons','settings.notifications':'notifications'
};
const PRESETS={
 'Packing & Dispatch':['orders.view','orders.pack','orders.dispatch','orders.print','customers.contact','scope.orders.all'],
 'Dispatch':['orders.view','orders.dispatch','orders.deliver','orders.print','customers.contact','delivery.cod_amount','scope.orders.all'],
 'Catalogue Manager':['products.view','products.create','products.edit','products.price','products.stock','products.deactivate','products.import','products.export'],
 'Accounts':['dashboard.finance','finance.sell_price','finance.cost','finance.margin','payments.view','payments.cod_collect','payments.export','analytics.sales','analytics.profit','analytics.export'],
 'Manager':['dashboard.ops','dashboard.finance','products.view','products.create','products.edit','products.price','products.stock','products.deactivate','orders.view','orders.view_amounts','orders.confirm','orders.dispatch','orders.deliver','orders.cancel','orders.print','finance.sell_price','payments.view','payments.cod_collect','customers.view','customers.contact','analytics.sales','settings.store','settings.coupons','settings.notifications','scope.orders.all'],
 'Custom':[]
};
const ALL_DETAIL=new Set(PERMISSION_GROUPS.flatMap(g=>g[1].map(x=>x[0])));
function normalizePerms(perms){return [...new Set((perms||[]).filter(Boolean))];}
function detailPerms(perms){return normalizePerms(perms).filter(p=>ALL_DETAIL.has(p));}
function buildStoredPermissions(detail){const out=new Set(detail);for(const p of detail){if(LEGACY_MAP[p])out.add(LEGACY_MAP[p]);}return [...out];}
function accessSummary(member){const d=detailPerms(member.permissions);if(member.role==='owner')return 'Full owner access';if(!d.length)return 'No business permissions';const preset=Object.entries(PRESETS).find(([name,arr])=>name!=='Custom'&&arr.length===d.length&&arr.every(x=>d.includes(x)));return preset?preset[0]:`${d.length} custom permissions`;}
function statusChip(status){return `<span class="chip ${status==='blocked'?'bad':status==='unverified'?'warn':''}">${esc(status)}</span>`;}

const tabs=[['profile','My profile'],['addresses','Addresses'],...(profile.role==='owner'?[['team','Team & Access']]:[]),...(A.can('settings')?[['store','Store'],['payments','Payments']]:[]),...(A.can('coupons')?[['coupons','Coupons']]:[]),['notifications','Notifications'],...(A.can('notifications')?[['email','Email tools']]:[]),...(profile.role==='owner'?[['jobs','Sync jobs']]:[])];
$('view').innerHTML=A.header('Account & store settings','Manage your preferences and the controls available to your role.')+`<nav class="tabs">${tabs.map(([id,name])=>`<button data-tab="${id}">${name}</button>`).join('')}</nav><section id="settings-body" class="card"></section>`;

async function show(next=tab){
 tab=next;for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);const el=$('settings-body');el.innerHTML='<p>Loading…</p>';
 if(tab==='profile'){profile=await A.api('session.me');el.innerHTML=`<h2>${esc(profile.business_name||profile.name)}</h2><p>${esc(profile.email)} · ${A.badge(profile.status)}</p><p>Phone: ${esc(profile.phone||'Not set')}</p><div class="row"><button id="edit-profile">Edit profile</button><button id="reset-password">Email password reset</button></div>`;$('edit-profile').onclick=()=>A.form('Edit profile',[['name','Name','text',[],true],['business_name','Business name'],['phone','Phone','tel']],profile,async v=>{await A.api('profile.update',{...v,expected_version:profile.version});await show();});$('reset-password').onclick=async()=>{const{error}=await A.client.auth.resetPasswordForEmail(profile.email,{redirectTo:new URL('index.html?mode=reset',location.href).href});if(error)A.error(error);else A.toast('Check your email for a password-reset link.');};}
 if(tab==='addresses'){const rows=await A.api('addresses.list');el.innerHTML='<div class="row between"><h2>Saved addresses</h2><button class="primary" id="new-address">Add address</button></div>'+A.table(['Label','Address',''],rows.map(a=>[esc(a.label),Object.values(a.details).filter(Boolean).map(esc).join(', '),`<button class="small" data-edit="${a.id}">Edit</button> <button class="small danger" data-delete="${a.id}">Delete</button>`]));$('new-address').onclick=()=>A.addressForm(null,()=>show());for(const b of el.querySelectorAll('[data-edit]'))b.onclick=()=>A.addressForm(rows.find(x=>x.id===+b.dataset.edit),()=>show());for(const b of el.querySelectorAll('[data-delete]'))b.onclick=async()=>{if(!confirm('Delete this saved address? Existing orders keep their saved address.'))return;const a=rows.find(x=>x.id===+b.dataset.delete);try{await A.api('address.delete',{id:a.id,expected_version:a.version});await show();}catch(e){A.error(e);}};}
 if(tab==='team')await renderTeam(el);
 if(tab==='payments')await renderPayments(el);
 if(tab==='store'){settings=await A.api('settings.get');const cod=(settings.payment_methods||[]).find(x=>x.method==='cod');el.innerHTML=`<h2>${esc(settings.store_name)}</h2><p>Delivery: ${money(settings.delivery_paise)} · Minimum order: ${money(settings.minimum_order_paise)}</p><p>Cash on Delivery: ${cod?.enabled?'enabled':'disabled'} · Email ${settings.email_enabled?'enabled':'disabled'} · Push ${settings.push_enabled?'enabled':'disabled'}</p><p>Serviceable PIN codes: ${esc(settings.allowed_pincodes.join(', ')||'All PIN codes')}</p><div class="row"><button id="edit-store" class="primary">Edit store settings</button><button id="open-payments">Manage payment methods</button></div><div class="integration-grid"><div class="integration-item"><b>Apps Script bridge</b><span class="muted">Configured server-side</span></div><div class="integration-item"><b>Push / email secrets</b><span class="muted">Hidden from the browser</span></div></div><p class="muted" style="margin-top:20px">Payment eligibility is managed in the Payments tab. Secret integration values remain backend-only.</p>`;$('open-payments').onclick=()=>show('payments').catch(A.error);$('edit-store').onclick=()=>A.form('Store settings',[['store_name','Store name','text',[],true],['delivery','Delivery charge (₹)','number',[],true],['minimum','Minimum order (₹)','number',[],true],['pincodes','Serviceable PIN codes, comma separated; blank = all','textarea'],['email_enabled','Enable order emails','checkbox'],['push_enabled','Enable push notifications','checkbox']],{...settings,delivery:settings.delivery_paise/100,minimum:settings.minimum_order_paise/100,pincodes:settings.allowed_pincodes.join(', ')},async v=>{const pins=v.pincodes.split(',').map(x=>x.trim()).filter(Boolean);if(pins.some(x=>!/^[0-9]{6}$/.test(x)))throw Error('Use valid six-digit PIN codes.');await A.api('admin.settings.put',{expected_version:settings.version,store_name:v.store_name,delivery_paise:A.paise(v.delivery),minimum_order_paise:A.paise(v.minimum),allowed_pincodes:pins,email_enabled:v.email_enabled,push_enabled:v.push_enabled});await show();});}
 if(tab==='coupons'){coupons=await A.all('admin.coupons');el.innerHTML='<div class="row between"><h2>Coupons</h2><button class="primary" id="new-coupon">Create coupon</button></div>'+A.table(['Code','Discount','Eligibility','Status',''],coupons.map(c=>[esc(c.code),c.kind==='percent'?(c.value/100)+'%':money(c.value),c.eligible_users?'Users '+esc(c.eligible_users.join(', ')):'All approved users',A.badge(c.active?'active':'inactive'),`<button class="small" data-edit-coupon="${c.id}">Edit</button> <button class="small" data-usage="${c.id}">Usage</button>`]));$('new-coupon').onclick=()=>editCoupon();for(const b of el.querySelectorAll('[data-edit-coupon]'))b.onclick=()=>editCoupon(coupons.find(c=>c.id===+b.dataset.editCoupon));for(const b of el.querySelectorAll('[data-usage]'))b.onclick=()=>usage(+b.dataset.usage).catch(A.error);}
 if(tab==='notifications'){profile=await A.api('session.me');el.innerHTML=`<h2>Device notifications</h2><p>${profile.push_enabled?'This account has a registered push subscription.':'Notifications are not registered for this account.'}</p><div class="row"><button class="primary" id="enable-push">Enable on this device</button><button id="disable-push">Disable for my account</button></div><p class="muted" style="margin-top:16px">Your most recent app login is the active device.</p>`;$('enable-push').onclick=async()=>{try{await A.notifications();await show();}catch(e){A.error(e);}};$('disable-push').onclick=async()=>{try{await A.api('push.unregister');await show();}catch(e){A.error(e);}};}
 if(tab==='email'){el.innerHTML='<h2>Email tools</h2><p class="muted">Order emails are queued automatically. Manage reusable templates or review a specific queued email here.</p><div class="row"><button id="template">Open / create template</button><button id="compose">Queue an email</button><button id="review">Review email by ID</button></div>';$('template').onclick=()=>template().catch(A.error);$('compose').onclick=compose;$('review').onclick=()=>review().catch(A.error);}
 if(tab==='jobs'){const jobs=await A.all('admin.jobs');el.innerHTML='<div class="row between"><h2>Pending and failed sync jobs</h2><button id="refresh-jobs">Refresh</button></div>'+A.table(['Job','Type','Order','State','Attempts','Last error',''],jobs.map(j=>[j.id,esc(j.kind),j.order_id||'—',A.badge(j.state),j.attempts,esc(j.last_error||''),j.state==='failed'?`<button class="small" data-retry="${j.id}">Retry</button>`:'']));$('refresh-jobs').onclick=()=>show().catch(A.error);for(const b of el.querySelectorAll('[data-retry]'))b.onclick=async()=>{b.disabled=true;try{await A.api('admin.job.retry',{id:+b.dataset.retry});await show();}catch(e){A.error(e);b.disabled=false;}};}
}


async function renderPayments(el){
 settings=await A.api('settings.get');const methods=settings.payment_methods||[],retailers=settings.payment_retailers||[];
 if(!methods.length){el.innerHTML='<h2>Payment methods</h2><p class="muted">No payment methods are configured yet.</p>';return;}
 el.innerHTML=`<div class="row between"><div><h2 style="margin-bottom:4px">Payment methods</h2><p class="muted" style="margin-top:0">Choose which payment methods are active and exactly which retailers can use them.</p></div></div><div class="payment-grid">${methods.map(m=>paymentCard(m,retailers)).join('')}</div><p class="muted" style="margin-top:16px">Customer-level COD changes made from the Customers page are synchronized with these audience rules automatically.</p>`;
 for(const m of methods)wirePaymentCard(m,retailers);
}
function paymentCard(m,retailers){const locked=!m.integration_ready,mode=m.audience_mode||'specific',selected=new Set((m.retailer_ids||[]).map(Number)),active=retailers.filter(r=>r.status!=='blocked');const eligible=mode==='all'?active.length:mode==='specific'?active.filter(r=>selected.has(+r.id)).length:active.filter(r=>!selected.has(+r.id)).length;return `<section class="payment-card" data-payment-card="${esc(m.method)}"><div class="payment-head"><div><div class="payment-title">${esc(m.label)}</div><div class="payment-sub">${m.method==='cod'?'Collect payment when the retailer receives the order.':'UPI, cards and net banking require a connected payment gateway.'}</div></div><span class="payment-state ${locked?'warn':m.enabled?'':'off'}">${locked?'Gateway not connected':m.enabled?'Enabled':'Disabled'}</span></div>${locked?'<div class="payment-lock">You can prepare the audience now, but this method cannot be enabled until its payment gateway integration is connected.</div>':''}<div class="payment-controls"><div class="payment-side"><label class="payment-toggle"><input type="checkbox" data-pay-enabled="${esc(m.method)}" ${m.enabled?'checked':''} ${locked?'disabled':''}><span><b>Enable this method</b><br><small class="muted">Show this payment option to eligible retailers.</small></span></label><label>Who can use it?<select data-pay-mode="${esc(m.method)}"><option value="all" ${mode==='all'?'selected':''}>All retailers</option><option value="specific" ${mode==='specific'?'selected':''}>Only selected retailers</option><option value="all_except" ${mode==='all_except'?'selected':''}>All except selected retailers</option></select></label><p class="audience-help" data-pay-help="${esc(m.method)}"></p><div class="payment-summary" data-pay-summary="${esc(m.method)}">${eligible} currently eligible retailer${eligible===1?'':'s'}.</div></div><div class="retailer-picker" data-picker="${esc(m.method)}"><div class="retailer-search"><input data-pay-search="${esc(m.method)}" placeholder="Search retailer, shop, email or mobile"><div class="retailer-count" data-pay-count="${esc(m.method)}">${selected.size} selected</div></div><div class="retailer-list" data-pay-list="${esc(m.method)}"></div></div></div><div class="payment-actions"><button class="primary" data-pay-save="${esc(m.method)}">Save payment settings</button></div></section>`;}
function wirePaymentCard(m,retailers){const key=m.method,card=document.querySelector(`[data-payment-card="${CSS.escape(key)}"]`),modeEl=card.querySelector(`[data-pay-mode="${CSS.escape(key)}"]`),searchEl=card.querySelector(`[data-pay-search="${CSS.escape(key)}"]`),listEl=card.querySelector(`[data-pay-list="${CSS.escape(key)}"]`),picker=card.querySelector(`[data-picker="${CSS.escape(key)}"]`),countEl=card.querySelector(`[data-pay-count="${CSS.escape(key)}"]`),helpEl=card.querySelector(`[data-pay-help="${CSS.escape(key)}"]`),summaryEl=card.querySelector(`[data-pay-summary="${CSS.escape(key)}"]`),enabledEl=card.querySelector(`[data-pay-enabled="${CSS.escape(key)}"]`),saveEl=card.querySelector(`[data-pay-save="${CSS.escape(key)}"]`);let selected=new Set((m.retailer_ids||[]).map(Number));const effectiveCount=()=>{const active=retailers.filter(r=>r.status!=='blocked');return modeEl.value==='all'?active.length:modeEl.value==='specific'?active.filter(r=>selected.has(+r.id)).length:active.filter(r=>!selected.has(+r.id)).length};const draw=()=>{const mode=modeEl.value;picker.style.display=mode==='all'?'none':'block';helpEl.textContent=mode==='all'?'Every active retailer can use this payment method.':mode==='specific'?'Only the retailers ticked on the right can use this payment method.':'Every active retailer can use this method except the retailers ticked on the right.';const q=(searchEl.value||'').trim().toLowerCase(),rows=retailers.filter(r=>!q||`${r.id} ${r.name||''} ${r.business_name||''} ${r.email||''} ${r.phone||''}`.toLowerCase().includes(q));listEl.innerHTML=rows.length?rows.map(r=>`<label class="retailer-row"><input type="checkbox" data-retailer-id="${r.id}" ${selected.has(+r.id)?'checked':''}><span><b>${esc(r.business_name||r.name||'Retailer #'+r.id)}</b><small>#${r.id} · ${esc(r.name||'')} · ${esc(r.email||'')}${r.phone?' · '+esc(r.phone):''}</small></span><span class="retailer-status">${esc(r.status)}</span></label>`).join(''):'<div class="team-empty">No retailers match this search.</div>';for(const c of listEl.querySelectorAll('[data-retailer-id]'))c.onchange=()=>{const id=+c.dataset.retailerId;c.checked?selected.add(id):selected.delete(id);countEl.textContent=selected.size+' selected';const n=effectiveCount();summaryEl.textContent=n+` currently eligible retailer${n===1?'':'s'}.`};countEl.textContent=selected.size+' selected';const n=effectiveCount();summaryEl.textContent=n+` currently eligible retailer${n===1?'':'s'}.`};modeEl.onchange=draw;searchEl.oninput=draw;draw();saveEl.onclick=async()=>{try{saveEl.disabled=true;const mode=modeEl.value;if(mode==='specific'&&!selected.size&&!confirm('No retailer is selected. This will make this payment method unavailable to every retailer. Continue?')){saveEl.disabled=false;return;}await A.api('admin.settings.put',{expected_version:settings.version,payment_method:key,payment_enabled:enabledEl.checked,payment_audience_mode:mode,payment_retailer_ids:[...selected],payment_expected_version:m.version});A.toast('Payment settings saved');await show('payments');}catch(e){A.error(e);saveEl.disabled=false;}};}

async function renderTeam(el){
 if(profile.role!=='owner')throw Error('Owner access required');
 const all=await A.all('admin.users',{limit:100});const staff=all.filter(x=>x.role==='owner'||x.role==='admin');
 const counts={verified:staff.filter(x=>x.status==='verified').length,unverified:staff.filter(x=>x.status==='unverified').length,blocked:staff.filter(x=>x.status==='blocked').length};
 el.innerHTML=`<div class="row between"><div><h2 style="margin-bottom:4px">Team & Access</h2><p class="muted" style="margin-top:0">Approve staff, assign least-privilege access and revoke active app sessions.</p></div></div>
 <div class="team-stats"><div class="team-stat"><strong>${staff.length}</strong><span>Total staff</span></div><div class="team-stat"><strong>${counts.unverified}</strong><span>Awaiting approval</span></div><div class="team-stat"><strong>${counts.blocked}</strong><span>Blocked</span></div></div>
 <div class="team-toolbar"><input id="team-search" placeholder="Search name, email or phone"><select id="team-filter"><option value="all">All statuses</option><option value="verified">Verified</option><option value="unverified">Unverified</option><option value="blocked">Blocked</option></select></div><div id="team-list" class="team-list"></div>
 <p class="muted" style="margin-top:16px">Owners cannot be created from this page. Creating another owner remains a deliberate backend operation.</p>`;
 const draw=()=>{const q=$('team-search').value.trim().toLowerCase(),f=$('team-filter').value;const rows=staff.filter(m=>(f==='all'||m.status===f)&&(!q||`${m.name} ${m.email} ${m.phone||''}`.toLowerCase().includes(q)));$('team-list').innerHTML=rows.length?rows.map(m=>`<div class="team-card"><div class="team-card-head"><div><div class="team-name">${esc(m.name||'Unnamed staff')}</div><div class="team-meta">${esc(m.email)}${m.phone?' · '+esc(m.phone):''}</div><div class="chips">${statusChip(m.status)}<span class="chip">${esc(m.role)}</span><span class="chip">${esc(accessSummary(m))}</span>${m.platform?`<span class="chip">${esc(m.platform)}</span>`:''}</div></div><button class="${m.role==='owner'?'':'primary'}" data-team-edit="${m.id}">${m.role==='owner'?'View owner':'Manage access'}</button></div></div>`).join(''):'<div class="team-empty">No staff match this filter.</div>';for(const b of document.querySelectorAll('[data-team-edit]'))b.onclick=()=>openTeamEditor(staff.find(x=>x.id===+b.dataset.teamEdit));};
 $('team-search').oninput=draw;$('team-filter').onchange=draw;draw();
}

function openTeamEditor(member){
 const readonly=member.role==='owner';let selected=new Set(detailPerms(member.permissions));
 const permissionHtml=PERMISSION_GROUPS.map(([group,items])=>`<div class="perm-group"><h4>${esc(group)}</h4>${items.map(([key,label,desc])=>`<label class="perm-item"><input type="checkbox" data-perm="${key}" ${selected.has(key)?'checked':''} ${readonly?'disabled':''}><span>${esc(label)}<small>${esc(desc)}</small></span></label>`).join('')}</div>`).join('');
 A.modal(readonly?'Owner account':'Manage staff access',`<div class="access-panel"><h3 style="margin-top:0">${esc(member.name||'Unnamed staff')}</h3><p>${esc(member.email)} · ${statusChip(member.status)}</p>${readonly?'<div class="danger-note">Owner permissions are not editable here. Create, demote or replace owners only through a deliberate backend operation.</div>':`<label>Status<select id="staff-status"><option value="unverified">Unverified</option><option value="verified">Verified</option><option value="blocked">Blocked</option></select></label><div class="preset-row">${Object.keys(PRESETS).map(p=>`<button type="button" data-preset="${esc(p)}">${esc(p)}</button>`).join('')}</div><div class="access-grid">${permissionHtml}</div><label style="margin-top:14px">Reason for this access change<textarea id="staff-reason" rows="3" placeholder="Required for audit history"></textarea></label><div class="preview-box" id="access-preview"></div><div class="row" style="margin-top:14px"><button class="primary" id="save-staff">Save access</button><button id="revoke-staff">Revoke app session</button></div>`}<div style="margin-top:20px"><h4>Activity history</h4><div id="staff-history" class="history-list"><p class="muted">Loading history…</p></div></div></div>`);
 if(readonly){loadStaffHistory(member.id);return;}
 $('staff-status').value=member.status;
 function refreshPreview(){selected=new Set([...document.querySelectorAll('[data-perm]:checked')].map(x=>x.dataset.perm));const pages=[];if([...selected].some(x=>x.startsWith('orders.')))pages.push('Orders');if([...selected].some(x=>x.startsWith('products.')))pages.push('Products');if([...selected].some(x=>x.startsWith('analytics.')))pages.push('Analytics');if([...selected].some(x=>x.startsWith('settings.')))pages.push('Settings controls');$('access-preview').innerHTML=`<strong>Access preview</strong><div>${pages.length?pages.map(esc).join(' · '):'No business pages'}</div><small class="muted">Simulation only. It does not impersonate this employee.</small>`;}
 for(const b of document.querySelectorAll('[data-preset]'))b.onclick=()=>{const name=b.dataset.preset;if(name!=='Custom'){selected=new Set(PRESETS[name]);for(const c of document.querySelectorAll('[data-perm]'))c.checked=selected.has(c.dataset.perm);}for(const x of document.querySelectorAll('[data-preset]'))x.classList.toggle('active',x===b);refreshPreview();};
 for(const c of document.querySelectorAll('[data-perm]'))c.onchange=refreshPreview;refreshPreview();loadStaffHistory(member.id);
 $('save-staff').onclick=async()=>{try{const reason=$('staff-reason').value.trim();if(reason.length<3)throw Error('Enter a reason for this access change.');const status=$('staff-status').value;selected=new Set([...document.querySelectorAll('[data-perm]:checked')].map(x=>x.dataset.perm));if(status==='verified'&&!selected.size)throw Error('Verified staff must receive at least one permission or remain unverified.');if(selected.has('scope.orders.all')&&selected.has('scope.orders.assigned'))throw Error('Choose only one order scope.');$('save-staff').disabled=true;await A.api('admin.user.update',{id:member.id,expected_version:member.version,status,permissions:buildStoredPermissions([...selected]),reason});$('modal').close();A.toast('Staff access updated');await show('team');}catch(e){A.error(e);$('save-staff').disabled=false;}};
 $('revoke-staff').onclick=async()=>{try{const reason=$('staff-reason').value.trim();if(reason.length<3)throw Error('Enter a reason before revoking the session.');if(!confirm('Require this staff member to log in again?'))return;$('revoke-staff').disabled=true;await A.api('admin.user.revoke_session',{id:member.id,expected_version:member.version,reason});A.toast('Application session revoked');$('modal').close();await show('team');}catch(e){A.error(e);$('revoke-staff').disabled=false;}};
}

async function loadStaffHistory(id){const box=$('staff-history');if(!box)return;try{const rows=await A.all('audit.list',{entity:'user',entity_id:String(id),limit:25});box.innerHTML=rows.length?rows.map(r=>`<div class="history-item"><b>${esc(r.action||'Changed')}</b><div>${esc(r.note||'')}</div><small>${esc(r.occurred_at?A.date(r.occurred_at):'')}</small></div>`).join(''):'<p class="muted">No activity entries found.</p>';}catch(e){box.innerHTML='<p class="muted">History is unavailable right now.</p>';}}

const toInput=v=>v?new Date(Date.parse(v)+19800000).toISOString().slice(0,16):'';
function editCoupon(c){A.form(c?'Edit coupon':'New coupon',[
 ['code','Coupon code','text',[],true],['kind','Discount type','select',['percent','fixed']],['amount','Percentage or fixed amount (₹)','number',[],true],['minimum','Minimum subtotal (₹)','number',[],true],['cap','Maximum discount (₹), optional','number'],['eligible','Eligible retailer IDs, comma separated; blank = all','textarea'],['start','Starts at (IST)','datetime-local',[],true],['end','Ends at (IST), optional','datetime-local'],['max_uses','Total usage limit, optional','number'],['per_user_limit','Usage limit per user','number',[],true],['active','Active','checkbox']
 ],c?{...c,amount:c.value/100,minimum:c.min_paise/100,cap:c.max_discount_paise===null?'':c.max_discount_paise/100,eligible:c.eligible_users?.join(', ')||'',start:toInput(c.starts_at),end:toInput(c.ends_at)}:{kind:'percent',amount:10,minimum:0,per_user_limit:1,active:true,start:toInput(new Date().toISOString())},async v=>{let eligible=null;if(v.eligible.trim()){if(!/^\d+(\s*,\s*\d+)*$/.test(v.eligible.trim()))throw Error('Use comma-separated numeric retailer IDs.');eligible=v.eligible.split(',').map(Number);}await A.api('admin.coupon.put',{...(c?{id:c.id,expected_version:c.version}:{}),code:v.code,kind:v.kind,value:A.paise(v.amount),min_paise:A.paise(v.minimum),max_discount_paise:v.cap?A.paise(v.cap):null,eligible_users:eligible,starts_at:new Date(v.start+':00+05:30').toISOString(),ends_at:v.end?new Date(v.end+':00+05:30').toISOString():null,max_uses:v.max_uses?+v.max_uses:null,per_user_limit:+v.per_user_limit,active:v.active});await show('coupons');});}
async function usage(id){const rows=await A.all('admin.coupon.usage',{id});const data=rows.map(o=>[o.id,o.user_id,A.date(o.used_at),o.status,o.discount_paise/100,o.status==='cancelled'?'Released':o.status==='syncing'?'Reserved':'Used']);A.modal('Coupon usage',A.table(['Order','Retailer ID','Used IST','Status','Discount INR','Usage'],data.map(r=>r.map(esc)))+'<button id="export-usage" style="margin-top:18px">Export usage</button>');$('export-usage').onclick=()=>A.csv('Coupon usage',['Order','Retailer ID','Used IST','Status','Discount INR','Usage'],data,'Coupon #'+id+'; all dates');}
async function template(){const id=prompt('Template ID (letters, numbers, hyphens or underscores)');if(!id)return;let existing={id,version:0,active:true};try{existing=await A.api('template.get',{id});}catch(e){if(!/not.found|NOT_FOUND|missing/i.test(e.message))throw e;}const request_id=crypto.randomUUID();A.form('Email template: '+id,[['subject','Subject','text',[],true],['text','Plain text body','textarea',[],true],['html','HTML body, optional','textarea'],['active','Active','checkbox']],{...existing,active:existing.active===true||existing.active==='true'},async v=>{await A.api('template.put',{...v,id,expected_version:+existing.version},{request_id});});}
function compose(){const request_id=crypto.randomUUID(),id='email-'+crypto.randomUUID();A.form('Queue an email',[['to','Recipient email','email',[],true],['subject','Subject','text',[],true],['text','Message','textarea',[],true]],{},async v=>{await A.api('email.enqueue',{...v,id,entity:'settings',entity_id:'1'},{request_id});return 'Queued. Email ID: '+id;});}
async function review(){const id=prompt('Email queue ID');if(!id)return;const m=await A.api('email.get',{id});A.modal('Email '+id,`<p>${A.badge(m.state)}</p><p>To: ${esc(m.to)}<br>Subject: ${esc(m.subject)}</p><p>${esc(m.note||'')}</p>${m.state==='review'?'<label>Resolution reason<input id="email-reason" required></label><label><input type="checkbox" id="duplicate-risk">I checked delivery and accept the risk of a duplicate email.</label><button id="retry-email" class="primary">Retry sending</button>':''}`);if($('retry-email'))$('retry-email').onclick=async()=>{try{if(!$('duplicate-risk').checked||!$('email-reason').value.trim())throw Error('Provide a reason and acknowledge the duplicate risk.');await A.api('email.resolve',{id,resolution:'retry',reason:$('email-reason').value,accept_duplicate_risk:true},{request_id:crypto.randomUUID()});$('modal').close();A.toast('Email queued again');}catch(e){A.error(e);}};}
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>show(b.dataset.tab).catch(A.error);await show();
})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
