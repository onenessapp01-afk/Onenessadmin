const A=await App.init('payments',['orders']);
const {$,esc,money}=A;
const owner=A.profile?.role==='owner';
const canView=owner||A.can('finance')||A.can('payments.view');
if(!canView)throw Error('Payment view permission required.');
const canCollect=owner||A.can('payments.cod_collect');
let orders=[],shown=[],page=1,pageSize=50,current=null,sheetMode=false,denseMode=false,lastLoadedAt=null;

const payLabel=t=>({cash:'Cash',phonepe:'PhonePe',upi:'UPI / QR',bank_transfer:'Bank Transfer',other:'Other',gateway:'Payment Gateway'})[t]||'—';
const retailer=o=>o.business_name||o.customer_name||`Retailer #${o.user_id}`;
const customerSub=o=>[o.customer_name&&o.customer_name!==o.business_name?o.customer_name:'',o.customer_phone||''].filter(Boolean).join(' · ');
const effectiveRecordType=o=>{
 if(o.payment_record_type)return o.payment_record_type;
 if(o.payment_method==='online')return o.payment_status==='collected'?'gateway':'pending';
 if(o.payment_status==='collected')return 'legacy';
 return 'pending';
};
const recordLabel=o=>{
 const t=effectiveRecordType(o);
 if(t==='legacy')return 'Legacy collection';
 if(t==='pending')return o.payment_method==='online'?'Gateway pending':'Not recorded';
 return payLabel(t);
};
const recordClass=o=>effectiveRecordType(o);
const recordedAt=o=>o.payment_recorded_at||o.collected_at||null;
const date=v=>v?A.date(v):'—';

const loadExternalScript=src=>new Promise((resolve,reject)=>{
 const existing=[...document.scripts].find(s=>s.src===src);
 if(existing){if(existing.dataset.loaded==='1')return resolve();existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return}
 const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>{s.dataset.loaded='1';resolve()};s.onerror=()=>reject(Error('Could not load export library. Check your connection.'));document.head.append(s);
});

 const avatar=A.profile?.avatar_url?`<img id="admin-avatar-img" src="${esc(A.profile.avatar_url)}" alt="">`:`<span class="avatar-initial">${esc(initial)}</span>`;
 bottom.className='bottom admin-bottom-card';
 bottom.innerHTML=`<div class="admin-profile"><button id="avatar-btn" class="avatar-btn" title="Change profile photo">${avatar}</button><div class="admin-profile-copy"><b>${esc(A.profile?.name||'Administrator')}</b><span>${esc(A.profile?.role||'admin')}</span></div></div><div class="admin-panel-label">ONeness admin panel<br>Click photo to update profile image</div>`;

async function avatarBase64(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPG, PNG or WebP for the profile photo.');
 const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
 const size=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-size)/2,sy=(img.naturalHeight-size)/2;
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;canvas.getContext('2d').drawImage(img,sx,sy,size,size,0,0,512,512);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.86));if(!blob)throw Error('Could not prepare profile photo.');
 return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)});
}
async function uploadAvatar(){

 const btn=$('avatar-btn');btn.classList.add('avatar-uploading');

  const {data,error}=await A.client.functions.invoke('admin-avatar-upload',{body:{base64,name:file.name||'avatar.webp'}});
  if(error||data?.ok!==true)throw Error(data?.error?.message||error?.message||'Profile photo upload failed.');
  A.profile.avatar_url=data.data.url;

 }catch(e){A.error(e)}finally{btn.classList.remove('avatar-uploading');$('avatar-file').value=''}
}

async function exportPdf(){
 await loadExternalScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
 const jspdf=window.jspdf;
 if(!jspdf?.jsPDF)throw Error('PDF export library did not load.');
 const rows=filtered();
 const doc=new jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
 const pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight();
 const margin=24,rowH=22,headerH=23;
 const cols=[
  {k:'order',label:'Order',w:52},
  {k:'retailer',label:'Retailer / Shop',w:118},
  {k:'amount',label:'Amount INR',w:66},
  {k:'method',label:'Order Payment',w:72},
  {k:'via',label:'Received Via',w:78},
  {k:'ref',label:'Reference',w:100},
  {k:'time',label:'Recorded / Paid At',w:108},
  {k:'payment',label:'Payment',w:62},
  {k:'status',label:'Order Status',w:70}
 ];
 const totalW=cols.reduce((n,c)=>n+c.w,0);
 const scale=Math.min(1,(pageW-margin*2)/totalW);
 cols.forEach(c=>c.w*=scale);

 function header(){
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(23,99,76);
  doc.text('ONeness Payment Statement',margin,24);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(90,105,97);
  doc.text(`${A.range().label} · Generated ${date(new Date())}`,margin,38);
  let x=margin,y=48;
  doc.setFillColor(23,99,76);doc.rect(margin,y,pageW-margin*2,headerH,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(6.7);
  for(const c of cols){doc.text(c.label,x+3,y+14,{maxWidth:c.w-6});x+=c.w}
  return y+headerH;
 }
 function rowData(o){
  return {
   order:`ON${o.id}`,
   retailer:retailer(o),
   amount:(Number(o.total_paise||0)/100).toFixed(2),
   method:String(o.payment_method||'').toUpperCase(),
   via:recordLabel(o),
   ref:o.payment_reference||'—',
   time:date(recordedAt(o)),
   payment:o.payment_status||'',
   status:o.status||''
  };
 }

 let y=header(),rowIndex=0;
 for(const o of rows){
  if(y+rowH>pageH-28){doc.addPage();y=header()}
  let x=margin;
  if(rowIndex%2){doc.setFillColor(248,250,248);doc.rect(margin,y,pageW-margin*2,rowH,'F')}
  const r=rowData(o);
  doc.setDrawColor(225,231,226);doc.line(margin,y+rowH,pageW-margin,y+rowH);
  doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(31,46,39);
  for(const c of cols){
   const lines=doc.splitTextToSize(String(r[c.k]??''),Math.max(16,c.w-6));
   doc.text(lines.slice(0,2),x+3,y+8,{baseline:'top'});
   x+=c.w;
  }
  y+=rowH;rowIndex++;
 }
 doc.setFontSize(7);doc.setTextColor(100,110,104);
 doc.text(`Total records: ${rows.length}`,margin,pageH-12);
 doc.save(`oneness-payments-${A.today()}.pdf`);
}

  const d=await A.api('order.details',{id}),o=d.order||listOrder||{},c=d.customer||{},t=effectiveRecordType(o);
  current=o;
  const manual=t!=='gateway'&&t!=='pending';
  const recordClassName=t==='gateway'?'gateway':t==='legacy'?'legacy':t==='pending'?'pending':'';
  const recordTitle=t==='gateway'?'Payment gateway record':t==='legacy'?'Legacy COD collection':t==='pending'?(o.payment_method==='online'?'Awaiting payment gateway':'Payment not recorded'):'Manual payment record';
  const recordBody=t==='legacy'
    ?`This order was marked collected before detailed payment tracking was added. No received-via method or reference was stored.`
    :t==='pending'
      ?(o.payment_method==='online'?'The payment gateway will add the payment confirmation, transaction reference and payment time automatically.':'Record the payment when the COD amount is received.')
      :'';
  $('modal-sub').textContent=`${esc(retailer(listOrder||o))} · ${esc((o.payment_method||'—').toUpperCase())} · ${esc(o.payment_status||'—')}`;
  $('modal-body').innerHTML=`
   <div class="detail-hero">
    <div class="hero-amount"><span>Order amount</span><strong>${money(o.total_paise)}</strong></div>
    <div class="hero-state"><span>Payment status</span><b>${esc(o.payment_status||'—')}</b><span style="display:block;margin-top:6px">Order status</span><b>${esc(o.status||'—')}</b></div>
   </div>
   <section class="detail-card"><h3>Customer / retailer</h3><div class="detail-grid"><div><span>Business</span><b>${esc(c.business_name||listOrder?.business_name||'—')}</b></div><div><span>Customer</span><b>${esc(c.name||listOrder?.customer_name||'—')}</b></div>${d.show_contact?`<div><span>Mobile</span><b>${esc(c.phone||'—')}</b></div><div><span>Email</span><b>${esc(c.email||'—')}</b></div>`:''}</div></section>
   <section class="detail-card"><h3>Payment record</h3>
    <div class="payment-record-box ${recordClassName}">
     <h4>${esc(recordTitle)}</h4>
     ${recordBody?`<div style="font-size:8px;line-height:1.45">${esc(recordBody)}</div>`:''}
     <div class="detail-grid" style="margin-top:${recordBody?'8px':'0'}">
      <div><span>Order payment method</span><b>${esc((o.payment_method||'—').toUpperCase())}</b></div>
      <div><span>Actually received via</span><b>${esc(recordLabel(o))}</b></div>
      <div><span>Reference / UTR</span><b>${esc(o.payment_reference||'—')}</b></div>
      <div><span>Recorded / paid at</span><b>${esc(date(recordedAt(o)))}</b></div>
      <div><span>Recorded by</span><b>${esc(d.payment_recorded_by_name||listOrder?.payment_recorded_by_name||(t==='gateway'?'Payment Gateway':'—'))}</b></div>
      <div><span>Collected at</span><b>${esc(date(o.collected_at))}</b></div>
     </div>
     ${o.payment_note?`<div class="record-note">${esc(o.payment_note)}</div>`:''}
    </div>
    <div class="modal-actions">
     <a class="button" href="orders.html?id=${o.id}">Open full order</a>
     ${o.payment_status==='collected'?`<button id="detail-receipt" class="receipt-btn">Print payment receipt</button>`:''}
     ${canCollect&&o.payment_method==='cod'&&o.status!=='cancelled'&&(o.payment_status!=='collected'||!o.payment_record_type)?`<button id="detail-record" class="record-btn">${o.payment_status==='collected'?'Complete payment record':'Record payment'}</button>`:''}
    </div>
   </section>`;
  if($('detail-record'))$('detail-record').onclick=()=>{$('payment-modal').close();openRecord(o.id)};
  if($('detail-receipt'))$('detail-receipt').onclick=async()=>{const b=$('detail-receipt');b.disabled=true;try{await printPaymentReceipt(o.id)}catch(e){A.error(e)}finally{b.disabled=false}};
 }catch(e){$('modal-body').innerHTML=`<div class="notice error">${esc(e.message||'Could not load payment')}</div>`}
}

function timeOptions(selected=''){
 const rows=[];
 for(let h=0;h<24;h++)for(const m of [0,15,30,45]){
  const value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const d=new Date(`2000-01-01T${value}:00`);
  const label=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  rows.push(`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`);
 }
 return rows.join('');
}
function istDay(offset=0){return new Date(Date.now()+19800000+offset*86400000).toISOString().slice(0,10)}
function nearestQuarter(){
 const d=new Date(Date.now()+19800000),h=d.getUTCHours(),m=Math.floor(d.getUTCMinutes()/15)*15;
 return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
let recordOrder=null;
function setTimeMode(mode){
 const f=$('record-form'),existing=!!recordOrder?.payment_recorded_at;
 f.elements.time_mode.value=mode;
 for(const b of f.querySelectorAll('[data-time]')){b.hidden=b.dataset.time==='keep'&&!existing;b.classList.toggle('active',b.dataset.time===mode)}
 $('time-extra').hidden=!['today','yesterday','custom'].includes(mode);
 $('custom-date-wrap').hidden=mode!=='custom';
}
function openRecord(id){
 const o=orders.find(x=>+x.id===+id);if(!o)return;
 if(o.payment_method==='online'){A.toast('Online payment records are added automatically by the payment gateway.');return}
 recordOrder=o;
 $('record-title').textContent=`${o.payment_status==='collected'?'Complete':'Record'} payment · #ON${id}`;
 $('record-sub').textContent=`${retailer(o)} · ${money(o.total_paise)} · COD`;
 const f=$('record-form');
 f.elements.record_type.value=o.payment_record_type||'cash';
 f.elements.reference.value=o.payment_reference||'';
 f.elements.note.value=o.payment_note||'';
 f.elements.pay_time.innerHTML=timeOptions(nearestQuarter());
 f.elements.pay_date.value=istDay(0);f.elements.pay_date.max=istDay(0);
 setTimeMode(o.payment_recorded_at?'keep':'now');
 $('record-modal').showModal();
}
for(const b of document.querySelectorAll('[data-time]'))b.onclick=()=>setTimeMode(b.dataset.time);
$('record-form').onsubmit=async e=>{
 e.preventDefault();
 if(!recordOrder)return;
 const f=e.currentTarget,btn=f.querySelector('[type=submit]'),mode=f.elements.time_mode.value;
 const data={id:recordOrder.id,expected_version:recordOrder.version,record_type:f.elements.record_type.value,reference:f.elements.reference.value.trim(),note:f.elements.note.value.trim()};
 if(mode==='now')data.recorded_at_mode='now';
 else if(mode==='today'||mode==='yesterday'||mode==='custom'){
  const day=mode==='today'?istDay(0):mode==='yesterday'?istDay(-1):f.elements.pay_date.value;
  const time=f.elements.pay_time.value;
  if(!day||!time){A.error(Error('Choose a valid payment day and time.'));return}
  data.recorded_at=`${day}T${time}:00+05:30`;
 }
 btn.disabled=true;
 try{
  await A.api('payment.collect',data);
  $('record-modal').close();A.toast('Payment record saved');await load();
  if($('payment-modal').open)await openPayment(recordOrder.id);
 }catch(err){A.error(err)}finally{btn.disabled=false}
};

function exportCsv(){
 const rows=filtered();
 A.csv('Payments',
 ['Order ID','Retailer','Customer','Mobile','Order Created IST','Amount INR','Order Payment Method','Payment Status','Received Via','Payment Reference','Payment Recorded IST','Recorded By','Collected IST','Payment Note','Order Status'],
 rows.map(o=>[o.id,o.business_name||'',o.customer_name||'',o.customer_phone||'',date(o.created_at),Number(o.total_paise||0)/100,o.payment_method,o.payment_status,recordLabel(o),o.payment_reference||'',date(o.payment_recorded_at),o.payment_recorded_by_name||'',date(o.collected_at),o.payment_note||'',o.status]),
 A.range().label+'; '+$('basis').textContent
 );
}

A.wireDates(()=>{page=1;render()});
for(const id of ['search','status','method','received','date-basis'])$(id).oninput=()=>{page=1;render()};
$('clear').onclick=()=>{$('search').value='';$('status').value='';$('method').value='';$('received').value='';$('date-basis').value='payment';$('from').value='';$('to').value='';$('period').value='all';page=1;render()};
$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('page-size').onchange=()=>{pageSize=+$('page-size').value;page=1;render()};
$('refresh').onclick=()=>load().catch(A.error);
$('export').onclick=()=>{try{exportCsv()}catch(e){A.error(e)}};
$('excel').onclick=async()=>{try{await exportExcel()}catch(e){A.error(e)}};
$('pdf').onclick=async()=>{try{await exportPdf()}catch(e){A.error(e)}};
$('print-statement').onclick=()=>{try{printPaymentStatement()}catch(e){A.error(e)}};
$('sheet-view').onclick=()=>toggleSheetMode();
$('exit-sheet').onclick=()=>exitSheetMode();
$('sheet-density').onclick=toggleDensity;
$('sheet-refresh').onclick=()=>load().catch(A.error);
$('sheet-export').onclick=()=>{try{exportCsv()}catch(e){A.error(e)}};
$('sheet-excel').onclick=async()=>{try{await exportExcel()}catch(e){A.error(e)}};
$('sheet-pdf').onclick=async()=>{try{await exportPdf()}catch(e){A.error(e)}};
$('sheet-print').onclick=()=>{try{printPaymentStatement()}catch(e){A.error(e)}};
document.addEventListener('fullscreenchange',()=>{
 if(!document.fullscreenElement&&sheetMode){
  sheetMode=false;
  $('paymentWorkspace').classList.remove('fullscreen-sheet');
  document.body.classList.remove('pay-sheet-lock');
  syncSheetButtons();
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&sheetMode&&!$('payment-modal').open&&!$('record-modal').open)exitSheetMode();
});
$('modal-x').onclick=()=>$('payment-modal').close();
$('record-x').onclick=$('record-cancel').onclick=()=>$('record-modal').close();

await load();
const qid=+new URLSearchParams(location.search).get('id');
if(qid)await openPayment(qid);

})().catch(e=>{if(window.App)App.fail(e);else document.body.textContent='Could not load ONeness payments. '+(e.message||e)});
</script>
