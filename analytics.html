<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b32"><meta name="referrer" content="no-referrer"><title>ONeness · Analytics</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%2317634c%27/%3E%3Ctext x=%2713%27 y=%2748%27 font-size=%2747%27 fill=%27white%27%3EO%3C/text%3E%3C/svg%3E">
<style>body{margin:0;background:#f4f6f2;font-family:system-ui}#boot{padding:30px;color:#426052}</style>
</head><body>
<div id="app"><p id="boot">Opening ONeness…</p></div>
<script>
(async()=>{

const response=await fetch(new URL('index.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep index.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){
 const node=shared.getElementById(id);if(!node)throw Error('index.html is incomplete.');
 document.head.append(node.cloneNode(true));
}
const source=shared.getElementById('oneness-core');if(!source)throw Error('index.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('analytics',['finance','orders']),{$,esc,money}=A;
let orders=[],products=[],users=[],coupons=[],rows=[],headers=[],building=false,cancel=false,meta='',reportTitle='';const snapshots=new Map();
$('view').innerHTML=A.header('Reports & insights','Date-wise reports with clear totals and complete CSV exports.','<button id="export" disabled>Export CSV</button><button id="print" disabled>Print / PDF</button>')+`<div class="filters"><label>Report<select id="report"><option value="orders">Orders</option><option value="sales">Delivered sales</option><option value="collections">Cash collections</option><option value="outstanding">Outstanding · current</option><option value="products">Product sales</option><option value="retailers">Retailer summary</option><option value="coupons">Coupon usage</option><option value="inventory">Inventory · current</option></select></label>${A.dateFields()}<label>Search within report<input id="search" placeholder="ID or name"></label><label id="threshold-field" hidden>Low-stock threshold<input id="threshold" type="number" min="1" value="10"></label><button class="primary" id="generate">Generate report</button><button id="cancel" hidden>Stop</button></div><p class="muted" id="progress">Select a report and generate it.</p><div id="warnings"></div><div id="numbers"></div><div id="chart" class="card" hidden style="margin-bottom:20px"></div><div id="result"></div>`;
const name=id=>users.find(u=>u.id===id)?.business_name||users.find(u=>u.id===id)?.name||'Retailer #'+id;
const amount=n=>Number((n/100).toFixed(2));
function inputChanged(){if(building){cancel=true;}$('export').disabled=true;$('print').disabled=true;$('progress').textContent='Filters changed. Generate the report again.';}
function delivered(r){return orders.filter(o=>o.status==='delivered'&&((r.start===-Infinity&&r.end===Infinity)||A.inRange(o.delivered_at,r)));}
async function generate(){if(building)return;building=true;cancel=false;rows=[];$('result').innerHTML='';$('warnings').innerHTML='';$('numbers').innerHTML='';$('chart').hidden=true;$('generate').disabled=true;$('cancel').hidden=false;$('export').disabled=true;$('print').disabled=true;
 try{const type=$('report').value,r=A.range(),q=$('search').value.trim().toLowerCase();orders=await A.all('orders.list',{},n=>$('progress').textContent=`Loaded ${n} order headers…`);if(cancel)throw Error('Report cancelled. No partial export was produced.');if(A.can('users'))users=await A.all('admin.users');if(A.can('coupons'))coupons=await A.all('admin.coupons');const created=orders.filter(o=>A.inRange(o.created_at,r)),sales=delivered(r);let total=null,basis='';
  if(['sales','products','retailers'].includes(type)){const missing=orders.filter(o=>o.status==='delivered'&&!o.delivered_at).length;if(missing)$('warnings').innerHTML=`<div class="notice">${missing} delivered orders have no recorded delivery timestamp. They are excluded from dated sales reports. “All dates” includes them. Install the reporting SQL to record future delivery timestamps.</div>`;}
  if(type==='orders'){headers=['Order ID','Retailer','Created IST','Status','Total INR','Discount INR','Payment'];rows=created.map(o=>[o.id,name(o.user_id),A.date(o.created_at),o.status,amount(o.total_paise),amount(o.discount_paise),o.payment_status]);basis='Order creation date; all statuses';total=created.filter(o=>!['syncing','cancelled'].includes(o.status)).reduce((n,o)=>n+o.total_paise,0);}
  if(type==='sales'){headers=['Order ID','Retailer','Delivered IST','Net order INR','Coupon discount INR','Payment'];rows=sales.map(o=>[o.id,name(o.user_id),A.date(o.delivered_at),amount(o.total_paise),amount(o.discount_paise),o.payment_status]);basis='Delivery date; net total includes delivery charges';total=sales.reduce((n,o)=>n+o.total_paise,0);}
  if(type==='collections'){const data=orders.filter(o=>o.payment_status==='collected'&&A.inRange(o.collected_at,r));headers=['Order ID','Retailer','Collected IST','Collected INR'];rows=data.map(o=>[o.id,name(o.user_id),A.date(o.collected_at),amount(o.total_paise)]);basis='Cash collection date';total=data.reduce((n,o)=>n+o.total_paise,0);}
  if(type==='outstanding'){const data=orders.filter(o=>o.status==='delivered'&&o.payment_status==='unpaid');headers=['Order ID','Retailer','Delivered IST','Outstanding INR','Days since delivery'];rows=data.map(o=>[o.id,name(o.user_id),A.date(o.delivered_at),amount(o.total_paise),o.delivered_at?Math.max(0,Math.floor((Date.now()-Date.parse(o.delivered_at))/86400000)):'Unknown']);basis='Current delivered-unpaid snapshot; date range is not applied';total=data.reduce((n,o)=>n+o.total_paise,0);}
  if(type==='products'){const grouped=new Map();for(let i=0;i<sales.length;i++){if(cancel)throw Error('Report cancelled. No partial export was produced.');const o=sales[i];$('progress').textContent=`Reading saved order items ${i+1} of ${sales.length}…`;let d=snapshots.get(o.id);if(!d){d=(await A.api('order.details',{id:o.id})).details;snapshots.set(o.id,d);}for(const p of d.items){const x=grouped.get(p.product_id)||{id:p.product_id,title:p.title||'Product #'+p.product_id,qty:0,value:0};x.qty+=p.qty;x.value+=p.qty*p.unit_price_paise;grouped.set(p.product_id,x);}}headers=['Product ID','Product','Quantity delivered','Item value INR'];rows=[...grouped.values()].sort((a,b)=>b.value-a.value).map(x=>[x.id,x.title,x.qty,amount(x.value)]);basis='Delivery date; saved item prices before order-level coupons and shipping';total=[...grouped.values()].reduce((n,x)=>n+x.value,0);}
  if(type==='retailers'){const grouped=new Map();function get(id){if(!grouped.has(id))grouped.set(id,{id,orders:0,sales:0,collected:0,outstanding:0});return grouped.get(id);}for(const o of sales){const x=get(o.user_id);x.orders++;x.sales+=o.total_paise;}for(const o of orders){if(o.payment_status==='collected'&&A.inRange(o.collected_at,r))get(o.user_id).collected+=o.total_paise;if(o.status==='delivered'&&o.payment_status==='unpaid')get(o.user_id).outstanding+=o.total_paise;}headers=['Retailer ID','Retailer','Delivered orders in period','Delivered INR in period','Collected INR in period','Outstanding INR now'];rows=[...grouped.values()].map(x=>[x.id,name(x.id),x.orders,amount(x.sales),amount(x.collected),amount(x.outstanding)]);basis='Sales by delivery date; cash by collection date; outstanding is current';}
  if(type==='coupons'){headers=['Coupon','Order ID','Retailer','Used IST','Order status','Discount INR','Usage state'];rows=created.filter(o=>o.coupon_id).map(o=>[coupons.find(c=>c.id===o.coupon_id)?.code||'Coupon #'+o.coupon_id,o.id,name(o.user_id),A.date(o.created_at),o.status,amount(o.discount_paise),o.status==='cancelled'?'Released':o.status==='syncing'?'Reserved':'Used']);basis='Order creation date; cancelled uses are released';}
  if(type==='inventory'){if(!A.can('catalog'))throw Error('Catalogue permission is needed for the complete inventory report.');products=await A.all('products.list');headers=['Product ID','Product','Stock','Unit','Wholesale INR','MRP INR','Wholesale stock value INR','Low stock','Active'];const threshold=Math.max(1,Number($('threshold').value)||10);rows=products.map(p=>[p.id,p.title,p.stock,p.unit,amount(p.price_paise),amount(p.mrp_paise),amount(p.stock*p.price_paise),p.stock<threshold?'Yes':'No',p.active?'Yes':'No']);basis=`Current stock snapshot; threshold ${threshold}; valuation uses wholesale price, not cost`;}
  if(cancel)throw Error('Report cancelled. No partial export was produced.');rows=rows.filter(row=>row.join(' ').toLowerCase().includes(q));reportTitle=$('report').selectedOptions[0].text;meta=(['outstanding','inventory'].includes(type)?'As of '+A.date(new Date()):r.label)+'; '+basis+'; search='+q;
  // Money cards are suppressed when text search narrows the report to avoid mismatched totals.
  const metrics=[['Report rows',rows.length,basis]];if(total!==null&&!q)metrics.push([type==='orders'?'Confirmed order value':'Report value',money(total),type==='orders'?'Excludes syncing and cancelled':'Before any text search']);
  if(!q&&Number.isFinite(r.start)&&Number.isFinite(r.end)&&['orders','sales','collections'].includes(type)){const previous={start:r.start-(r.end-r.start),end:r.start};const before=type==='orders'?orders.filter(o=>A.inRange(o.created_at,previous)).length:type==='sales'?delivered(previous).reduce((n,o)=>n+o.total_paise,0):orders.filter(o=>o.payment_status==='collected'&&A.inRange(o.collected_at,previous)).reduce((n,o)=>n+o.total_paise,0);metrics.push(['Previous equal period',type==='orders'?before:money(before),'Compared using the same date basis']);}
  $('numbers').innerHTML=A.cards(metrics);$('result').innerHTML=A.table(headers,rows.slice(0,250).map(row=>row.map(esc)));$('progress').textContent=`${rows.length} matching rows. Displaying ${Math.min(250,rows.length)}; CSV and print include all ${rows.length}. ${basis}.`;$('export').disabled=false;$('print').disabled=false;
  if(type==='orders'){const counts=new Map();for(const row of rows)counts.set(row[3],(counts.get(row[3])||0)+1);const max=Math.max(1,...counts.values());$('chart').hidden=false;$('chart').innerHTML='<h2>Order status in matching records</h2><div class="bars">'+[...counts].map(([s,n])=>`<div class="bar"><span>${esc(s)}</span><i style="width:${n/max*100}%"></i><b>${n}</b></div>`).join('')+'</div>';}
 }catch(e){$('progress').textContent=A.error(e);rows=[];$('export').disabled=true;$('print').disabled=true;}finally{building=false;$('generate').disabled=false;$('cancel').hidden=true;}
}
$('generate').onclick=generate;$('cancel').onclick=()=>{cancel=true;};$('export').onclick=()=>A.csv(reportTitle,headers,rows,meta);$('print').onclick=()=>A.print(reportTitle,`<p>${esc(meta)}</p>`+A.table(headers,rows.map(row=>row.map(esc))));A.wireDates(inputChanged);for(const id of ['search','threshold'])$(id).oninput=inputChanged;$('report').onchange=()=>{const snapshot=['inventory','outstanding'].includes($('report').value);for(const id of ['from','to','period'])$(id).disabled=snapshot;$('threshold-field').hidden=$('report').value!=='inventory';inputChanged();};

})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
</body></html>
