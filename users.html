<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b32"><meta name="referrer" content="no-referrer"><title>ONeness · Users</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%2317634c%27/%3E%3Ctext x=%2713%27 y=%2748%27 font-size=%2747%27 fill=%27white%27%3EO%3C/text%3E%3C/svg%3E">
<style>body{margin:0;background:#f4f6f2;font-family:system-ui}#boot{padding:30px;color:#426052}</style>
</head><body>
<div id="app"><p id="boot">Opening ONeness…</p></div>
<script>
(async()=>{

const response=await fetch(new URL('index.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep index.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){
 const node=shared.getElementById(id);if(!node)throw Error('index.html is incomplete.');
 document.head.append(node.cloneNode(true));
}
const source=shared.getElementById('oneness-core');if(!source)throw Error('index.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('users',['users']),{$,esc,money}=A;let users=[],orders=[],shown=[],page=1;
$('view').innerHTML=A.header('People & permissions','Approve retail partners and manage your team.','<button id="refresh">Refresh</button><button id="export">Export CSV</button>')+`<div class="filters"><label>Search<input id="search" placeholder="Name, shop, email or phone"></label><label>Account type<select id="type"><option value="retailer">Retailers</option><option value="staff">Admin staff</option><option value="">All accounts</option></select></label>${A.dateFields()}<label>Status<select id="status"><option value="">All statuses</option><option>pending</option><option>active</option><option>blocked</option></select></label></div><p class="muted" id="count"></p><div id="list"></div><div class="row" style="margin-top:18px"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div>`;
$('from').value='';$('to').value='';$('period').value='all';
async function load(){users=await A.all('admin.users');if(A.can('orders')&&A.can('finance'))orders=await A.all('orders.list');render();}
function filtered(){const r=A.range();const q=$('search').value.toLowerCase(),t=$('type').value,s=$('status').value;return users.filter(u=>A.inRange(u.created_at,r)&&(`${u.id} ${u.name} ${u.business_name} ${u.email} ${u.phone}`).toLowerCase().includes(q)&&(!t||(t==='staff'?u.role!=='retailer':u.role==='retailer'))&&(!s||u.status===s));}
function render(){try{shown=filtered();page=Math.max(1,Math.min(page,Math.ceil(shown.length/25)));$('count').textContent=shown.length+' accounts';$('list').innerHTML=A.table(['Partner','Contact','Role','Status','COD',''],shown.slice((page-1)*25,page*25).map(u=>[`<b>${esc(u.business_name||u.name)}</b><br><small>#${u.id} · ${esc(u.name)}</small>`,`${esc(u.email)}<br><small>${esc(u.phone)}</small>`,A.badge(u.role),A.badge(u.status),u.cod_allowed?'Allowed':'Disabled',`<button data-open="${u.id}" class="small">Manage</button>`]));$('page').textContent='Page '+page;$('prev').disabled=page===1;$('next').disabled=page*25>=shown.length;for(const b of document.querySelectorAll('[data-open]'))b.onclick=()=>manage(users.find(u=>u.id===+b.dataset.open));}catch(e){A.error(e);}}
function manage(u){const own=A.profile.role==='owner';if(!own&&u.role!=='retailer'){A.toast('Only the owner can manage staff accounts.');return;}const fields=[['status','Account status','select',['pending','active','blocked']],['cod_allowed','Allow COD orders','checkbox']];if(own)fields.push(['role','Role','select',['retailer','admin','owner']],['permissions','Permissions, comma separated: catalog, orders, finance, users, settings, coupons, audit, notifications','textarea']);fields.push(['reason','Reason','text',[],true]);A.form('Manage '+(u.business_name||u.name||'#'+u.id),fields,{...u,permissions:u.permissions.join(', ')},async v=>{const data={id:u.id,expected_version:u.version,status:v.status,cod_allowed:v.cod_allowed,reason:v.reason};if(own){data.role=v.role;data.permissions=v.permissions.split(',').map(x=>x.trim()).filter(Boolean);if(data.permissions.some(p=>!['catalog','orders','finance','users','settings','coupons','audit','notifications'].includes(p)))throw Error('Unknown permission name.');}await A.api('admin.user.update',data);await load();});const extra=document.createElement('div');extra.style.marginTop='22px';const purchases=orders.filter(o=>o.user_id===u.id);if(A.can('orders')&&A.can('finance'))extra.innerHTML=A.cards([['Delivered value',money(purchases.filter(o=>o.status==='delivered').reduce((n,o)=>n+o.total_paise,0))],['Outstanding COD',money(purchases.filter(o=>o.status==='delivered'&&o.payment_status==='unpaid').reduce((n,o)=>n+o.total_paise,0))]])+`<a class="button" href="orders.html">Open order history</a>`;if(A.can('audit')){const b=document.createElement('button');b.textContent='Activity log';b.onclick=()=>A.logs('user',u.id).catch(A.error);extra.append(b);}$('dialog-body').append(extra);}
A.wireDates(()=>{page=1;render();});for(const id of ['search','type','status'])$(id).oninput=()=>{page=1;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('refresh').onclick=()=>load().catch(A.error);$('export').onclick=()=>{try{A.csv('Users',['ID','Name','Business','Email','Phone','Role','Status','COD allowed','Created IST'],filtered().map(u=>[u.id,u.name,u.business_name,u.email,u.phone,u.role,u.status,u.cod_allowed,A.date(u.created_at)]),'Accounts created '+A.range().label);}catch(e){A.error(e);}};await load();

})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
</body></html>
